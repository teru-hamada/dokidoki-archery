        );
        neck.position.set(0.016, localY + (isUpper ? 0.028 : -0.028), 0.000);
        neck.rotation.z = isUpper ? -0.10 : 0.10;
        g.add(neck);

        return g;
      }

      riserGroup.add(createLimbPocket(0.255, -0.20));
      riserGroup.add(createLimbPocket(-0.255, 0.20));

      // riser 配置
      riserGroup.position.copy(toWorld(new THREE.Vector3(0, 0, 0)));
      riserGroup.rotation.set(0, bowTiltY + riserYawOffset, 0, "XYZ");

      // --------------------------------------------------
      // limb メッシュ
      // --------------------------------------------------
      const upperLimbMesh = new THREE.Mesh(
        createTaperedLimbGeometry(createUpperLimbCurve(0, 0)),
        limbMaterial
      );
      const lowerLimbMesh = new THREE.Mesh(
        createTaperedLimbGeometry(createLowerLimbCurve(0, 0)),
        limbMaterial
      );

      limbGroup.add(upperLimbMesh);
      limbGroup.add(lowerLimbMesh);
      applyLocalTransform(limbGroup, new THREE.Vector3(0, 0, 0));

      // --------------------------------------------------
      // limb tip
      // --------------------------------------------------
      function createTipMesh() {
        const g = new THREE.Group();

        // tip の本体
        const cap = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.011, 0.032, 5, 12),
          darkDetailMaterial
        );
        cap.rotation.z = Math.PI / 2;
        g.add(cap);

        // tip の groove 部分
        const groove = new THREE.Mesh(
          new THREE.BoxGeometry(0.010, 0.006, 0.014),
          detailMaterial
        );
        groove.position.set(0.012, 0, 0);
        g.add(groove);

        // tipグループ原点から見た「弦がかかる位置」
        g.userData.grooveLocal = groove.position.clone();

        return g;
      }

      const upperTip = createTipMesh();
      const lowerTip = createTipMesh();
      tipGroup.add(upperTip);
      tipGroup.add(lowerTip);

      //--------------------------------------------------
      // tip の向きを limb 曲線に合わせる
      //--------------------------------------------------
      function updateTipTransform(tipMesh, curve, isUpper) {
        // t は曲線上の位置を表すパラメータで、0 から 1 の範囲で指定する。isUpper が true の場合は曲線の先端（t=1）に、false の場合は曲線の根元（t=0）に tip を配置する。
        const t = isUpper ? 1 : 0;
        // sampleT は曲線上のサンプル位置を表すパラメータで、tip の向きを決定するために使用する。isUpper が true の場合は曲線の根元（t=0.015）に、false の場合は曲線の先端（t=0.985）にサンプル位置を設定する。
        const sampleT = isUpper ? 0.985 : 0.015;
        // 曲線上の位置と接線を取得
        const localPos = curve.getPointAt(t);
        const tangent = (
          isUpper
            ? curve.getPointAt(t).clone().sub(curve.getPointAt(sampleT))
            : curve.getPointAt(sampleT).clone().sub(curve.getPointAt(t))
        ).normalize();

        // worldPos は tip のワールド座標を計算する。toWorld 関数を使用して、ローカル座標系からワールド座標系に変換する。
        const worldPos = toWorld(localPos);
        // worldTarget は tip の向きを決定するためのターゲット位置を計算する。接線方向にオフセットを加えて、tip の向きを調整する。
        const worldTarget = toWorld(localPos.clone().add(tangent));
        
        // m は tip の向きを決定するためのマトリクスを計算する。lookAt 関数を使用して、tip の位置（worldPos）からターゲット位置（worldTarget）を向くように設定する。
        const m = new THREE.Matrix4().lookAt(
          worldPos,
          worldTarget,
          new THREE.Vector3(0, 1, 0)
        );

        // q は tip の回転を表すクォータニオンを計算する。マトリクス m から回転を抽出し、さらに Y 軸周りに 90 度回転させることで、tip の向きを調整する。
        const q = new THREE.Quaternion()
          .setFromRotationMatrix(m)
          .multiply(new THREE.Quaternion().setFromEuler(
            new THREE.Euler(0, Math.PI / 2, 0)
          ));

        tipMesh.quaternion.copy(q);

        // groove のローカル位置を回転後のワールド方向へ変換
        const grooveLocal = (tipMesh.userData.grooveLocal ?? new THREE.Vector3(0, 0, 0)).clone();
        const grooveWorldOffset = grooveLocal.applyQuaternion(q);

        // groove が limb先端(localPos) に一致するように、tip本体を逆オフセット
        tipMesh.position.copy(worldPos.clone().sub(grooveWorldOffset));
      }

      // --------------------------------------------------
      // 弦のローカル基準点
      // --------------------------------------------------
      function getStringLocals(draw = 0, kick = 0) {
        // 弦のたわみ量を計算する。draw は弦を引いた量、kick は弓の反動を表す。これらの値を組み合わせて、弦のたわみ量を決定する。
        const flex = draw * 0.045 + kick * 0.025;
        // 矢を引いた時の弦の先端の移動量（前方向）
        const tipForward = flex * 1.00;
        // 矢を引いた時の弦の横方向の移動量（左右）
        const tipSide = flex * 0.00;
        // 矢を引いた時の弦端の上下移動量
        // 上側は下へ、下側は上へ
        const topTipDown = draw * 0.050;
        const bottomTipUp = draw * 0.030;
        // 弦を左へ移動させるオフセット（値を大きくすると左へ）
        const stringLeftOffset = 0.08;
        // 弦を手前へ移動させるオフセット（値を大きくすると手前へ）
        const stringForwardOffset = 0.10;
        // 弦全体を上下に移動させるオフセット
        const stringUpOffset = 0.05;
        // 弦の上下長を短くする量（値を大きくすると短くなる）
        const stringShorten = 0.10;

        // baseTopLocal と baseBotLocal は、弦の上端と下端の基準位置を表すベクトルで、弦のたわみやオフセットを考慮して計算される。
        const baseTopLocal = new THREE.Vector3(
          0.002 + tipSide * 0.08 - stringLeftOffset,
          bowHalfLen + stringUpOffset,
          0.146 + tipForward * 0.96 + stringForwardOffset
        );
        const baseBotLocal = new THREE.Vector3(
          0.002 + tipSide * 0.08 - stringLeftOffset,
          -bowHalfLen + stringUpOffset,
          0.146 + tipForward * 0.96 + stringForwardOffset
        );

        // straightMid は、弦の上端と下端の中間位置を計算するベクトルで、弦のたわみやオフセットを考慮して計算される。
        const straightMid = baseTopLocal.clone().lerp(baseBotLocal, 0.5);
        // topLocal と botLocal は、弦の上端と下端の最終的な位置を表すベクトルで、弦のたわみやオフセット、上下変位を考慮して計算される。
        const topLocal = baseTopLocal.clone();
        const botLocal = baseBotLocal.clone();
        // 既存の上下短縮
        topLocal.y -= stringShorten;
        botLocal.y += stringShorten;
        // 追加: draw時の上下変位
        topLocal.y -= topTipDown;
        botLocal.y += bottomTipUp;

        // loadedArrowDrawDirLocal は、矢を引いた時の弦の方向を表すベクトルで、弦のたわみやオフセットを考慮して計算される。
        const loadedArrowDrawDirLocal = new THREE.Vector3(0, 0, -1)
          .applyEuler(new THREE.Euler(0, -0.30, 0, "XYZ"))
          .normalize();

        // midLocal は、弦の中間位置を計算するベクトルで、弦のたわみやオフセット、矢を引いた量を考慮して計算される。draw が 0 の場合は straightMid と同じ位置になるが、draw が増えると矢を引いた方向に移動する。
        const midLocal = straightMid.clone().sub(
          loadedArrowDrawDirLocal.clone().multiplyScalar(draw * maxDraw)
        );

        return { topLocal, midLocal, botLocal };
      }

      // --------------------------------------------------
      // 弦
      // --------------------------------------------------
      // initLocals は、弦の初期位置を計算するために getStringLocals 関数を呼び出して取得される。draw と kick の初期値は 0 で、弦はまっすぐな状態になる。
      const initLocals = getStringLocals(0, 0);
      // stringGeo は、弦のジオメトリを作成するために THREE.BufferGeometry を使用して、弦の上端、中間、下端の位置を設定する。toWorld 関数を使用して、ローカル座標系からワールド座標系に変換する。
      const stringGeo = new THREE.BufferGeometry().setFromPoints([
        toWorld(initLocals.topLocal),
        toWorld(initLocals.midLocal),
        toWorld(initLocals.botLocal)
      ]);
      // stringMaterial は、弦のマテリアルを作成するために THREE.LineBasicMaterial を使用して、色と線幅を設定する。
      const string = new THREE.Line(stringGeo, stringMaterial);
      bowGroup.add(string);
      game.bowString = string;

      // --------------------------------------------------
      // 矢接続位置
      // --------------------------------------------------
      const arrowAttach = new THREE.Object3D();
      arrowAttach.position.copy(toWorld(initLocals.midLocal));
      bowGroup.add(arrowAttach);

      // --------------------------------------------------
      // 状態
      // --------------------------------------------------
      // charge は弓を引いた量を表す値で、0 から 1 の範囲で設定される。drawAmount は弓を引いた量を表す値で、0 から 1 の範囲で設定される。releaseVelocity は弓をリリースした時の速度を表す値で、0 から 1 の範囲で設定される。stringVibration は弦の振動量を表す値で、0 から 1 の範囲で設定される。bowKick は弓の反動量を表す値で、0 から 1 の範囲で設定される。attachedArrow は接続されている矢のオブジェクトを保持する。
      bowGroup.userData.charge = 0;
      // drawAmount は弓を引いた量を表す値で、0 から 1 の範囲で設定される。releaseVelocity は弓をリリースした時の速度を表す値で、0 から 1 の範囲で設定される。stringVibration は弦の振動量を表す値で、0 から 1 の範囲で設定される。bowKick は弓の反動量を表す値で、0 から 1 の範囲で設定される。attachedArrow は接続されている矢のオブジェクトを保持する。
      bowGroup.userData.drawAmount = 0;
      // releaseVelocity は弓をリリースした時の速度を表す値で、0 から 1 の範囲で設定される。stringVibration は弦の振動量を表す値で、0 から 1 の範囲で設定される。bowKick は弓の反動量を表す値で、0 から 1 の範囲で設定される。attachedArrow は接続されている矢のオブジェクトを保持する。
      bowGroup.userData.releaseVelocity = 0;
      // stringVibration は弦の振動量を表す値で、0 から 1 の範囲で設定される。bowKick は弓の反動量を表す値で、0 から 1 の範囲で設定される。attachedArrow は接続されている矢のオブジェクトを保持する。
      bowGroup.userData.stringVibration = 0;
      // bowKick は弓の反動量を表す値で、0 から 1 の範囲で設定される。attachedArrow は接続されている矢のオブジェクトを保持する。
      bowGroup.userData.bowKick = 0;
      // attachedArrow は接続されている矢のオブジェクトを保持する。
      bowGroup.userData.attachedArrow = null;
      // arrowAttach は矢を接続する位置を表す THREE.Object3D で、弓の弦の中間位置に配置される。
      bowGroup.userData.arrowAttach = arrowAttach;

      // --------------------------------------------------
      // ノックを接続点へ合わせる
      // --------------------------------------------------
      function placeArrowByNock(arrow, attachPos) {
        if (!arrow) return;

        // arrow.userData.nockToCenter が未定義の場合は、デフォルト値として 0.475 を使用する。これは、矢のノック部分から矢の中心までの距離を表す。
        const nockToCenter = arrow.userData?.nockToCenter ?? 0.475;
        // forward は矢の前方向を表す THREE.Vector3 で、矢のクォータニオンを適用して正規化される。これにより、矢の向きに応じた前方向ベクトルが得られる。
        const forward = new THREE.Vector3(1, 0, 0)
          .applyQuaternion(arrow.quaternion)
          .normalize();

        arrow.position.copy(
          attachPos.clone().addScaledVector(forward, nockToCenter)
        );
      }

      // --------------------------------------------------
      // 弓形状再構築
      // --------------------------------------------------
      function rebuildBow(draw = 0, kick = 0) {
        // 弦のローカル基準点を取得する
        const stringLocals = getStringLocals(draw, kick);

        // 弦の上端と下端の位置を取得する
        const upperCurve = createUpperLimbCurve(draw, kick, stringLocals);
        const lowerCurve = createLowerLimbCurve(draw, kick, stringLocals);

        // 弓の上肢と下肢のジオメトリを再構築する
        const upperGeo = createTaperedLimbGeometry(upperCurve);
        const lowerGeo = createTaperedLimbGeometry(lowerCurve);

        // 既存のジオメトリを破棄して、新しいジオメトリを設定する
        upperLimbMesh.geometry.dispose();
        lowerLimbMesh.geometry.dispose();
        upperLimbMesh.geometry = upperGeo;
        lowerLimbMesh.geometry = lowerGeo;

        // tip の位置と向きを更新する
        updateTipTransform(upperTip, upperCurve, true);
        updateTipTransform(lowerTip, lowerCurve, false);

        return stringLocals;
      }

      // --------------------------------------------------
      // 弦更新
      // --------------------------------------------------
      function updateString(draw = 0, kick = 0, vibePhase = 0, vibeAmp = 0, stringLocals = null) {
        const locals = stringLocals ?? getStringLocals(draw, kick);

        // 弦の上端、中間、下端のワールド座標を計算する
        const top = toWorld(locals.topLocal);
        const mid = toWorld(
          locals.midLocal.clone().add(
            new THREE.Vector3(0, 0, Math.sin(vibePhase) * vibeAmp)
          )
        );
        const bot = toWorld(locals.botLocal);

        // 弦の頂点位置を更新する
        const pos = string.geometry.attributes.position;
        pos.setXYZ(0, top.x, top.y, top.z);
        pos.setXYZ(1, mid.x, mid.y, mid.z);
        pos.setXYZ(2, bot.x, bot.y, bot.z);
        pos.needsUpdate = true;

        arrowAttach.position.copy(mid);

        const arrow = bowGroup.userData.attachedArrow;
        if (arrow) {
          placeArrowByNock(arrow, mid);
        }
      }

      // --------------------------------------------------
      // チャージ
      // --------------------------------------------------
      bowGroup.userData.setCharge = function (value) {
        // c は弓を引いた量を表す値で、0 から 1 の範囲にクランプされる。value が負の値や 1 を超える値の場合は、0 または 1 に制限される。
        const c = THREE.MathUtils.clamp(value, 0, 1);
        bowGroup.userData.charge = c;
        bowGroup.userData.drawAmount = c;

        // 弓形状を再構築し、弦を更新する
        const stringLocals = rebuildBow(c, 0);
        updateString(c, 0, 0, 0, stringLocals);
      };

      // --------------------------------------------------
      // 矢接続
      // --------------------------------------------------
      bowGroup.userData.attachArrow = function (arrow) {
        bowGroup.userData.attachedArrow = arrow;
        if (!arrow) return;

        // 矢のノック位置を弓の接続点に合わせる
        placeArrowByNock(arrow, arrowAttach.position);
      };

      // --------------------------------------------------
      // リリース
      // --------------------------------------------------
      bowGroup.userData.releaseString = function () {
        // 弓をリリースした時のパワーを計算する。drawAmount は弓を引いた量を表す値で、0 から 1 の範囲で設定される。power は弓のパワーを表す値で、0 から 1 の範囲で設定される。
        const power = bowGroup.userData.drawAmount;

        // リリース時の速度、弦の振動量、弓の反動量を計算する。releaseVelocity は弓をリリースした時の速度を表す値で、0 から 1 の範囲で設定される。stringVibration は弦の振動量を表す値で、0 から 1 の範囲で設定される。bowKick は弓の反動量を表す値で、0 から 1 の範囲で設定される。
        bowGroup.userData.releaseVelocity = Math.max(0.22, power * 0.52);
        bowGroup.userData.stringVibration = 0.024 + power * 0.040;
        bowGroup.userData.bowKick = 0.60 + power * 0.72;
        bowGroup.userData.charge = 0;
      };

      // --------------------------------------------------
      // 毎フレーム更新
      // --------------------------------------------------
      bowGroup.userData.updateBowAnimation = function (dt, elapsed) {
        // drawAmount は弓を引いた量を表す値で、0 から 1 の範囲で設定される。releaseVelocity は弓をリリースした時の速度を表す値で、0 から 1 の範囲で設定される。
        if (bowGroup.userData.drawAmount > 0) {
          bowGroup.userData.drawAmount -= bowGroup.userData.releaseVelocity * dt * 5.4;
          if (bowGroup.userData.drawAmount < 0) {
            bowGroup.userData.drawAmount = 0;
          }
        }

        // 弦の振動量と弓の反動量を時間経過に応じて減衰させる。Math.exp 関数を使用して、指数関数的に減衰させることで、自然な振動の減衰を表現する。
        bowGroup.userData.stringVibration *= Math.exp(-dt * 11.0);
        // 弓の反動量を減衰させることで、弓がリリースされた後の反動が徐々に収まるようにする。
        bowGroup.userData.bowKick *= Math.exp(-dt * 9.0);

        // 弓の反動量に応じて、弓の形状を再構築し、弦を更新する。kick は弓の反動量に応じて計算され、弓の形状や弦の位置に影響を与える。
        const kick = Math.sin(elapsed * 26.0) * bowGroup.userData.bowKick * 0.055;
        // 弓形状を再構築し、弦の位置を更新する。rebuildBow 関数を呼び出して、弓の形状を再構築し、updateString 関数を呼び出して、弦の位置を更新する。
        const stringLocals = rebuildBow(bowGroup.userData.drawAmount, kick);

        // 弦の位置を更新する。updateString 関数を呼び出して、弦の上端、中間、下端の位置を計算し、弦のジオメトリを更新する。
        updateString(
          bowGroup.userData.drawAmount,
          kick,
          elapsed * 64.0,
          bowGroup.userData.stringVibration,
          stringLocals
        );
      };

      // 初期状態
      {
        const stringLocals = rebuildBow(0, 0);
        updateString(0, 0, 0, 0, stringLocals);
      }

      return bowGroup;
    }

    /**
     * 役割: 飛翔矢・装填矢に共通するシャフト、先端、羽根を生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createArrowModel() {
      const group = new THREE.Group();

      // 軸（細め）
      const shaftRadius = 0.012;
      // シャフト材質
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(shaftRadius, shaftRadius, 0.95, 12),
        new THREE.MeshStandardMaterial({
          color: 0x2f2f2f,
          roughness: 0.82
        })
      );
      // 軸を横に回転
      shaft.rotation.z = -Math.PI / 2;
      group.add(shaft);

      // 矢じり
      const tip = new THREE.Mesh(
        // 円錐の底面の半径,高さ, 円周分割数
        new THREE.ConeGeometry(shaftRadius, 0.05, 30),
        new THREE.MeshStandardMaterial({
          color: 0x8d8d8d,
          roughness: 0.35
        })
      );
      // 矢じりを横に回転
      tip.rotation.z = -Math.PI / 2;
      tip.position.x = 0.95 / 2 + 0.025;
      group.add(tip);

      // 羽根材質
      const featherBaseMat = new THREE.MeshStandardMaterial({
        color: 0xf28c28,
        roughness: 0.88,
        side: THREE.DoubleSide
      });

      // 羽の取り付け位置（後方）
      const featherX = -0.95 / 2 + 0.13;

      // ------------------------------------------------------------
      // 羽形状
      // ------------------------------------------------------------
      // ローカル座標で
      // - X: 矢の進行方向
      // - Y: 軸から外側へ立ち上がる方向
      // - Z: 羽の薄み
      //
      // y = 0 の下辺（最長辺）が「軸に接着される辺」
      // になるように形状を作る
      // ------------------------------------------------------------
      function createVaneGeometry() {
        const shape = new THREE.Shape();

        // 最長辺（接地辺）
        shape.moveTo(-0.060, 0.000);
        shape.lineTo( 0.082, 0.000);

        // 上側輪郭
        shape.lineTo( 0.088, 0.010);
        shape.lineTo( 0.078, 0.030);
        shape.lineTo( 0.058, 0.046);
        shape.lineTo( 0.028, 0.056);
        shape.lineTo(-0.004, 0.043);
        shape.lineTo(-0.028, 0.026);
        shape.lineTo(-0.046, 0.012);
        shape.lineTo(-0.060, 0.000);
        shape.closePath();

        const geom = new THREE.ExtrudeGeometry(shape, {
          depth: 0.0012,
          bevelEnabled: false
        });

        // 薄み方向の中心を原点へ
        geom.translate(0, 0, -0.0006);

        return geom;
      }

      const featherGeom = createVaneGeometry();

      // 接着面を少しだけ軸の外へ逃がしてZ-fightingを防ぐ
      const contactLift = 0.0002;

      // ------------------------------------------------------------
      // 羽生成
      // ------------------------------------------------------------
      function createFeather(radialAngle, color) {
        const mat = featherBaseMat.clone();
        mat.color.setHex(color);

        // 羽のメッシュを作成
        const feather = new THREE.Mesh(featherGeom, mat);
        // 羽の前後を反転
        feather.scale.x = -1;
        // 軸周りに回転
        feather.rotation.x = radialAngle;
        // y=0 の最長辺全体が軸に接するように配置
        feather.position.set(
          featherX,
          Math.cos(radialAngle) * (shaftRadius + contactLift),
          Math.sin(radialAngle) * (shaftRadius + contactLift)
        );

        return feather;
      }

      // 4枚の薄い羽
      const f1 = createFeather(0,             0xf28c28);
      const f2 = createFeather(Math.PI / 2,   0xffffff);
      const f3 = createFeather(Math.PI,       0xf28c28);
      const f4 = createFeather(Math.PI * 1.5, 0xffffff);
      group.add(f1, f2, f3, f4);

      // ノック（矢の最後方）からグループ中心までの距離
      // 軸長 0.95 の半分を基準にしている
      group.userData.nockToCenter = 0.475;

      return group;
    }

    /**
     * 役割: 矢のローカル軸を進行方向へ向ける。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function orientArrowToDirection(arrow, dir) {
      // この矢モデルは +X が先端方向
      const from = new THREE.Vector3(1, 0, 0);
      const to = dir.clone().normalize();

      if (to.lengthSq() < 1e-8) return;

      // from から to への回転を計算する
      const q = new THREE.Quaternion().setFromUnitVectors(from, to);
      arrow.quaternion.copy(q);
    }

    /**
     * 役割: カメラの水平前方ベクトルを取得する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function getHorizontalForward() {
      // カメラの前方ベクトルを取得する
      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyQuaternion(game.camera.quaternion);

      // 水平成分だけ使う
      dir.y = 0;

      // 真上/真下近くを向いた時の保険
      if (dir.lengthSq() < 1e-6) {
        dir.set(0, 0, -1);
      }

      dir.normalize();
      return dir;
    }

    /**
     * 役割: 矢の発射開始位置をカメラ前方から計算する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function getMuzzlePosition() {
      const pos = new THREE.Vector3();
      // カメラのワールド位置を取得する
      game.camera.getWorldPosition(pos);

      // 画面中央から少し前へ
      const forward = new THREE.Vector3(0, 0, -1)
        .applyQuaternion(game.camera.quaternion)
        .normalize();

      pos.addScaledVector(forward, 0.85);
  
      // ほんの少し下げて視認性を上げる
      pos.y -= 0.05;

      return pos;
    }

    // ============================================================
    // 7. 入力・発射・風計算
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: マウス、タッチ、キーボード入力を登録し、チャージ・発射・復帰を制御する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function setupInput() {
      // --------------------------------------------------
      // PC: 左クリック
      // --------------------------------------------------
      window.addEventListener("mousedown", (e) => {
        if (isTouchDevice) return;
        if (e.button !== 0) return;

        // インパクトで止まっている状態で再度クリックしたらカメラリターン（１秒フリーズ）
        if (
          game.followArrow &&
          game.isHoldingOnImpact &&
          game.impactHoldTime >= 1.0
        ) {
          startCameraReturn();
          return;
        }

        // チャージを開始する
        beginCharge();
      });

      // --------------------------------------------------
      // PC: 左クリック離す
      // --------------------------------------------------
      window.addEventListener("mouseup", (e) => {
        if (isTouchDevice) return;
        if (e.button !== 0) return;

        // チャージを終了し、矢を発射する
        releaseArrow();
      });

      // --------------------------------------------------
      // スマホ: タッチ
      // 1本指でドラッグしながら照準、
      // 押している間チャージ、離すと発射
      // --------------------------------------------------
      window.addEventListener("touchstart", (e) => {
        if (!isTouchDevice) return;
        if (e.touches.length !== 1) return;

        // デフォルトのタッチ操作（スクロールやズーム）を無効化する
        e.preventDefault();

        // タッチ位置を取得する
        const touch = e.touches[0];

        // インパクトで止まっている状態で再度タッチしたらカメラリターン（１秒フリーズ）
        if (
          game.followArrow &&
          game.isHoldingOnImpact &&
          game.impactHoldTime >= 1.0
        ) {
          // カメラリターンを開始する
          startCameraReturn();
          return;
        }

        // タッチ操作で照準を行うための状態を初期化する
        game.touchLook.active = true;
        game.touchLook.lastX = touch.clientX;
        game.touchLook.lastY = touch.clientY;

        // チャージを開始する
        beginCharge();
      }, { passive: false });

      // --------------------------------------------------
      // スマホ: タッチ移動
      // --------------------------------------------------
      window.addEventListener("touchmove", (e) => {
        if (!isTouchDevice) return;
        if (!game.touchLook.active) return;
        if (e.touches.length !== 1) return;

        // デフォルトのタッチ操作（スクロールやズーム）を無効化する
        e.preventDefault();

        // タッチ位置の変化量を計算する
        const touch = e.touches[0];
        const dx = touch.clientX - game.touchLook.lastX;
        const dy = touch.clientY - game.touchLook.lastY;

        // タッチ位置を更新する
        game.touchLook.lastX = touch.clientX;
        game.touchLook.lastY = touch.clientY;

        // タッチ移動量に応じてカメラの向きを更新する
        updateTouchLook(dx, dy);
      }, { passive: false });

      //--------------------------------------------------
      // スマホ: タッチ離す
      //--------------------------------------------------
      window.addEventListener("touchend", (e) => {
        if (!isTouchDevice) return;

        // デフォルトのタッチ操作（スクロールやズーム）を無効化する
        e.preventDefault();
        game.touchLook.active = false;

        // チャージを終了し、矢を発射する
        releaseArrow();
      }, { passive: false });

      //--------------------------------------------------
      // スマホ: タッチキャンセル（システムによる強制キャンセル）
      //--------------------------------------------------
      window.addEventListener("touchcancel", (e) => {
        if (!isTouchDevice) return;

        // デフォルトのタッチ操作（スクロールやズーム）を無効化する
        e.preventDefault();
        game.touchLook.active = false;
        game.isCharging = false;
        game.chargeTime = 0;
        updateBowDraw(0);
        updateHUD();
      }, { passive: false });
    }

    /**
     * 役割: 発射可能な状態でチャージを開始する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function beginCharge() {
      if (game.isGameOver) return;
      if (!isTouchDevice && !game.controls.isLocked) return;
      if (isTouchDevice && !game.hasStarted) return;
      if (isCameraInCinematicMode()) return;
      if (!game.hasLoadedArrow) return;

      // チャージを開始する
      game.isCharging = true;
      // チャージ時間をリセットする
      game.chargeTime = 0;
      // 長押し開始時は増加から始める
      game.chargeDirection = 1; 
    }

    /**
     * 役割: チャージ率、風、重力、初速をもとに矢を発射する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function releaseArrow() {
      if (!game.isCharging) return;

      // チャージを終了する
      game.isCharging = false;

      if (!game.hasLoadedArrow || !game.loadedArrow) return;

      // チャージ時間をもとに発射速度を計算する
      const chargeRatio = THREE.MathUtils.clamp(
        game.chargeTime / game.maxChargeTime,
        0,
        1
      );
      // チャージ率に応じて速度を線形補間する
      const speed = THREE.MathUtils.lerp(
        game.minSpeed,
        game.maxSpeed,
        chargeRatio
      );
      // まずは従来どおり水平ベースの前方方向を使う
      const horizontalDir = getHorizontalForward();
      // そこへ少しだけ上向き補正を加える
      const launchDir = horizontalDir.clone();
      launchDir.y += DEFAULT_ARROW_PITCH_BIAS;
      launchDir.normalize();
      // 矢を生成し、発射位置に配置する
      const arrow = createArrowModel();
      arrow.position.copy(getMuzzlePosition());
      // 矢の向きも launchDir に合わせる
      orientArrowToDirection(arrow, launchDir);

      game.scene.add(arrow);

      // 発射速度ベクトルを計算する
      const velocity = launchDir.clone().multiplyScalar(speed);
      // 既存の上向き速度は維持
      velocity.y += 1.5 + 2.3 * chargeRatio;
      // 飛翔矢の情報を game.flyingArrows に追加する
      const shotIndex = game.shotScores.length;
      game.shotScores.push(0);
      // 飛翔矢の情報をオブジェクトにまとめる
      const arrowData = {
        mesh: arrow,
        velocity,
        age: 0,
        horizontalDir: launchDir.clone(),
        stuck: false,
        shotIndex,
        scored: false
      };

      // 飛翔矢の情報を game.flyingArrows に追加する
      game.flyingArrows.push(arrowData);
      startArrowFollow(arrowData);

      // 発射後は装填矢がなくなるので、game.hasLoadedArrow を false に設定する
      game.hasLoadedArrow = false;
      updateLoadedArrowVisual();

      // 発射回数をカウントする
      game.shots++;
      updateHUD();
    }

    /**
     * 役割: 次弾を装填し、装填矢と弓の表示を戻す。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function reloadArrow() {
      if (game.isGameOver) return;

      // 装填矢を生成する
      game.hasLoadedArrow = true;
      // 装填矢のモデルを生成する
      game.isCharging = false;
      // チャージ時間をリセットする
      game.chargeTime = 0;
    
      // リロードのたびに風速だけ変える
      randomizeWindSpeedOnly();
      // 装填矢の表示を更新する
      updateLoadedArrowVisual();
      // 弓の引き量をリセットする
      updateBowDraw(0);
      // HUD を更新する
      updateHUD();
    }

    /**
     * 役割: 装填中の矢の表示/非表示を状態に合わせて更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateLoadedArrowVisual() {
      if (!game.loadedArrow) return;

      // 装填矢の表示を game.hasLoadedArrow に合わせる
      game.loadedArrow.visible = game.hasLoadedArrow;
      // 弓の接続点を取得する
      const bowGroup = game.bowRoot?.children?.[0];
      // 装填矢がない場合は弓の接続点から矢を外す 
      if (!game.hasLoadedArrow) {
        if (bowGroup?.userData) {
          bowGroup.userData.attachedArrow = null;
        }
        return;
      }
      // 装填矢がある場合は弓の接続点に矢を接続する
      const shaftDir = new THREE.Vector3(0, 0, -1)
        .applyEuler(new THREE.Euler(
          -0.03,  // X: 少し上向き/下向き
          -0.10,  // Y: 左右の基本向き
           0.00,  // Z: ひねり
          "XYZ"
        ))
        .normalize();
      // 装填矢の向きを弓の接続点に合わせる
      orientArrowToDirection(game.loadedArrow, shaftDir);
      // 再装填時も必ず弓へ再接続する
      if (bowGroup?.userData?.attachArrow) {
         bowGroup.userData.attachArrow(game.loadedArrow);
      }
    }

    /**
     * 役割: チャージ率に応じて弦の引き量と装填矢の位置を更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateBowDraw(ratio) {
      // ratio は弓を引いた量を表す値で、0 から 1 の範囲にクランプされる。負の値や 1 を超える値の場合は、0 または 1 に制限される。
      const drawRatio = THREE.MathUtils.clamp(ratio, 0, 1);
      // 弓の接続点を取得する
      const bowGroup = game.bowRoot?.children?.[0];
      if (bowGroup?.userData?.setCharge) {
        bowGroup.userData.setCharge(drawRatio);
      }
    }

    /**
     * 役割: 現在選ばれている風向きベクトルを返す。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function getCurrentWindDirection() {
      return WIND_DIRECTIONS[game.wind.directionIndex] || WIND_DIRECTIONS[0];
    }

    /**
     * 役割: 現在の風向きと風速から矢に加える加速度を返す。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function getWindAcceleration() {
      return getCurrentWindDirection().vector
        .clone()
        .multiplyScalar(game.wind.speed * game.windAccelerationScale);
    }

    /**
     * 役割: 発射ごとに少し揺らぎを含む風加速度を計算する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function getWindAccelerationWithJitter(elapsed) {
      const base = getWindAcceleration().clone();

      // 風速が 0 に近い時はそのまま
      if (base.lengthSq() < 1e-8) return base;
      // 左右風に対して、ごく弱い上下揺らぎを足す
      const vertical =
        Math.sin(elapsed * 1.9) * 0.10 +
        Math.sin(elapsed * 3.7 + 1.2) * 0.05;
      // 風の強さ自体も少しだけ脈動させる
      const gust = 1.0 +
        Math.sin(elapsed * 1.4 + 0.6) * 0.10 +
        Math.sin(elapsed * 2.8 + 2.1) * 0.05;
      // 風加速度に揺らぎを適用する
      base.multiplyScalar(gust);
      base.y += vertical * game.windAccelerationScale;

      return base;
    }

    /**
     * 役割: 風向きと風速をランダムに更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function randomizeWind() {
      game.wind.directionIndex = Math.floor(Math.random() * WIND_DIRECTIONS.length);
      game.wind.speed = THREE.MathUtils.lerp(1.5, 7.0, Math.random());
    }

    /**
     * 役割: 風向きを維持したまま風速だけをランダム更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function randomizeWindSpeedOnly() {
      game.wind.speed = THREE.MathUtils.lerp(1.5, 7.0, Math.random());
    }

    /**
     * 役割: スマホ操作時のドラッグ量からカメラ回転を更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateTouchLook(dx, dy) {
      if (!isTouchDevice) return;
      if (game.isGameOver) return;
      if (isCameraInCinematicMode()) return;

      // タッチ移動量に応じて yaw/pitch を更新する
      game.touchLook.yaw -= dx * game.touchLook.sensitivityX;
      game.touchLook.pitch -= dy * game.touchLook.sensitivityY;
      game.touchLook.pitch = THREE.MathUtils.clamp(
        game.touchLook.pitch,
        -Math.PI / 3,
        Math.PI / 3
      );

      // カメラの回転順序を YXZ に設定し、yaw/pitch を適用する
      game.camera.rotation.order = "YXZ";
      game.camera.rotation.y = game.touchLook.yaw;
      game.camera.rotation.x = game.touchLook.pitch;
    }

    /**
     * 役割: 矢追従や着弾保持など、通常操作以外のカメラ状態か判定する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function isCameraInCinematicMode() {
      return !!game.followArrow || game.isHoldingOnImpact || game.isReturningCamera;
    }

    // ============================================================
    // 8. 矢追従カメラ・当たり判定
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: 発射後に矢を追うカメラ演出へ移行する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function startArrowFollow(arrowData) {
      // カメラの現在位置を保存する
      game.savedCameraPosition.copy(game.camera.position);
      // カメラの現在の回転を保存する
      game.savedCameraQuaternion.copy(game.camera.quaternion);
      // 矢追従カメラを開始する
      game.followArrow = arrowData;
      // 着弾保持をリセットする
      game.isHoldingOnImpact = false;
      // カメラ復帰中の状態をリセットする
      game.isReturningCamera = false;
      // 着弾保持時間をリセットする
      game.impactHoldTime = 0;
      // 弓の表示を非表示にする
      if (game.bowRoot) {
        game.bowRoot.visible = false;
      }
    }

    /**
     * 役割: 着弾直後にカメラを一時停止する演出へ移行する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function startImpactHold() {
      if (!game.followArrow || game.isHoldingOnImpact) return;

      // カメラの現在位置を保存する
      game.isHoldingOnImpact = true;
      game.impactHoldTime = 0;
    }

    /**
     * 役割: 着弾後カメラを元の視点へ戻す処理を開始する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function startCameraReturn() {
      if (!isCameraInCinematicMode()) return;

      // カメラ復帰中の状態を開始する
      game.followArrow = null;
      // 着弾保持を終了する
      game.isHoldingOnImpact = false;
      // カメラ復帰中の状態を開始する
      game.isReturningCamera = true;
      // 着弾保持時間をリセットする
      game.impactHoldTime = 0;
    }

    /**
     * 役割: カメラ復帰処理を完了し、通常視点へ戻す。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function finishCameraReturn() {
      game.camera.position.copy(game.savedCameraPosition);

      // 視点を正面（デフォルト）にリセット
      game.camera.rotation.set(0, 0, 0, "YXZ");
      game.camera.quaternion.setFromEuler(game.camera.rotation);
      // タッチ用の yaw/pitch もリセット
      game.touchLook.yaw = 0;
      game.touchLook.pitch = 0;
      // カメラ復帰中の状態を終了する
      game.followArrow = null;
      game.isHoldingOnImpact = false;
      game.isReturningCamera = false;
      game.impactHoldTime = 0;
      // 弓の表示を元に戻す
      if (game.bowRoot) {
        game.bowRoot.visible = true;
      }
      reloadArrow();
    }

    /**
     * 役割: 矢追従、着弾保持、視点復帰のカメラ状態を毎フレーム更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateCameraFollow(dt) {
      if (game.followArrow) {
        // 矢追従カメラ中は弓の表示を非表示にする
        const arrowData = game.followArrow;
        // 矢がシーンから削除されていたら、カメラ復帰処理を開始する
        if (!arrowData.mesh.parent) {
          startCameraReturn();
          return;
        }
        // 矢の水平前方方向を取得する
        const followDir = arrowData.horizontalDir.clone().normalize();
        // 矢の位置からカメラの目標位置を計算する
        const targetPosition = arrowData.mesh.position.clone()
          .addScaledVector(followDir, -game.followOffsetDistance);
        targetPosition.y += game.followOffsetHeight;
        // カメラ位置を滑らかに補間する
        const followAlpha = 1 - Math.exp(-game.followLerpSpeed * dt);
        game.camera.position.lerp(targetPosition, followAlpha);
        // カメラの向きを矢の進行方向に向ける
        const lookTarget = arrowData.mesh.position.clone()
          .addScaledVector(followDir, game.followLookAhead);
        // カメラの向きを矢の進行方向に向けるための回転行列を作成する
        const lookMatrix = new THREE.Matrix4().lookAt(
          game.camera.position,
          lookTarget,
          game.camera.up
        );
        // 回転行列からクォータニオンを作成し、カメラの回転を滑らかに補間する
        const targetQuaternion = new THREE.Quaternion().setFromRotationMatrix(lookMatrix);
        game.camera.quaternion.slerp(targetQuaternion, followAlpha);
        // 矢が着弾している場合は、着弾保持処理を開始する
        if (arrowData.stuck) {
          startImpactHold();
          game.impactHoldTime += dt;
        }
        return;
      }

      // 着弾保持中はカメラを固定する
      if (!game.isReturningCamera) {
        if (game.bowRoot) {
          game.bowRoot.visible = true;
        }
        return;
      }

      // カメラ復帰中は保存した位置と回転に向かって補間する
      const returnAlpha = 1 - Math.exp(-game.returnLerpSpeed * dt);
      game.camera.position.lerp(game.savedCameraPosition, returnAlpha);
      game.camera.quaternion.slerp(game.savedCameraQuaternion, returnAlpha);
      // カメラがほぼ元の位置と回転に戻ったら復帰処理を完了する
      if (
        game.camera.position.distanceToSquared(game.savedCameraPosition) < 1e-4 &&
        game.camera.quaternion.angleTo(game.savedCameraQuaternion) < 0.01
      ) {
        finishCameraReturn();
      }
    }

    /**
     * 役割: 矢が木・岩・観客席など登録済みオブジェクトへ衝突したか調べる。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function checkArrowObjectHit(prevPos, nextPos) {
      if (!game.arrowCollisionObjects.length) return null;

      // prevPos から nextPos までの線分をレイキャストして、衝突するオブジェクトがあるか調べる
      const move = nextPos.clone().sub(prevPos);
      // 線分の長さを計算する
      const distance = move.length();
      // 線分の長さがほぼゼロの場合は衝突判定をスキップする
      if (distance <= 1e-6) return null;
      // 線分の方向を正規化する
      const direction = move.clone().normalize();
      // レイキャスターを作成し、prevPos から direction 方向に distance だけの距離で衝突判定を行う
      const raycaster = new THREE.Raycaster(
        prevPos,
        direction,
        0,
        distance
      );
      // レイキャストして衝突するオブジェクトを取得する
      const hits = raycaster.intersectObjects(game.arrowCollisionObjects, false);
      // 衝突するオブジェクトがなければ null を返す
      if (!hits.length) return null;
      // 衝突したオブジェクトの情報を返す
      return hits[0];
    }

    // ============================================================
    // 5. 的・スコア判定
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: 矢が的面に当たったかを判定し、中心からの距離を返す。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function checkTargetHit(prevPos, nextPos) {
      // 的の中心位置を取得する
      const center = game.targetFace.getWorldPosition(new THREE.Vector3());
      // 的の法線
      const normal = new THREE.Vector3(0, 0, 1)
        .applyQuaternion(game.targetFace.getWorldQuaternion(new THREE.Quaternion()))
        .normalize();
      // prevPos と nextPos が的面の前後どちらにあるかを判定するため、中心からの距離を計算する
      const d1 = prevPos.clone().sub(center).dot(normal);
      const d2 = nextPos.clone().sub(center).dot(normal);

      // 平面を跨いでいなければヒットしない
      if (d1 * d2 > 0) return null;

      // 線分と平面の交点を計算する
      const t = d1 / (d1 - d2);
      if (t < 0 || t > 1) return null;

      // 線分上の交点を計算する
      const hitPos = prevPos.clone().lerp(nextPos, t);
      // 的の中心からの距離を計算する
      const offset = hitPos.clone().sub(center);
      // 平面上の距離を計算するため、法線方向の成分を除去する
      const planar = offset.sub(normal.clone().multiplyScalar(offset.dot(normal)));
      // 的の中心からの距離を計算する
      const dist = planar.length();
      // 的の半径内に入っていればヒットと判定する
      if (dist <= game.targetRadius) {
        return { hitPos, dist };
      }

      return null;
    }

    /**
     * 役割: 的中心からの距離を、10点から1点のリングスコアへ変換する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function scoreFromDistance(dist) {
      // 的の半径を10等分したリング幅を計算する
      const ringWidth = game.targetRadius / 10;
      // 境界線ギリギリで下の点に落ちるのを防ぐため、微小値を引く
      const EPS = 1e-8;
      // 中心からの距離をリング番号に変換する（0番目が10点、9番目が1点）
      const ringIndex = Math.floor(Math.max(0, dist - EPS) / ringWidth);
      // 0番目: 10点、1番目: 9点、...、9番目: 1点
      return THREE.MathUtils.clamp(10 - ringIndex, 1, 10);
    }

    // ============================================================
    // 9. ゲーム進行・HUD・メインループ
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: 的中時の紙吹雪演出を発生させる。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function triggerHitCelebration() {
      if (!celebrationLayer) return;

      // 既存の紙吹雪バーストが多すぎる場合は古いものから削除する
      while (celebrationLayer.childElementCount >= MAX_ACTIVE_CONFETTI_BURSTS) {
        celebrationLayer.firstElementChild?.remove();
      }

      // 紙吹雪バーストの DOM 要素を作成する
      const burst = document.createElement("div");
      burst.className = "confetti-burst";

      // 紙吹雪の寿命を計算するための最大寿命を初期化する
      let maxLifetimeMs = 0;

      // 紙吹雪の個数分ループして、個々の紙吹雪要素を作成する
      for (let i = 0; i < CONFETTI_PIECES_PER_HIT; i++) {
        // 紙吹雪の個々の要素を作成する
        const piece = document.createElement("span");
        piece.className = "confetti-piece";

        // 紙吹雪の幅と高さをランダムに決定する
        const width = 8 + Math.random() * 8;
        const height = 12 + Math.random() * 12;
        const durationMs = 2400 + Math.random() * 1300;
        const delayMs = Math.random() * 180;
        const driftX = -18 + Math.random() * 36;
        const fallDistance = 85 + Math.random() * 30;
        const rotateStart = -160 + Math.random() * 320;
        const rotateEnd = rotateStart + (Math.random() < 0.5 ? -1 : 1) * (540 + Math.random() * 540);
        const left = Math.random() * 100;
        const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];

        // CSS カスタムプロパティを設定する
        piece.style.setProperty("--confetti-width", `${width.toFixed(1)}px`);
        piece.style.setProperty("--confetti-height", `${height.toFixed(1)}px`);
        piece.style.setProperty("--confetti-left", `${left.toFixed(2)}vw`);
        piece.style.setProperty("--confetti-color", color);
        piece.style.setProperty("--confetti-duration", `${durationMs.toFixed(0)}ms`);
        piece.style.setProperty("--confetti-delay", `${delayMs.toFixed(0)}ms`);
        piece.style.setProperty("--confetti-drift-x", `${driftX.toFixed(2)}vw`);
        piece.style.setProperty("--confetti-fall-distance", `${fallDistance.toFixed(2)}vh`);
        piece.style.setProperty("--confetti-rotate-start", `${rotateStart.toFixed(1)}deg`);
        piece.style.setProperty("--confetti-rotate-end", `${rotateEnd.toFixed(1)}deg`);

        // 紙吹雪の個々の要素をバーストに追加する
        burst.appendChild(piece);
        maxLifetimeMs = Math.max(maxLifetimeMs, durationMs + delayMs);
      }

      // 紙吹雪バーストを celebrationLayer に追加する
      celebrationLayer.appendChild(burst);
      window.setTimeout(() => burst.remove(), maxLifetimeMs + 120);
    }

    /**
     * 役割: ゲーム開始時にタイマー、スコア、矢、風などを初期状態へ戻す。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function startGame() {
      // ゲーム状態を初期化する
      randomizeWind();
      game.hasStarted = true;
      game.timeRemaining = game.timeLimit;
      updateHUD();
    }

    /**
     * 役割: ゲーム終了表示と入力状態の整理を行う。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function endGame() {
      if (game.isGameOver) return;

      // ゲーム終了状態を設定する
      game.isGameOver = true;
      // ゲーム終了時の状態をリセットする
      game.timeRemaining = 0;
      // ゲーム終了時のチャージ状態をリセットする
      game.isCharging = false;
      // ゲーム終了時のチャージ時間をリセットする
      game.chargeTime = 0;
      // ゲーム終了時の装填矢をリセットする
      finishCameraReturn();
      // ゲーム終了時の装填矢の表示を更新する
      overlay.classList.add("hidden");
      // ゲーム終了時のHUDを更新する
      const isCelebration = game.score >= 11;
      // ゲーム終了時のメッセージを表示する
      gameOverScreen.textContent =
        isCelebration ? "CONGRATULATIONS!!" : "GAME OVER";
      // ゲーム終了時のメッセージの色を設定する
      gameOverScreen.classList.toggle("isCelebration", isCelebration);
      // ゲーム終了時のメッセージを表示する
      gameOverScreen.classList.add("visible");
      // ゲーム終了時の弓の引き量をリセットする
      updateBowDraw(0);
      // ゲーム終了時の装填矢の表示を更新する
      updateLoadedArrowVisual();
      // ゲーム終了時のHUDを更新する
      updateHUD();

      // ゲーム終了時に PointerLock を解除する
      if (game.controls.isLocked) {
        game.controls.unlock();
      }

      // スコア送信（非同期・失敗しても無視）
      sendScoreToExternal(game.score);
    }

    /**
     * 役割: 残り時間を減らし、0になったらゲーム終了へ進める。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateTimer(dt) {
      if (!game.hasStarted || game.isGameOver) return;

      // 残り時間を減らす
      game.timeRemaining = Math.max(0, game.timeRemaining - dt);
      // 残り時間が 0 になったらゲーム終了へ進める
      if (game.timeRemaining <= 0) {
        endGame();
      }
    }

    /**
     * 役割: 残り時間をHUD表示用の文字列へ変換する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function formatTimeRemaining(seconds) {
      return `${Math.max(0, Math.ceil(seconds))}s`;
    }

    /**
     * 役割: 各射の得点履歴をHUD表示用に整形する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function formatShotScores() {
      if (!game.shotScores.length) return "-";
      return game.shotScores.join("＋");
    }

    /**
     * 役割: スコア、風、残り時間、チャージ率などのHUDを更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateHUD() {
      // チャージ率を計算し、0～100%の範囲に制限する
      const chargeRatio = THREE.MathUtils.clamp(
        game.chargeTime / game.maxChargeTime,
        0,
        1
      );
      // チャージ率をパーセント表示に変換する
      const percent = Math.round(chargeRatio * 100);
      // 現在の風向きと風速を取得する
      const windDirection = getCurrentWindDirection?.();
      // 風向きと風速をHUD表示用の文字列へ変換する
      const windText = game.hasStarted
        ? `${windDirection.symbol}  ${game.wind.speed.toFixed(1)} m/s`
        : "-";
      // HUD の HTML を更新する
      hudText.innerHTML = `
        <div><span class="hudLabel">スコア</span>: <b>${game.score}点（${formatShotScores()}）</b></div>
        <div><span class="hudLabel">残り時間</span>: <b>${formatTimeRemaining(game.timeRemaining)}</b></div>
        <div><span class="hudLabel">風速</span>: <b>${windText}</b></div>
        <div class="powerRow">
          <div class="powerLabel"><span class="hudLabel">パワー</span>:</div>
          <div id="chargeWrap">
            <div id="chargeBar" style="width: ${percent}%;"></div>
            <div id="chargeText">${percent}%</div>
          </div>
        </div>
      `;
    }

    /**
     * 役割: requestAnimationFrameで毎フレーム更新と描画を実行する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function animate() {
      // requestAnimationFrame を使って、次のフレームの描画を予約する
      requestAnimationFrame(animate);
      // 1フレームの経過時間を取得する（最大 33ms に制限）
      const dt = Math.min(0.033, game.clock.getDelta());
      // ゲーム開始からの経過時間を取得する
      const elapsed = game.clock.elapsedTime;
      // ゲームオーバーでなければ、弓アニメーション、チャージ、矢の飛行、カメラ追従、タイマーを更新する
      if (!game.isGameOver) {
        // 実装済みの弓アニメーションを毎フレーム呼ぶ
        if (game.bowRoot?.children?.[0]?.userData?.updateBowAnimation) {
            game.bowRoot.children[0].userData.updateBowAnimation(dt, elapsed);
        }
        // チャージ量の更新とゲージ往復制御を行う
        updateCharge(dt);
        // 発射済み矢の物理移動、衝突、スコア確定を更新する
        updateFlyingArrows(dt);
        // カメラ追従、着弾保持、視点復帰の状態を毎フレーム更新する
        updateCameraFollow(dt);
        // 残り時間を減らし、0になったらゲーム終了へ進める
        updateTimer(dt);
      }
      // 風エフェクト、草の揺れ、観客のアニメーション、空ドームの更新を行う
      updateWindFX(dt, elapsed);
      // 草の揺れエフェクトを更新する
      updateGrassFX(dt, elapsed);
      // 観客のアニメーションを更新する
      updateSpectators(dt, elapsed);
      // 空ドームの色や雲の動きを更新する
      updateOpenFieldSkyDome();
      // HUD の表示を更新する
      updateHUD();
      // Three.js のレンダリングを実行する
      game.renderer.render(game.scene, game.camera);
    }

    /**
     * 役割: 長押し中のチャージ量を増減させ、ゲージ往復を制御する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateCharge(dt) {
      if (!game.isCharging) return;

      // チャージ量を増減させる
      game.chargeTime += dt * game.chargeDirection;
      // 100%まで行ったら減少へ反転
      if (game.chargeTime >= game.maxChargeTime) {
        game.chargeTime = game.maxChargeTime;
        game.chargeDirection = -1;
      }
      // 0%まで行ったら増加へ反転
      else if (game.chargeTime <= 0) {
        game.chargeTime = 0;
        game.chargeDirection = 1;
      }
      // チャージ率を計算し、弓の引き量を更新する
      const ratio = game.chargeTime / game.maxChargeTime;
      updateBowDraw(ratio);
    }

    /**
     * 役割: 発射済み矢の物理移動、衝突、スコア確定を更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateFlyingArrows(dt) {
      // 発射済み矢の配列を逆順にループして、古い矢から処理する
      for (let i = game.flyingArrows.length - 1; i >= 0; i--) {
        // 発射済み矢のデータを取得する
        const arrowData = game.flyingArrows[i];
        // 矢がすでに刺さっている場合は、物理移動や衝突判定をスキップする
        if (arrowData.stuck) continue;
        // 矢の経過時間を更新する
        arrowData.age += dt;
        // 長く飛びすぎた矢は削除
        if (arrowData.age > game.maxLifetime) {
          game.scene.remove(arrowData.mesh);
          game.flyingArrows.splice(i, 1);
          continue;
        }
        // 前フレームの位置を保存する
        const prevPos = arrowData.mesh.position.clone();
        // 重力・風
        arrowData.velocity.addScaledVector(game.gravity, dt);
        arrowData.velocity.addScaledVector(
          getWindAccelerationWithJitter(game.clock.elapsedTime),
          dt
        );
        // 位置更新
        arrowData.mesh.position.addScaledVector(arrowData.velocity, dt);
        // 矢の進行方向を水平面上で計算する
        const nextPos = arrowData.mesh.position.clone();
        // 進行方向そのものへ向ける
        if (arrowData.velocity.lengthSq() > 1e-6) {
          orientArrowToDirection(arrowData.mesh, arrowData.velocity);
        }
        // 木・岩・観客席などに当たったら刺さって停止
        const objectHit = checkArrowObjectHit(prevPos, nextPos);
        if (objectHit) {
          arrowData.mesh.position.copy(objectHit.point);
          arrowData.velocity.set(0, 0, 0);
          arrowData.stuck = true;
          // 外した扱いなので score は加算しない
          if (!arrowData.scored) {
            arrowData.scored = true;
            if (typeof arrowData.shotIndex === "number") {
              game.shotScores[arrowData.shotIndex] = 0;
            }
          }
          continue;
        }
        // 地面に落ちたら停止
        if (arrowData.mesh.position.y <= 0.05) {
          arrowData.mesh.position.y = 0.05;
          arrowData.velocity.set(0, 0, 0);
          arrowData.stuck = true;
          continue;
        }
        // 的ヒット判定
        const hit = checkTargetHit(prevPos, nextPos);
        if (hit) {
          arrowData.mesh.position.copy(hit.hitPos);
          arrowData.velocity.set(0, 0, 0);
          arrowData.stuck = true;
          // スコア確定処理
          if (!arrowData.scored) {
            const point = scoreFromDistance(hit.dist);
            arrowData.scored = true;
            game.hits++;
            game.score += point;
            // スコア履歴に追加する
            if (typeof arrowData.shotIndex === "number") {
              game.shotScores[arrowData.shotIndex] = point;
            }
            // 的中時の紙吹雪演出を発生させる
            triggerHitCelebration();
          }
        }
      }
    }

    // ============================================================
    // 10. 起動処理
    // ------------------------------------------------------------
    // すべての関数・定数が定義された後に初期化する。
    // これにより、const/let の初期化前参照によるエラーを防ぐ。
    // ============================================================
    try {
      // Three.js の初期化、シーン構築、カメラ・ライト・弓・的の配置などを行う
      init();
      // メインループを開始する
      animate();
    } catch (err) {
      showError("初期化エラー:\n" + (err?.stack || err?.message || String(err)));
    }
  </script>
</body>
</html>
