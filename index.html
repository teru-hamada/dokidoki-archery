<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ドキドキアーチェリー</title>

  <style>
    /* ベーススタイル */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* HUD（ヘッドアップディスプレイ：左上に固定表示する黒半透明のパネル）スタイル */
    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 20;
      min-width: 290px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      line-height: 1.55;
      user-select: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    /* HUD内のラベルスタイル */
    .hudLabel {
      display: inline-block;
      width: 80px;
      text-align: left;
    }

    /* パワー表示の行スタイル */
    .powerRow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    /* パワー表示のラベルスタイル */
    .powerLabel {
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* チャージバーの外枠スタイル */
    #chargeWrap {
      flex: 1;
      height: 24px;
      border-radius: 999px;
      overflow: visible;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.2);
      position: relative;
    }

    /* チャージバーの内側スタイル */
    #chargeBar {
      width: 0%;
      height: 100%;
      background: rgba(255,255,255,.92);
      transition: width 0.03s linear;
      border-radius: 999px;
    }

    /* チャージテキストのスタイル */
    #chargeText {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
      mix-blend-mode: difference;
      color: #fff;
    }

    /* 照準マークのスタイル */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 20;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
    }

    /* 照準マークの線のスタイル */
    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,.96);
      border-radius: 2px;
    }
    #crosshair::before { width: 18px; height: 2px; }
    #crosshair::after  { width: 2px;  height: 18px; }

    /* オーバーレイのスタイル */
    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.55);
      color: #fff;
      z-index: 30;
      text-align: center;
      padding: 20px;
    }
    #overlay.hidden {
      display: none;
    }

    /* ゲームオーバースクリーンのスタイル */
    #gameOverScreen {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 40;
      pointer-events: none;
      color: #fff;

      padding: 24px 16px;
      box-sizing: border-box;
      text-align: center;
      margin: 0 auto;
      max-width: 100vw;

      /* 改行させない */
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: normal;
      line-height: 1.05;

      /* 少し控えめに */
      font-size: clamp(22px, 7vw, 120px);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    #gameOverScreen.visible {
      display: grid;
    }
    #gameOverScreen.isCelebration {
      color: #f7fbff;
      text-shadow:
        0 0 10px rgba(180, 242, 255, 0.95),
        0 0 22px rgba(90, 210, 255, 0.8),
        0 0 42px rgba(76, 146, 255, 0.68),
        0 0 64px rgba(185, 120, 255, 0.42),
        0 10px 28px rgba(0, 0, 0, 0.32);
      animation: congratulations-neon 2.2s ease-in-out infinite alternate;
    }

    /* タイトルのスタイル */
    @media (max-width: 640px) {
      .overlayTitle {
        padding: 8px 12px 18px;
        transform: skewX(-6deg) rotate(-1.5deg);
      }

      .overlayTitle h1 {
        font-size: clamp(30px, 10vw, 46px);
        letter-spacing: -0.13em;
        transform: skewX(-4deg) scaleX(1.10);
        filter: drop-shadow(4px 5px 0 rgba(0,0,0,0.45));
      }

      .overlayTitle::before {
        bottom: 5px;
        height: 32%;
      }
    }

    /* お祝いエフェクトのスタイル */
    #celebrationLayer {
      position: fixed;
      inset: 0;
      z-index: 15;
      overflow: hidden;
      pointer-events: none;
    }

    /* お祝いエフェクトの紙吹雪一片のスタイル */
    .confetti-burst {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* お祝いエフェクトの紙吹雪一片のスタイル */
    .confetti-piece {
      position: absolute;
      top: -18vh;
      width: var(--confetti-width, 10px);
      height: var(--confetti-height, 18px);
      left: var(--confetti-left, 50vw);
      opacity: 0;
      border-radius: 2px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.85) 0%,
          rgba(255,255,255,0.18) 28%,
          var(--confetti-color, #ffffff) 28%,
          var(--confetti-color, #ffffff) 100%
        );
      box-shadow: 0 0 10px rgba(255,255,255,0.25);
      animation: confetti-fall var(--confetti-duration, 3s) ease-out var(--confetti-delay, 0s) forwards;
      transform: translate3d(0, 0, 0) rotate(var(--confetti-rotate-start, 0deg));
      transform-origin: center;
      will-change: transform, opacity;
    }

    /* お祝いエフェクトの紙吹雪が落ちるアニメーションのスタイル */
    @keyframes confetti-fall {
      0% {
        opacity: 0;
        transform: translate3d(0, -10vh, 0) rotate(var(--confetti-rotate-start, 0deg)) scale(0.8);
      }

      12% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate3d(var(--confetti-drift-x, 0vw), var(--confetti-fall-distance, 110vh), 0)
          rotate(var(--confetti-rotate-end, 540deg))
          scale(1.05);
      }
    }

    /* お祝いエフェクトのタイトルのネオンアニメーションのスタイル */
    @keyframes congratulations-neon {
      0% {
        text-shadow:
          0 0 8px rgba(180, 242, 255, 0.8),
          0 0 16px rgba(90, 210, 255, 0.62),
          0 0 30px rgba(76, 146, 255, 0.5),
          0 0 48px rgba(185, 120, 255, 0.28),
          0 10px 28px rgba(0, 0, 0, 0.32);
      }

      100% {
        text-shadow:
          0 0 12px rgba(205, 248, 255, 1),
          0 0 26px rgba(120, 224, 255, 0.88),
          0 0 48px rgba(89, 170, 255, 0.72),
          0 0 72px rgba(198, 132, 255, 0.42),
          0 10px 28px rgba(0, 0, 0, 0.32);
      }
    }

    /* オーバーレイのカードスタイル */
    .card {
      max-width: 780px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
    }

    /* オーバーレイのタイトルスタイル */
    .overlayStack {
      display: grid;
      justify-items: center;
      gap: 16px;
    }

    /* オーバーレイのタイトルスタイル */
    .overlayTitle {
      position: relative;
      padding: 10px 24px 22px;
      border-radius: 8px;
      background: transparent;
      border: none;
      box-shadow: none;
      transform: skewX(-8deg) rotate(-2deg);
    }

    /* オーバーレイのタイトルの背景装飾スタイル */
    .overlayTitle::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 0;
      bottom: 4px;
      height: 34%;
      z-index: -2;
      background: linear-gradient(
        90deg,
        rgba(40, 40, 40, 0.72),
        rgba(70, 70, 70, 0.86),
        rgba(30, 30, 30, 0.78)
      );
      transform: skewX(-18deg);
      border-radius: 4px;
      box-shadow:
        0 8px 0 rgba(255,255,255,0.85),
        0 12px 18px rgba(0,0,0,0.35);
    }

    /* オーバーレイのタイトルの背景装飾スタイル */
    .overlayTitle::after {
      content: "";
      position: absolute;
      left: -12px;
      right: -18px;
      bottom: -2px;
      height: 5px;
      z-index: -3;
      background: rgba(255,255,255,0.9);
      transform: skewX(-18deg);
      border-radius: 999px;
    }

    /* オーバーレイのタイトルのテキストスタイル */
    .overlayTitle h1 {
      margin: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.01em;

      font-family:
        "Arial Black",
        "Impact",
        "Yu Gothic",
        "Yu Gothic UI",
        "Meiryo",
        sans-serif;

      font-size: clamp(34px, 8vw, 76px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.115em;
      white-space: nowrap;

      transform: skewX(-4deg) scaleX(1.12);
      transform-origin: center;
      filter: drop-shadow(6px 7px 0 rgba(0,0,0,0.48));
    }

    /* オーバーレイのタイトルの各文字スタイル */
    .titleChar {
      display: inline-block;
      color: var(--title-color);
      font-weight: 1000;
      -webkit-text-stroke: clamp(3px, 0.58vw, 6px) #ffffff;
      text-stroke: clamp(3px, 0.58vw, 6px) #ffffff;

      text-shadow:
        2px 2px 0 rgba(255,255,255,0.95),
        5px 5px 0 rgba(0,0,0,0.32),
        0 0 8px rgba(255,255,255,0.45);

      transform:
        translateY(var(--title-y, 0px))
        rotate(var(--title-rot, 0deg))
        scaleX(1.16)
        scaleY(1.04)
        scale(var(--title-scale, 1));
    }
    .c1  { --title-color: #e91eaa; --title-y: 3px;  --title-rot: -6deg; --title-scale: 1.02; }
    .c2  { --title-color: #ff2d55; --title-y: -1px; --title-rot: -4deg; --title-scale: 1.00; }
    .c3  { --title-color: #ff3b30; --title-y: 2px;  --title-rot: -3deg; --title-scale: 1.02; }
    .c4  { --title-color: #ff9500; --title-y: -2px; --title-rot: -2deg; --title-scale: 1.00; }
    .c5  { --title-color: #ffd60a; --title-y: 1px;  --title-rot: 1deg;  --title-scale: 1.02; }
    .c6  { --title-color: #7bdc00; --title-y: -3px; --title-rot: 2deg;  --title-scale: 0.98; }
    .c7  { --title-color: #18d86b; --title-y: 1px;  --title-rot: 3deg;  --title-scale: 1.00; }
    .c8  { --title-color: #00c2ff; --title-y: -2px; --title-rot: 4deg;  --title-scale: 1.00; }
    .c9  { --title-color: #3b82f6; --title-y: 2px;  --title-rot: 5deg;  --title-scale: 1.03; }
    .c10 { --title-color: #8b5cf6; --title-y: -4px; --title-rot: 6deg;  --title-scale: 1.10; }

    /* オーバーレイの説明文スタイル */
    .card p {
      margin: 8px 0;
      opacity: .96;
    }

    /* キーボード操作説明のスタイル */
    .kbd {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.2);
    }

    /* エラー表示のスタイル */
    #errorBox {
      margin-top: 12px;
      text-align: left;
      white-space: pre-wrap;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.3);
      border: 1px solid rgba(255,255,255,.15);
      display: none;
      font-size: 12px;
    }
  </style>

  <!-- import map で "three" の参照先を明示 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div id="hudText"></div>
  </div>

  <div id="crosshair"></div>
  <div id="celebrationLayer" aria-hidden="true"></div>

  <div id="overlay">
    <div class="overlayStack">
      <div class="overlayTitle titleLogo">
        <h1 aria-label="ドキドキアーチェリー">
          <span class="titleChar c1">ド</span>
          <span class="titleChar c2">キ</span>
          <span class="titleChar c3">ド</span>
          <span class="titleChar c4">キ</span>
          <span class="titleChar c5">ア</span>
          <span class="titleChar c6">ー</span>
          <span class="titleChar c7">チ</span>
          <span class="titleChar c8">ェ</span>
          <span class="titleChar c9">リ</span>
          <span class="titleChar c10">ー</span>
        </h1>
      </div>
      <div class="card">
        <p>画面クリックで開始（マウス固定）</p>
        <p>
          <span class="kbd">左クリック長押し</span> でチャージ →
          <span class="kbd">左クリックを離す</span> で発射
        </p>
        <p>
          矢が止まったら <span class="kbd">左クリック</span> で元の視点に戻る /
          <span class="kbd">ESC</span> でマウス解除
        </p>
        <div id="errorBox"></div>
      </div>
    </div>
  </div>

  <div id="gameOverScreen">GAME OVER</div>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

    // ============================================================
    // 3D アーチェリーゲーム
    // ------------------------------------------------------------
    // 役割ごとにメソッド分けして、後で修正しやすい構成にしている
    //
    // createCore()         : Scene / Camera / Renderer / Controls
    // createEnvironment()  : 空・地面・照明・背景演出
    // createTargetSystem() : 的
    // createBowSystem()    : 弓と装填中の矢
    // createArrowModel()   : 飛ぶ矢の共通モデル
    // setupInput()         : 入力処理
    // update*()            : 毎フレーム更新
    // ============================================================

    // ------------------------------------------------------------
    // DOM
    // ------------------------------------------------------------
    const overlay = document.getElementById("overlay");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const errorBox = document.getElementById("errorBox");
    const hudText = document.getElementById("hudText");
    const celebrationLayer = document.getElementById("celebrationLayer");

    // 風の方向候補（左・右）。ベクトルはX軸方向のみで、速度はランダムに変化させる。
    const WIND_DIRECTIONS = [
      {
        label: "左",
        symbol: "←",
        vector: new THREE.Vector3(-1, 0, 0)
      },
      {        label: "右",
        symbol: "→",
        vector: new THREE.Vector3(1, 0, 0)
      }
    ];

    // 紙吹雪の色候補、1ヒットあたりの紙吹雪の数、同時に存在する紙吹雪の最大数、タッチデバイス判定
    const CONFETTI_COLORS = [
      "#ffe066",
      "#ff8fab",
      "#7bdff2",
      "#b8f2a1",
      "#cdb4ff",
      "#ffffff"
    ];
    // 紙吹雪の色候補、1ヒットあたりの紙吹雪の数、同時に存在する紙吹雪の最大数、タッチデバイス判定
    const CONFETTI_PIECES_PER_HIT = 40;
    // 紙吹雪の色候補、1ヒットあたりの紙吹雪の数、同時に存在する紙吹雪の最大数、タッチデバイス判定
    const MAX_ACTIVE_CONFETTI_BURSTS = 3;
    // 紙吹雪の色候補、1ヒットあたりの紙吹雪の数、同時に存在する紙吹雪の最大数、タッチデバイス判定
    const isTouchDevice =
      ("ontouchstart" in window) ||
      (navigator.maxTouchPoints > 0) ||
      (navigator.msMaxTouchPoints > 0);

    // ============================================================
    // 0. 共通設定・グローバル状態
    // ------------------------------------------------------------
    // DOM参照、定数、ゲーム全体の状態を上部に集約する。
    // 各処理はここで定義した game オブジェクトを読み書きする。
    // ============================================================

    /**
     * 役割: 初期化中や実行中に発生したエラーを画面上のエラー枠へ表示する。
     * 処理単位:
     * - エラー枠を表示状態へ変更する。
     * - 受け取ったエラーメッセージをそのまま画面へ出す。
     */
    function showError(message) {
      errorBox.style.display = "block";
      errorBox.textContent = message;
    }

    // ゼロ風・80%チャージ時にセンターへ寄せるための基準上向き補正
    const DEFAULT_ARROW_PITCH_BIAS = 0.012;

    // 草の色の基準と、ランダムな明るさの振れ幅
    const GRASS_BASE_COLOR = "#9aea90";
    const GRASS_LIGHTNESS_JITTER = 0.12;

    // ------------------------------------------------------------
    // グローバル状態
    // ------------------------------------------------------------
    const game = {
      scene: null,
      camera: null,
      renderer: null,
      controls: null,
      clock: new THREE.Clock(),

      // ワールド
      targetFace: null,
      targetRadius: 0.8,

      // 1: いまの草原 / 2: 競技場 / 3: 山奥
      fieldType: Math.floor(Math.random() * 3) + 1, // 1〜3 を起動時ランダム

      // 的の距離
      targetDistance: THREE.MathUtils.randFloat(3, 50), // 起動時に 3〜50

      // 風のエフェクト
      windFX: {
        streaks: [],
        textures: {
          streak: null
        }
      },

      // 草のエフェクト
      grassFX: {
        patches: []
      },

      // 観客のアニメーション管理
      spectators: [],

      // 手元の弓まわり
      bowRoot: null,
      bowString: null,
      loadedArrow: null,

      // ゲーム状態
      isCharging: false,
      chargeTime: 0,
      chargeDirection: 1, // 1: 増加中 / -1: 減少中
      maxChargeTime: 1.7,
      hasLoadedArrow: true,
      shots: 0,
      hits: 0,
      score: 0,
      shotScores: [], // 各射の点数履歴。外した射は 0
      hasStarted: false,
      isGameOver: false,
      timeLimit: 30,
      timeRemaining: 30,

      // 発射済み矢
      flyingArrows: [],

      // 木・岩・観客席など、矢が刺さる対象
      arrowCollisionObjects: [],

      // 追従カメラ
      followArrow: null,
      isHoldingOnImpact: false,
      isReturningCamera: false,
      impactHoldTime: 0,
      savedCameraPosition: new THREE.Vector3(),
      savedCameraQuaternion: new THREE.Quaternion(),
      followOffsetDistance: 3.2,
      followOffsetHeight: 0.65,
      followLookAhead: 5.0,
      followLerpSpeed: 6.5,
      returnLerpSpeed: 5.5,

      // スマホ用視点操作
      touchLook: {
        active: false,
        lastX: 0,
        lastY: 0,
        yaw: 0,
        pitch: 0,
        sensitivityX: 0.0032,
        sensitivityY: 0.0024
      },
      
      // 調整値
      gravity: new THREE.Vector3(0, -9.8, 0),
      windAccelerationScale: 1.35,
      wind: {
        directionIndex: 0,
        speed: 0
      },
      minSpeed: 18,
      maxSpeed: 56,
      maxLifetime: 10.0
      
    };
    
    // ============================================================
    // 外部連携設定（PowerShell受信用）
    // ============================================================
    const SCORE_POST_URL = "http://localhost:5000/score"; // PowerShell側
    const ENABLE_SCORE_POST = true; // ON/OFF切り替え

    // ============================================================
    // 1. 初期化・ブラウザ基盤
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: ゲーム全体の初期化入口。シーン、環境、的、弓、入力、リサイズ監視、HUDを順番に準備する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function init() {
      createCore();
      createEnvironment();
      createWindFX();
      createTargetSystem();
      createBowSystem();
      setupInput();
      setupResize();
      updateHUD();
    }

    /**
     * 役割: Three.jsのScene/Camera/Renderer/Controlsと、開始オーバーレイの入力を初期化する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createCore() {
      // シーン
      game.scene = new THREE.Scene();

      // 青空
      game.scene.background = new THREE.Color(0x87ceeb); 

      // カメラ
      game.camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        800
      );
      game.camera.position.set(0, 1.6, 8);
      game.camera.rotation.order = "YXZ";

      // タッチデバイス用の視点操作初期値
      game.touchLook.yaw = game.camera.rotation.y;
      game.touchLook.pitch = game.camera.rotation.x;

      // カメラの初期位置と向きを保存（追従カメラ用）
      game.savedCameraPosition.copy(game.camera.position);
      game.savedCameraQuaternion.copy(game.camera.quaternion);

      // 3Dレンダラ
      game.renderer = new THREE.WebGLRenderer({ antialias: true });
      game.renderer.setSize(window.innerWidth, window.innerHeight);
      game.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      game.renderer.domElement.style.touchAction = "none";
      document.body.appendChild(game.renderer.domElement);

      // 視点操作
      game.controls = new PointerLockControls(game.camera, document.body);

      // スマホ向け説明文へ差し替え
      if (isTouchDevice) {
        const card = document.querySelector("#overlay .card");
        if (card) {
          card.innerHTML = `
            <p>画面タップで開始</p>
            <p>
              <span class="kbd">長押し</span> でチャージ →
              <span class="kbd">指を離す</span> で発射
            </p>
            <p>
              <span class="kbd">ドラッグ</span> で視点移動 /
              矢が止まったら <span class="kbd">タップ</span> で元の視点に戻る
            </p>
            <div id="errorBox"></div>
          `;
        }
      }

      // オーバーレイとマウス操作の連携
      function handleOverlayStart(e) {
        if (game.isGameOver) return;

        // タッチデバイスの場合はオーバーレイを消すだけでゲーム開始。マウス固定は行わない。
        if (isTouchDevice) {
          e.preventDefault();
          e.stopPropagation();

          overlay.classList.add("hidden");

          if (!game.hasStarted) {
            startGame();
          }
          return;
        }

        game.controls.lock();
      }

      // オーバーレイ全体でクリックとタッチ開始をキャッチしてゲーム開始へ。タッチはパッシブオプションを外して、スクロール抑制も行う。
      overlay.addEventListener("click", handleOverlayStart);
      overlay.addEventListener("touchstart", handleOverlayStart, { passive: false });

      // マウスがロックされたらオーバーレイを消す。ゲーム開始前ならゲームも開始する。
      game.controls.addEventListener("lock", () => {
        overlay.classList.add("hidden");

        if (!game.hasStarted) {
          startGame();
        }
      });

      // マウスがアンロックされたら、ゲームオーバーでなければオーバーレイを再表示する。ゲームオーバー後はマウス操作でオーバーレイを消したくないため、何もしない。
      game.controls.addEventListener("unlock", () => {
        if (!game.isGameOver && !isTouchDevice) {
          overlay.classList.remove("hidden");
        }
      });
    }

    /**
     * 役割: 木・岩・観客席など、矢が刺さる対象メッシュを衝突判定リストへ登録する。
     * 処理単位:

     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function registerArrowCollisionObject(object3D) {
      // もしオブジェクトが存在しない場合は何もしない
      if (!object3D) return;

      // オブジェクトとその子孫をすべてチェックして、Meshがあれば衝突判定リストへ追加する
      object3D.traverse((child) => {
        if (child.isMesh) {
          game.arrowCollisionObjects.push(child);
        }
      });
    }

    /**
     * 役割: パノラマ画像を半球ドームへ貼り、遠景背景として表示する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createPanoramaSkyDome(imagePath) {
      const loader = new THREE.TextureLoader();

      // 読み込み前の仮背景色
      game.scene.background = new THREE.Color(0x0b4ea2);

      // 画像を読み込んでテクスチャを作成し、半球ドームのマテリアルに貼る。読み込み失敗もキャッチする。
      loader.load(
        imagePath,
        (texture) => {
          // テクスチャの設定。sRGBカラースペースで、繰り返しは水平のみ、フィルタは線形にする。
          texture.colorSpace = THREE.SRGBColorSpace;
          // 水平方向は繰り返してつなげる。垂直方向は端で止める。
          texture.wrapS = THREE.RepeatWrapping;
          // 垂直方向は端で止める。これで天頂と地平線のつなぎ目が自然になる。
          texture.wrapT = THREE.ClampToEdgeWrapping;
          // フィルタは線形にして、近距離でも遠距離でも自然に見えるようにする。
          texture.minFilter = THREE.LinearFilter;
          // フィルタは線形にして、近距離でも遠距離でも自然に見えるようにする。
          texture.magFilter = THREE.LinearFilter;

          // 上半球（天頂 → 地平線）に貼る
          const radius = 420;
          const geometry = new THREE.SphereGeometry(
            radius,
            96,
            48,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
          );

          // テクスチャを貼るマテリアル。裏面を向けて描画し、深度書き込みとフォグをオフにして、常に背景として表示されるようにする。
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            side: THREE.BackSide,
            depthWrite: false,
            fog: false,
            toneMapped: false
          });

          // 半球ドームを作成して、カメラ中心に配置する。gameオブジェクトに保持して、後で更新処理からもアクセスできるようにする。
          const dome = new THREE.Mesh(geometry, material);

          // カメラ中心に置く
          dome.position.copy(game.camera.position);

          // 必要なら後で別用途にも使えるよう保持
          game.skyDome = dome;
          game.scene.add(dome);

          console.log("panorama sky dome loaded:", imagePath);
        },
        undefined,
        (err) => {
          console.error("panorama sky dome load error:", imagePath, err);
        }
      );
    }

    /**
     * 役割: 背景ドームをカメラ位置へ追従させ、遠景が動いて見えないようにする。

    // ============================================================
    // 3. 地面・森・草・風エフェクト
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: 草原用の地面テクスチャをCanvasで生成し、平面メッシュへ貼り付ける。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createGrassGround() {
      // 草原用の地面テクスチャをCanvasで生成し、平面メッシュへ貼り付ける。
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;

      // 2Dコンテキストを取得して、地面テクスチャを描いていく。描き方は、ベースの芝色を塗った上に、色ムラ・粒感・芝の筋・土っぽい点をランダムに散らす感じで、それっぽく見えるようにしている。
      const ctx = canvas.getContext("2d");

      // ベースの芝色
      ctx.fillStyle = "#4f9444";
      ctx.fillRect(0, 0, 1024, 1024);

      // 大きめの色ムラ（芝の濃淡）
      for (let i = 0; i < 3200; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = 16 + Math.random() * 18;
        const g = 85 + Math.random() * 60;
        const b = 10 + Math.random() * 16;
        const size = 10 + Math.random() * 24;

        // rgbaで、アルファは薄めのランダム値にして、重なった部分が濃く見えるようにする
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.04 + Math.random() * 0.05})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 細かい粒感
      for (let i = 0; i < 70000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = 16 + Math.random() * 22;
        const g = 92 + Math.random() * 82;
        const b = 8 + Math.random() * 18;

        // rgbで、サイズは1.5pxの小さな四角にして、全体に細かい粒感があるようにする
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.fillRect(x, y, 1.5, 1.5);
      }

      // 短い芝の筋
      for (let i = 0; i < 32000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const len = 2 + Math.random() * 5;
        const tilt = (Math.random() - 0.5) * 0.9;

        // rgbaで、芝っぽい緑色をランダムにして、アルファは薄めのランダム値にして、重なった部分が濃く見えるようにする。線幅は1px程度にして、細い筋がたくさんあるようにする
        ctx.strokeStyle = `rgba(${20 + Math.random() * 25}, ${120 + Math.random() * 90}, ${12 + Math.random() * 20}, ${0.20 + Math.random() * 0.16})`;
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + tilt * 2.5, y - len);
        ctx.stroke();
      }

      // 土っぽい色を少し混ぜる
      for (let i = 0; i < 5000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;

        // rgbaで、茶色っぽい色をランダムにして、アルファは薄めのランダム値にして、重なった部分が濃く見えるようにする。サイズは2pxの小さな四角にして、全体に土っぽい点が散らばっているようにする
        ctx.fillStyle = `rgba(${70 + Math.random() * 35}, ${60 + Math.random() * 25}, ${35 + Math.random() * 20}, ${0.04 + Math.random() * 0.05})`;
        ctx.fillRect(x, y, 2, 2);
      }

      // Canvasからテクスチャを作成して、繰り返し設定をして、平面ジオメトリのマテリアルに貼る。地面は広いので、テクスチャは繰り返して表示する。
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(110, 110);

      // 平面ジオメトリを作成して、テクスチャを貼るマテリアルを作って、メッシュを生成する。地面は水平に広がるように、回転と位置を調整する。
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(1000, 1000),
        new THREE.MeshStandardMaterial({
          map: texture,
          roughness: 1.0,
          metalness: 0.0
        })
      );

      // 地面は水平に広がるように、回転と位置を調整する。回転はX軸に対して-90度（-Math.PI/2）回す。位置はY=0にする。
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;

      game.scene.add(ground);
    }

    /**
     * 役割: 草の葉の単体ジオメトリを作る。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createGrassBladeGeometry(height = 0.18, width = 0.035) {
      const shape = new THREE.Shape();

      // 根元は少し幅があり、先端は尖らせる
      shape.moveTo(-width * 0.5, 0);
      shape.quadraticCurveTo(-width * 0.42, height * 0.45, -width * 0.18, height * 0.82);
      shape.lineTo(0, height);
      shape.lineTo(width * 0.18, height * 0.82);
      shape.quadraticCurveTo(width * 0.42, height * 0.45, width * 0.5, 0);
      shape.closePath();

      // 2Dのシェイプからジオメトリを作成する。これで葉っぱの形ができる。必要に応じて、ジオメトリを回転やスケールで調整して、草の葉らしい見た目にする。
      const geo = new THREE.ShapeGeometry(shape);
      geo.translate(0, 0, 0);

      return geo;
    }

    /**
     * 役割: 射線周辺に揺れる草の群れを生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createGrassFX() {
      const bladeGeo = createGrassBladeGeometry(0.16, 0.030);

      // 草のパッチ数（1パッチに複数枚の葉が生える）
      const patchCount = 3000;

      // カメラ初期位置を中心に、近いほど高密度・遠いほど疎にする
      const cameraStartX = 0;
      const cameraStartZ = 8;

      // 草を生やす最大半径
      const grassRadius = 90;

      for (let i = 0; i < patchCount; i++) {
        // 中心寄りほど出やすくする
        const radialBias = Math.random() ** 1.5;

        // カメラ初期位置を中心に、近いほど高密度・遠いほど疎にする。ランダムな角度と、中心からの距離を半径方向のバイアスで決めて、草のパッチの位置を決める。
        const radius = radialBias * grassRadius;
        const angle = Math.random() * Math.PI * 2;

        // カメラ初期位置を中心に、近いほど高密度・遠いほど疎にする。ランダムな角度と、中心からの距離を半径方向のバイアスで決めて、草のパッチの位置を決める。これでカメラ周辺は草が密集し、遠くはまばらになる自然な配置になる。
        const x = cameraStartX + Math.cos(angle) * radius;
        const z = cameraStartZ + Math.sin(angle) * radius;

        // 草のパッチを作成して、位置を設定する。パッチは複数の葉をまとめるグループで、後で風エフェクトでまとめて揺らすために使う。
        const patch = new THREE.Group();
        patch.position.set(x, 0.002, z);

        // 1パッチに複数枚の葉をランダム生成
        const bladeCount = 3 + Math.floor(Math.random() * 4);

        // 1パッチに複数枚の葉をランダム生成。葉の色はベースの芝色から少し明るさをランダムに変えて、自然なバラつきを出す。葉の位置はパッチ中心から少しランダムにオフセットして、重なりすぎないようにする。葉の回転もランダムにして、同じ方向ばかりにならないようにする。葉のスケールも少しランダムにして、同じ大きさばかりにならないようにする。
        for (let j = 0; j < bladeCount; j++) {
          const bladeColor = new THREE.Color(GRASS_BASE_COLOR);
          const lightnessOffset = (Math.random() - 0.5) * GRASS_LIGHTNESS_JITTER;
          bladeColor.offsetHSL(0, 0, lightnessOffset);

          const bladeMat = new THREE.MeshStandardMaterial({
            color: bladeColor,
            roughness: 1.0,
            metalness: 0.0,
            side: THREE.DoubleSide
          });

          const blade = new THREE.Mesh(bladeGeo, bladeMat);

          blade.position.set(
            (Math.random() - 0.5) * 0.10,
            0,
            (Math.random() - 0.5) * 0.10
          );

          blade.rotation.y = Math.random() * Math.PI;
          blade.rotation.z = (Math.random() - 0.5) * 0.18;
          blade.scale.set(
            0.85 + Math.random() * 0.45,
            0.85 + Math.random() * 0.55,
            1
          );

          blade.userData.baseRotZ = blade.rotation.z;
          blade.userData.phase = Math.random() * Math.PI * 2;
          blade.userData.sway = 0.03 + Math.random() * 0.035;

          patch.add(blade);
        }

        patch.userData.phase = Math.random() * Math.PI * 2;
        game.scene.add(patch);
        game.grassFX.patches.push(patch);
      }
    }

    /**
     * 役割: 時間経過と風に合わせて草の揺れを更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateGrassFX(dt, elapsed) {
      // もし草のパッチがない場合は何もしない
      if (!game.grassFX?.patches?.length) return;

      // 風の向きと強さを取得する。風の向きは、ゲーム状態から現在の風向きを取得する関数があればそれを呼び出して得る。なければnullとする。
      const windDir = typeof getCurrentWindDirection === "function"
        ? getCurrentWindDirection()
        : null;

      // 風の向きがある場合は、風の強さを計算して、草の揺れに反映する。風の強さは、ゲーム状態から現在の風速を取得する関数があればそれを呼び出して得る。なければ0とする。風の強さは、適当な値でスケーリングして、0から1の範囲にクランプする。風の向きは、x成分が正なら右向き、負なら左向きとする。
      const dirSign = windDir?.vector?.x >= 0 ? 1 : -1;
      // 風の強さは、ゲーム状態から現在の風速を取得する関数があればそれを呼び出して得る。なければ0とする。風の強さは、適当な値でスケーリングして、0から1の範囲にクランプする。これで風が強いほど草が大きく揺れるようになる。
      const windSpeed = game.hasStarted ? game.wind.speed : 0;
      const windStrength = THREE.MathUtils.clamp(windSpeed / 7.0, 0, 1);

      // 草のパッチをループして、各葉の回転を時間経過と風の強さに合わせて更新する。葉の揺れは、時間経過に対してサイン波で変化させる。風の強さも揺れに加算して、風が強いほど大きく揺れるようにする。風の向きも揺れに加算して、風が右向きなら右に、左向きなら左に揺れるようにする。
      for (const patch of game.grassFX.patches) {
        for (const blade of patch.children) {
          const baseRotZ = blade.userData.baseRotZ ?? 0;
          const phase = blade.userData.phase ?? 0;
          const sway = blade.userData.sway ?? 0.03;

          const flutter =
            Math.sin(elapsed * 2.2 + phase) * sway * 0.75 +
            Math.sin(elapsed * 4.4 + phase * 1.6) * sway * 0.25;

          blade.rotation.z =
            baseRotZ +
            flutter +
            dirSign * windStrength * sway * 1.8;
        }
      }
    }

    /**
     * 役割: 山奥用の濃い土・苔・落ち葉の地面テクスチャを生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createForestGround() {
      // 山奥用の濃い土・苔・落ち葉の地面テクスチャを生成する。描き方は、ベースの土を塗った上に、暗めの土のムラ、苔っぽい暗緑、細かい粒、落ち葉っぽい茶色の点をランダムに散らす感じで、それっぽく見えるようにしている。
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      // 2Dコンテキストを取得して、地面テクスチャを描いていく。描き方は、ベースの土を塗った上に、暗めの土のムラ、苔っぽい暗緑、細かい粒、落ち葉っぽい茶色の点をランダムに散らす感じで、それっぽく見えるようにしている。
      const ctx = canvas.getContext("2d");

      // ベースの土：今より濃い焦げ茶
      ctx.fillStyle = "#3f3024";
      ctx.fillRect(0, 0, 1024, 1024);

      // 暗めの土のムラ
      for (let i = 0; i < 6500; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const size = 8 + Math.random() * 26;

        const r = 45 + Math.random() * 35;
        const g = 35 + Math.random() * 28;
        const b = 24 + Math.random() * 20;
        const a = 0.05 + Math.random() * 0.08;

        // rgbaで、茶色っぽい色をランダムにして、アルファは薄めのランダム値にして、重なった部分が濃く見えるようにする。サイズは8pxから34px程度の円にして、全体に土のムラがあるようにする
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 苔っぽい暗緑を少し混ぜる
      for (let i = 0; i < 4200; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const size = 5 + Math.random() * 18;

        const r = 22 + Math.random() * 18;
        const g = 55 + Math.random() * 42;
        const b = 22 + Math.random() * 20;
        const a = 0.04 + Math.random() * 0.07;

        // rgbaで、茶色っぽい色をランダムにして、アルファは薄めのランダム値にして、重なった部分が濃く見えるようにする。サイズは5pxから23px程度の円にして、全体に苔のムラがあるようにする
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 細かい粒：暗め
      for (let i = 0; i < 24000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;

        const r = 38 + Math.random() * 35;
        const g = 32 + Math.random() * 28;
        const b = 22 + Math.random() * 20;

        // rgbで、茶色っぽい色をランダムにして、サイズは2pxの小さな四角にして、全体に細かい粒が散らばっているようにする
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x, y, 2, 2);
      }

      // 落ち葉っぽい茶色の点
      for (let i = 0; i < 4500; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;

        const r = 70 + Math.random() * 45;
        const g = 40 + Math.random() * 28;
        const b = 18 + Math.random() * 16;
        const a = 0.07 + Math.random() * 0.09;

        // rgbaで、茶色っぽい色をランダムにして、アルファは薄めのランダム値にして、重なった部分が濃く見えるようにする。サイズは3pxの小さな四角にして、全体に落ち葉の点が散らばっているようにする
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.fillRect(x, y, 3, 2);
      }

      // Canvasからテクスチャを作成して、繰り返し設定をして、平面ジオメトリのマテリアルに貼る。地面は広いので、テクスチャは繰り返して表示する。
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(95, 95);

      // 平面ジオメトリを作成して、テクスチャを貼るマテリアルを作って、メッシュを生成する。地面は水平に広がるように、回転と位置を調整する。
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(1000, 1000),
        new THREE.MeshStandardMaterial({
          map: texture,
          roughness: 1.0,
          metalness: 0.0
        })
      );

      // 地面は水平に広がるように、回転と位置を調整する。回転はX軸に対して-90度（-Math.PI/2）回す。位置はY=0にする。
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      game.scene.add(ground);
    }

    /**
     * 役割: プレイヤー周囲360度に森の木を配置し、射線と的周辺だけ空ける。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createForestTrees360Dense() {
      // 木の幹と葉のマテリアルを作成する。幹は濃い茶色で、葉は明るい緑色にして、どちらも粗さを高くしてマットな質感にする。
      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x5d4128,
        roughness: 1.0
      });

      // 葉は明るい緑色にして、粗さを高くしてマットな質感にする。これで木全体が自然な感じの色と質感になる。
      const leafMat = new THREE.MeshStandardMaterial({
        color: 0x5fbf2a,
        roughness: 1.0
      });

      // プレイヤー初期位置を中心に360度へ木を配置
      const centerX = game.camera.position.x;
      const centerZ = game.camera.position.z;

      // 的は createTargetSystem() より前に森を作るので、
      // targetCenter ではなく targetDistance から位置を計算する
      const targetZ = centerZ - game.targetDistance;

      // パラメータ
      const treeCount = 520;

      // ここを小さくすることで、初期位置の近くにも木を生やす
      // ただし完全に足元へ生えると邪魔なので、最低限だけ空ける
      const innerRadius = 3.5;

      // ここを大きくすることで、遠い位置まで木を生やす
      const outerRadius = 115;

      // 射線だけ空ける
      const laneHalfWidth = 5.0;

      // 的の少し後ろまでは空ける
      const laneBackMargin = 3.5;

      // プレイヤーより後ろ側は大きく空けない
      // ここを 18 などにすると、初期位置近くの木が減る
      const laneFrontMargin = 0.8;

      // 的の周辺は見やすく空ける
      const targetClearRadius = 3.2;

      // 木を配置する際の最大試行回数。これを超えると、木の配置を諦める。木の数が多いほど、または射線や的周辺を広く空けるほど、配置できない可能性が高くなるので、試行回数を増やす必要がある。
      const maxAttempts = treeCount * 40;

      let placed = 0;
      let attempts = 0;

      // 木を配置する際の最大試行回数。これを超えると、木の配置を諦める。木の数が多いほど、または射線や的周辺を広く空けるほど、配置できない可能性が高くなるので、試行回数を増やす必要がある。これで無限ループになるのを防止する。
      while (placed < treeCount && attempts < maxAttempts) {
        attempts++;

        // 近くにも出やすくする
        // Math.random() ** 1.35 にすると中心寄りが増える
        const angle = Math.random() * Math.PI * 2;
        const radialBias = Math.random() ** 1.35;
        const radius = innerRadius + radialBias * (outerRadius - innerRadius);

        // プレイヤー初期位置を中心に360度へ木を配置。ランダムな角度と、中心からの距離を半径方向のバイアスで決めて、木の位置を決める。これでカメラ周辺は木が密集し、遠くはまばらになる自然な配置になる。
        const x = centerX + Math.cos(angle) * radius;
        const z = centerZ + Math.sin(angle) * radius;

        // 射線（プレイヤー→的）部分だけ空ける
        const inShootingLane =
          Math.abs(x - centerX) < laneHalfWidth &&
          z >= targetZ - laneBackMargin &&
          z <= centerZ + laneFrontMargin;

        // 的のすぐ近くも空ける
        const dxTarget = x - centerX;
        const dzTarget = z - targetZ;
        const nearTarget =
          dxTarget * dxTarget + dzTarget * dzTarget <
          targetClearRadius * targetClearRadius;

        // 射線と的周辺は木を置かない。これで、プレイヤーが最初に見る方向に木がなくなり、見通しが良くなって、ゲーム開始時の視認性が向上する。
        if (inShootingLane || nearTarget) {
          continue;
        }

        // 指定位置に幹と葉の塊からなる木を生成する。これで、ランダムな位置に木が生えるようになる。
        createForestTreeAt(x, z, trunkMat, leafMat);
        placed++;
      }
    }

    /**
     * 役割: 指定位置に幹と葉の塊からなる木を生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createForestTreeAt(x, z, trunkMat, leafMat) {
      // 木全体をまとめるグループを作成する。これで、幹と葉の塊をまとめて管理できるようになる。
      const tree = new THREE.Group();

      // 幹を作成して、グループに追加する。幹の高さはランダムにして、木ごとにバラつきを出す。これで、木の見た目に自然なバラつきが生まれる。
      const trunkH = 4.5 + Math.random() * 5.5;
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.22, trunkH, 10),
        trunkMat
      );
      trunk.position.y = trunkH / 2;
      tree.add(trunk);

      // 葉の塊を複数
      for (let j = 0; j < 4; j++) {
        const crown = new THREE.Mesh(
          new THREE.SphereGeometry(1.2 + Math.random() * 0.8, 8, 8),
          leafMat
        );

        // 葉の塊の位置は、幹の上の方を中心に、少しランダムにオフセットする。これで、葉の塊が幹の上の方にまとまって生えるようになり、自然な見た目になる。
        crown.position.set(
          (Math.random() - 0.5) * 1.4,
          trunkH - 0.4 + j * 0.9,
          (Math.random() - 0.5) * 1.4
        );

        // 葉の塊のスケールも少しランダムにして、同じ大きさばかりにならないようにする。これで、葉の塊ごとに大きさがバラバラになり、自然な見た目になる。
        crown.scale.set(
          1.0 + Math.random() * 0.5,
          0.8 + Math.random() * 0.5,
          1.0 + Math.random() * 0.5
        );

        tree.add(crown);
      }

      // 木全体の位置を設定する。これで、木が指定した位置に生えるようになる。
      tree.position.set(x, 0, z);
      tree.rotation.y = Math.random() * Math.PI * 2;
      game.scene.add(tree);

      // 矢の当たり判定対象にする
      registerArrowCollisionObject(tree);
    }

    /**
     * 役割: 山奥フィールドに岩をランダム配置する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createForestRocks() {
      // 岩のマテリアルを作成する。色は灰色で、粗さを高くしてマットな質感にする。これで、岩が自然な感じの色と質感になる。
      const rockMat = new THREE.MeshStandardMaterial({
        color: 0x4a4a43,
        roughness: 1.0,
        metalness: 0.0
      });

      // プレイヤー初期位置を中心に360度へ岩を配置
      const centerX = game.camera.position.x;
      const centerZ = game.camera.position.z;
      const targetZ = centerZ - game.targetDistance;

      // 岩の数を設定する。多すぎると配置できない可能性が高くなるので、適切な数にする必要がある。岩は木よりも少なめにして、木の隙間に点在する感じにすると、自然な見た目になる。
      const rockCount = 42;

      // ここを小さくすることで、初期位置の近くにも岩を置く
      const innerRadius = 4.0;
      const outerRadius = 85;

      // 射線と的周辺には岩を置かない
      const laneHalfWidth = 3.2;
      const laneBackMargin = 2.5;
      const laneFrontMargin = 1.0;
      const targetClearRadius = 3.0;

      let placed = 0;
      let attempts = 0;
      const maxAttempts = rockCount * 40;

      // 岩を配置する際の最大試行回数。これを超えると、岩の配置を諦める。岩の数が多いほど、または射線や的周辺を広く空けるほど、配置できない可能性が高くなるので、試行回数を増やす必要がある。これで無限ループになるのを防止する。
      while (placed < rockCount && attempts < maxAttempts) {
        attempts++;

        // 近くにも出やすくする
        const angle = Math.random() * Math.PI * 2;
        const radialBias = Math.random() ** 1.25;
        const radius = innerRadius + radialBias * (outerRadius - innerRadius);

        // プレイヤー初期位置を中心に360度へ岩を配置。ランダムな角度と、中心からの距離を半径方向のバイアスで決めて、岩の位置を決める。これでカメラ周辺は岩が密集し、遠くはまばらになる自然な配置になる。
        const x = centerX + Math.cos(angle) * radius;
        const z = centerZ + Math.sin(angle) * radius;

        // 射線と的周辺には岩を置かない。これで、プレイヤーが最初に見る方向に岩がなくなり、見通しが良くなって、ゲーム開始時の視認性が向上する。また、的の周辺も空けることで、的が見やすくなる。
        const inShootingLane =
          Math.abs(x - centerX) < laneHalfWidth &&
          z >= targetZ - laneBackMargin &&
          z <= centerZ + laneFrontMargin;

        // 的のすぐ近くも空ける
        const dxTarget = x - centerX;
        const dzTarget = z - targetZ;
        const nearTarget =
          dxTarget * dxTarget + dzTarget * dzTarget <
          targetClearRadius * targetClearRadius;

        if (inShootingLane || nearTarget) {
          continue;
        }

        // 指定位置に岩メッシュを作成して、矢の衝突対象に登録する。これで、ランダムな位置に岩が生えるようになる。
        createForestRockAt(x, z, rockMat);
        placed++;
      }
    }

    /**
     * 役割: 指定位置に岩メッシュを作成し、矢の衝突対象に登録する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createForestRockAt(x, z, rockMat) {
      // 岩メッシュを作成する。ジオメトリは、ランダムなサイズの十二面体にして、回転もランダムにして、スケールもランダムにして、同じ形や大きさの岩が並ばないようにする。これで、岩が自然な感じの形と大きさになる。
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.45 + Math.random() * 0.55, 0),
        rockMat
      );

      // 岩の位置を設定する。これで、岩が指定した位置に生えるようになる。Y座標は地面から少し浮かせて、岩が地面に埋まらないようにする。
      rock.position.set(x, 0.18, z);

      // 岩の回転をランダムにして、同じ形の岩が並ばないようにする。これで、岩の見た目に自然なバラつきが生まれる。
      rock.rotation.set(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI
      );

      // 岩のスケールもランダムにして、同じ大きさの岩が並ばないようにする。これで、岩の見た目に自然なバラつきが生まれる。
      rock.scale.set(
        1.2 + Math.random() * 1.2,
        0.45 + Math.random() * 0.45,
        0.8 + Math.random() * 1.1
      );

      // 岩メッシュをシーンに追加する。これで、岩がゲームの世界に表示されるようになる。
      game.scene.add(rock);

      // 矢の当たり判定対象にする
      registerArrowCollisionObject(rock);
    }

    /**
     * 役割: 風エフェクト用のテクスチャと粒子をまとめて初期化する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createWindFX() {
      // 風エフェクト用のテクスチャと粒子をまとめて初期化する。これで、風エフェクトに必要なリソースが揃い、ゲーム開始前に準備が完了する。
      createWindFXTextures();
      // 風の流れを表すスプライト群を生成する。これで、風の流れを表すスプライトがシーンに追加され、風エフェクトが表示できるようになる。
      createWindStreakSprites();
    }

    /**
     * 役割: 風の流線表示に使うCanvasテクスチャを生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createWindFXTextures() {
      // 風の流線表示に使うCanvasテクスチャを生成する。これで、風の流線表示に必要なテクスチャが用意され、風エフェクトが表示できるようになる。
      const streakCanvas = document.createElement("canvas");
      streakCanvas.width = 128;
      streakCanvas.height = 32;
      // 2Dコンテキストを取得して、流線のグラデーションを描いていく。グラデーションは、横方向に透明から半透明の白、さらに濃い白、また半透明の白、最後に透明へと変化するようにして、流線が自然な感じでフェードイン・フェードアウトするようにする。
      const sctx = streakCanvas.getContext("2d");

      // 横方向に透明から半透明の白、さらに濃い白、また半透明の白、最後に透明へと変化するようなグラデーションを作る。これで、流線が自然な感じでフェードイン・フェードアウトするようになる。
      const streakGrad = sctx.createLinearGradient(0, 16, 128, 16);
      streakGrad.addColorStop(0, "rgba(255,255,255,0)");
      streakGrad.addColorStop(0.18, "rgba(255,255,255,0.18)");
      streakGrad.addColorStop(0.50, "rgba(255,255,255,0.55)");
      streakGrad.addColorStop(0.82, "rgba(255,255,255,0.18)");
      streakGrad.addColorStop(1, "rgba(255,255,255,0)");

      // グラデーションで流線を描く。これで、流線のテクスチャが完成する。
      sctx.fillStyle = streakGrad;
      sctx.beginPath();
      sctx.roundRect(0, 10, 128, 12, 6);
      sctx.fill();

      // Canvasからテクスチャを作成して、ゲームのwindFX.textures.streakに保存する。これで、流線のテクスチャがゲームの状態に保存され、風エフェクトのスプライトで使用できるようになる。
      game.windFX.textures.streak = new THREE.CanvasTexture(streakCanvas);
    }

    /**
     * 役割: 風の流れを表すスプライト群を生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createWindStreakSprites() {
      // 風の流れを表すスプライト群を生成する。これで、風の流れを表すスプライトがシーンに追加され、風エフェクトが表示できるようになる。
      const count = 40;

      // 風の流れを表すスプライトを指定数だけ生成する。各スプライトは、ランダムな位置、サイズ、速度スケール、揺れの位相などのパラメータを持つ。これで、風の流れを表すスプライトがランダムに配置され、自然な感じの風エフェクトになる。
      for (let i = 0; i < count; i++) {
        // スプライトマテリアルを作成する。テクスチャは先ほど作成した流線のテクスチャを使用し、透明で、初期状態では見えないようにして、深度書き込みをオフにする。これで、風の流れを表すスプライトが適切な見た目と描画設定になる。
        const material = new THREE.SpriteMaterial({
          map: game.windFX.textures.streak,
          transparent: true,
          opacity: 0,
          depthWrite: false
        });

        // スプライトを作成してシーンに追加する。これで、風の流れを表すスプライトがゲームの世界に表示されるようになる。
        const sprite = new THREE.Sprite(material);
        game.scene.add(sprite);

        // x を広げて横方向の流れるエリアを拡大
        // y を広げて上の空間まで風を出す
        // z を広げて奥まで風を出す
        // width を伸ばして筋を長くする
        // height を上げて少し太くする
        const p = {
          sprite,
          x: (Math.random() - 0.5) * 160,
          y: 0.2 + Math.random() * 5.2,
          z: -3 - Math.random() * 65,
          width: 2.8 + Math.random() * 5.0,
          height: 0.12 + Math.random() * 0.22,
          speedScale: 0.8 + Math.random() * 1.0,
          swayPhase: Math.random() * Math.PI * 2,

          // ゆらぎ追加
          driftPhase: Math.random() * Math.PI * 2,
          stretchPhase: Math.random() * Math.PI * 2,
          swayAmpY: 0.03 + Math.random() * 0.05,
          swayAmpZ: 0.04 + Math.random() * 0.10,
          speedJitter: 0.85 + Math.random() * 0.35
        };

        sprite.position.set(p.x, p.y, p.z);
        sprite.scale.set(p.width, p.height, 1);

        game.windFX.streaks.push(p);
      }
    }

    /**
     * 役割: 風スプライトの横位置を再配置する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function resetWindFXParticleX(p, dirSign, rangeX = 90) {
      p.x = dirSign > 0
        ? -rangeX - Math.random() * 8
        :  rangeX + Math.random() * 8;
    }

    /**
     * 役割: 風エフェクト全体を毎フレーム更新する入口。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateWindFX(dt, elapsed) {
      // 風エフェクト全体を毎フレーム更新する入口。これで、風エフェクトの更新処理が毎フレーム呼び出され、風の流れがアニメーションするようになる。
      if (!game.windFX) return;
      if (typeof getCurrentWindDirection !== "function") return;

      // 風向きと風速を取得する。これで、現在の風の状態を知ることができ、風エフェクトの動きに反映できる。
      const windDir = getCurrentWindDirection();
      if (!windDir?.vector) return;

      // 風向きのx成分が正なら右向き、負なら左向きとする。これで、風の流れの方向を決めることができる。
      const dirSign = windDir.vector.x >= 0 ? 1 : -1;
      const windSpeed = game.hasStarted ? game.wind.speed : 0;
      const visibility = THREE.MathUtils.clamp(windSpeed / 7.0, 0, 1);

      // 風向き・風速に応じて流線スプライトを移動させる。これで、風の流れを表すスプライトが風の状態に応じて動くようになり、風エフェクトがリアルに見えるようになる。
      updateWindStreaks(dt, elapsed, dirSign, windSpeed, visibility);
    }

    /**
     * 役割: 風向き・風速に応じて流線スプライトを移動させる。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateWindStreaks(dt, elapsed, dirSign, windSpeed, visibility) {
      // 風向き・風速に応じて流線スプライトを移動させる。これで、風の流れを表すスプライトが風の状態に応じて動くようになり、風エフェクトがリアルに見えるようになる。
      const activeCount = Math.floor(3 + visibility * game.windFX.streaks.length);

      // すべてのスプライトについて、風の強さに応じて表示・非表示を切り替え、表示するものは位置やサイズを更新する。これで、風の状態に応じてスプライトが動き、風エフェクトがリアルに見えるようになる。
      for (let i = 0; i < game.windFX.streaks.length; i++) {
        // スプライトのパラメータを取得する。これで、スプライトの現在の状態を知ることができ、更新処理に反映できる。
        const p = game.windFX.streaks[i];
        const active = i < activeCount;

        // スプライトの表示・非表示を切り替える。これで、風の強さに応じてスプライトが現れたり消えたりするようになり、風エフェクトがリアルに見えるようになる。
        p.sprite.visible = active;
        if (!active) continue;

        // 速度にゆるい揺らぎを入れる
        const speedWave =
          1 +
          Math.sin(elapsed * (1.6 + p.speedScale * 0.7) + p.driftPhase) * 0.16 +
          Math.sin(elapsed * (3.4 + p.speedScale * 0.4) + p.driftPhase * 1.7) * 0.06;

        // 風速、スプライトごとの速度スケール、ゆらぎを組み合わせて移動量を計算する。これで、風の状態とスプライトの個体差に応じて、スプライトが自然な感じで動くようになる。
        const moveSpeed =
          (1.2 + windSpeed * 2.6) *
          p.speedScale *
          p.speedJitter *
          speedWave;

        // スプライトのx位置を更新する。これで、スプライトが風の流れに沿って動くようになる。
        p.x += dirSign * moveSpeed * dt;

        // スプライトが一定の範囲を超えたら反対側に回す。これで、スプライトが風の流れに沿って循環するようになり、風エフェクトが途切れずに続くようになる。
        if (dirSign > 0 && p.x > 90) resetWindFXParticleX(p, dirSign, 90);
        // 右向きのとき、xが90を超えたら左側の-90あたりに回す。左向きのとき、xが-90を下回ったら右側の90あたりに回す。これで、スプライトが風の流れに沿って循環するようになり、風エフェクトが途切れずに続くようになる。
        if (dirSign < 0 && p.x < -90) resetWindFXParticleX(p, dirSign, 90);

        // 上下だけでなく奥行きにも微妙な揺れ
        const bobY =
          Math.sin(elapsed * (1.2 + p.speedScale) + p.swayPhase) * p.swayAmpY +
          Math.sin(elapsed * (2.7 + p.speedScale * 0.6) + p.swayPhase * 1.9) * p.swayAmpY * 0.45;

        // Z軸方向の揺れを追加。これで、スプライトが風の流れに沿って自然な感じで揺れるようになる。
        const bobZ =
          Math.sin(elapsed * (1.8 + p.speedScale * 0.5) + p.driftPhase) * p.swayAmpZ;

        // 長さをわずかに伸び縮み
        const stretch =
          1 +
          Math.sin(elapsed * (2.2 + p.speedScale * 0.5) + p.stretchPhase) * 0.10;

        // スプライトの位置を更新する。これで、スプライトが風の流れに沿って自然な感じで動くようになる。
        p.sprite.position.set(p.x, p.y + bobY, p.z + bobZ);
        p.sprite.material.opacity = 0.16 + visibility * 0.28;

        // スプライトのサイズを更新する。これで、スプライトが風の状態に応じて自然な感じで伸び縮みするようになる。
        p.sprite.scale.set(
          p.width * (1.9 + visibility * 0.8) * stretch,
          p.height * (2.8 + visibility * 1.1) * (0.96 + (2 - stretch) * 0.04),
          1
        );
      }
    }

    // ============================================================
    // 4. 競技場・観客モデル
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: 左右スタンド、後方スタンド、的後方壁をまとめて配置する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createStadiumStands() {
      // スタンドのマテリアルを作成する。土台は明るいグレー、座席は青、通路は薄いグレーにして、全体的に少しマットな質感にする。これで、スタンドが競技場らしい見た目になる。
      const standMat = new THREE.MeshStandardMaterial({
        color: 0xbfc7d6,
        roughness: 0.95
      });

      // 座席は青、通路は薄いグレーにして、全体的に少しマットな質感にする。これで、スタンドが競技場らしい見た目になる。
      const seatMat = new THREE.MeshStandardMaterial({
        color: 0x3d5fa8,
        roughness: 0.9
      });

      // 通路は薄いグレーにして、全体的に少しマットな質感にする。これで、スタンドが競技場らしい見た目になる。
      const aisleMat = new THREE.MeshStandardMaterial({
        color: 0xd6dbe5,
        roughness: 0.95
      });

      // プレイヤー初期位置を中心に、左右スタンドと後方スタンド、的の後ろの壁を配置する。これで、競技場の構造ができあがり、ゲームの世界が完成する。
      const centerX = game.camera.position.x;
      // カメラの初期Z位置を取得する。これで、スタンドの配置に必要な基準となる位置を知ることができる。
      const startZ = game.camera.position.z;

      // createTargetSystem() より前に呼ばれるため、targetCenter ではなく targetDistance から計算する
      const targetZ = startZ - game.targetDistance;

      // 射線まわりは空ける
      const laneHalfWidth = 4.2;

      // 観客席の外側位置
      const sideStandInnerX = laneHalfWidth + 1.8;
      const sideStandOuterX = sideStandInnerX + 8.5;

      // 初期地点の少し後ろから、的の少し手前まで左右スタンドを置く
      const zFront = startZ + 5.0;
      const zBack = targetZ + 2.0;

      // 左側の階段状スタンドを生成する。これで、プレイヤーの左右に階段状の観客席ができ、競技場らしい雰囲気になる。
      createSideStadiumStand({
        side: -1,
        centerX,
        zFront,
        zBack,
        innerX: sideStandInnerX,
        outerX: sideStandOuterX,
        standMat,
        seatMat,
        aisleMat
      });

      // 右側の階段状スタンドを生成する。これで、プレイヤーの左右に階段状の観客席ができ、競技場らしい雰囲気になる。
      createSideStadiumStand({
        side: 1,
        centerX,
        zFront,
        zBack,
        innerX: sideStandInnerX,
        outerX: sideStandOuterX,
        standMat,
        seatMat,
        aisleMat
      });

      // 初期位置の後方は、的の後ろに置いていたような階段状スタンドで囲う
      createBackStadiumStand({
        centerX,
        z: startZ + 7.0,
        width: sideStandOuterX * 2 + 2.5,
        direction: 1,
        standMat,
        seatMat,
        aisleMat
      });

      // 的の後方は観客席ではなく、矢が飛ぶのでフラットな壁だけにする
      createFlatTargetBackWall({
        centerX,
        z: targetZ - 7.5,
        width: sideStandOuterX * 2 + 2.5,
        standMat,
        aisleMat
      });
    }

    /**
     * 役割: 左右どちらか一方の階段状観客席を生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createSideStadiumStand({
      side,
      centerX,
      zFront,
      zBack,
      innerX,
      outerX,
      standMat,
      seatMat,
      aisleMat
    }) {
      // 階段状の観客席を生成する。これで、プレイヤーの左右に階段状の観客席ができ、競技場らしい雰囲気になる。
      const group = new THREE.Group();

      // 階段席の奥行きと中心位置を計算する。これで、階段席のサイズと配置が決まり、正しい位置にスタンドができるようになる。
      const length = Math.abs(zFront - zBack);
      const centerZ = (zFront + zBack) / 2;

      // 階段の段数と、段ごとの奥行き方向の分割数を設定する。これで、階段席の構造が決まり、段数や分割数を調整することで見た目を変えることができるようになる。
      const stepCount = 8;
      const segmentCount = 10;
      const stepWidth = (outerX - innerX) / stepCount;
      const segmentDepth = length / segmentCount;

      // 左右どちらのスタンドかを示す符号。これで、左右どちらのスタンドを作るかを指定でき、同じ関数で両方のスタンドを生成できるようになる。
      const sideSign = side; // -1: 左 / 1: 右

      // 土台
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(outerX - innerX + 0.8, 0.6, length),
        standMat
      );

      // 土台の位置を設定する。これで、土台が正しい位置に配置され、スタンドの構造ができるようになる。
      base.position.set(
        centerX + sideSign * ((innerX + outerX) / 2),
        0.3,
        centerZ
      );

      // 土台をグループに追加する。これで、土台がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
      group.add(base);

      // 階段席
      for (let xStep = 0; xStep < stepCount; xStep++) {
        const height = 0.45 + xStep * 0.42;

        // 射線側から外側へ行くほど高くする
        const x = centerX + sideSign * (innerX + stepWidth * xStep + stepWidth / 2);

        // 奥行き方向に分割して、その位置に座席を配置する
        for (let zStep = 0; zStep < segmentCount; zStep++) {
          // 座席のz位置を計算する。これで、座席が階段状に配置され、スタンドの構造ができるようになる。
          const z = zFront - segmentDepth * zStep - segmentDepth / 2;

          // 座席メッシュを作成する。ジオメトリは、段の幅と分割の奥行きから少し小さめにして、マテリアルは先ほど作成した座席用のマテリアルを使用する。これで、座席がスタンドの構造に合ったサイズと見た目になるようになる。
          const seat = new THREE.Mesh(
            new THREE.BoxGeometry(stepWidth * 0.96, 0.34, segmentDepth * 0.92),
            seatMat
          );

          // 座席の位置を設定する。これで、座席が正しい位置に配置され、階段席の構造ができるようになる。
          seat.position.set(
            x,
            height,
            z
          );

          // 座席をグループに追加する。これで、座席がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
          group.add(seat);

          // その座席に観客を置く
          maybeAddSpectatorOnSeat(group, seat.position, {
            facing: "field",
            side: sideSign
          });
        }
      }

      // 外側の背面壁
      const backWall = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 4.8, length),
        standMat
      );

      // 背面壁の位置を設定する。これで、背面壁が正しい位置に配置され、スタンドの構造ができるようになる。
      backWall.position.set(
        centerX + sideSign * (outerX + 0.45),
        2.4,
        centerZ
      );

      // 背面壁をグループに追加する。これで、背面壁がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
      group.add(backWall);

      // 射線側の低い縁
      const innerWall = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.75, length),
        aisleMat
      );

      // 射線側の低い縁の位置を設定する。これで、射線側の低い縁が正しい位置に配置され、スタンドの構造ができるようになる。
      innerWall.position.set(
        centerX + sideSign * (innerX - 0.25),
        0.38,
        centerZ
      );

      // 射線側の低い縁をグループに追加する。これで、射線側の低い縁がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
      group.add(innerWall);

      // グループ全体をシーンに追加する。これで、スタンドがゲームの世界に表示されるようになる。
      game.scene.add(group);

      // 矢の当たり判定対象にする
      registerArrowCollisionObject(group);
    }

    /**
     * 役割: プレイヤー後方の階段状観客席を生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createBackStadiumStand({
      centerX,
      z,
      width,
      direction = -1,
      standMat,
      seatMat,
      aisleMat
    }) {
      // プレイヤーの後方に階段状の観客席を生成する。これで、プレイヤーの後ろに階段状の観客席ができ、競技場らしい雰囲気になる。
      const group = new THREE.Group();

      // 階段の段数と、段ごとの奥行き方向の分割数を設定する。これで、階段席の構造が決まり、段数や分割数を調整することで見た目を変えることができるようになる。
      const stepCount = 7;
      const depthStep = 1.3;
      const baseDepth = stepCount * depthStep + 1.2;

      // 土台を作成する。ジオメトリは、幅は指定の幅、奥行きは段数と分割数から計算して少し大きめにし、マテリアルは先ほど作成したスタンド用のマテリアルを使用する。これで、土台がスタンドの構造に合ったサイズと見た目になるようになる。
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(width, 0.6, baseDepth),
        standMat
      );

      // 土台の位置を設定する。これで、土台が正しい位置に配置され、スタンドの構造ができるようになる。
      base.position.set(
        centerX,
        0.3,
        z + direction * baseDepth / 2
      );

      // 土台をグループに追加する。これで、土台がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
      group.add(base);

      // フィールドに近い側が低く、奥へ行くほど高い
      for (let i = 0; i < stepCount; i++) {
        const h = 0.35;
        const y = 0.65 + i * 0.45;

        // 座席メッシュを作成する。ジオメトリは、幅は指定の幅から少し小さめにして、奥行きは分割の奥行きから少し小さめにして、マテリアルは先ほど作成した座席用のマテリアルを使用する。これで、座席がスタンドの構造に合ったサイズと見た目になるようになる。
        const seat = new THREE.Mesh(
          new THREE.BoxGeometry(width * 0.94, h, depthStep * 0.9),
          seatMat
        );

        // 座席の位置を設定する。これで、座席が正しい位置に配置され、階段席の構造ができるようになる。
        seat.position.set(
          centerX,
          y,
          z + direction * i * depthStep
        );

        // 座席をグループに追加する。これで、座席がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
        group.add(seat);

        // 後ろの観客席にも、横方向へ複数人を並べる
        const spectatorColumns = 12;
        const usableWidth = width * 0.82;

        // 横方向に複数人を並べる。これで、観客席に複数の観客が配置され、スタンドの雰囲気がよりリアルになる。
        for (let col = 0; col < spectatorColumns; col++) {
          // 横方向の位置を、座席の幅の範囲内で均等に配置する。これで、観客が座席の幅に沿って自然な感じで並ぶようになる。
          const t = spectatorColumns === 1
            ? 0.5
            : col / (spectatorColumns - 1);
          // 観客の座る位置を計算する。これで、観客が座席の幅に沿って正しい位置に配置され、スタンドの雰囲気がよりリアルになる。
          const spectatorSeatPos = new THREE.Vector3(
            centerX - usableWidth / 2 + usableWidth * t,
            seat.position.y,
            seat.position.z
          );

          // その位置に観客を置く
          maybeAddSpectatorOnSeat(group, spectatorSeatPos, {
            direction
          });
        }
      }

      // 一番奥の背面壁
      const backWall = new THREE.Mesh(
        new THREE.BoxGeometry(width, 4.5, 0.7),
        standMat
      );

      // 背面壁の位置を設定する。これで、背面壁が正しい位置に配置され、スタンドの構造ができるようになる。
      backWall.position.set(
        centerX,
        2.3,
        z + direction * (stepCount * depthStep + 0.55)
      );

      // 背面壁をグループに追加する。これで、背面壁がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
      group.add(backWall);

      // フィールド側の低い境界
      const frontRail = new THREE.Mesh(
        new THREE.BoxGeometry(width * 0.92, 0.55, 0.35),
        aisleMat
      );

      // フィールド側の低い境界の位置を設定する。これで、フィールド側の低い境界が正しい位置に配置され、スタンドの構造ができるようになる。
      frontRail.position.set(
        centerX,
        0.35,
        z - direction * 0.65
      );

      // フィールド側の低い境界をグループに追加する。これで、フィールド側の低い境界がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
      group.add(frontRail);
      // グループ全体をシーンに追加する。これで、スタンドがゲームの世界に表示されるようになる。
      game.scene.add(group);
    }

    /**
     * 役割: 的後方に、矢が抜けないためのフラット壁を配置する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createFlatTargetBackWall({
      centerX,
      z,
      width,
      standMat,
      aisleMat
    }) {
      // 的の後方に、矢が抜けないためのフラット壁を配置する。これで、的の後ろに壁ができ、矢が抜けないようになり、ゲームのルールが成立する。
      const group = new THREE.Group();

      // 矢が飛ぶ方向の奥に、観客席ではなく壁だけを置く
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(width, 5.2, 0.75),
        standMat
      );

      // 壁の位置を設定する。これで、壁が正しい位置に配置され、的の後ろに壁ができるようになる。
      wall.position.set(
        centerX,
        2.6,
        z
      );

      // 壁をグループに追加する。これで、壁がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。
      group.add(wall);

      // 壁の下に低い縁を置いて、スタジアム感を少し出す
      const lowerRail = new THREE.Mesh(
        new THREE.BoxGeometry(width * 0.95, 0.55, 0.45),
        aisleMat
      );

      // 低い縁の位置を設定する。これで、低い縁が正しい位置に配置され、スタジアム感が少し出るようになる。
      lowerRail.position.set(
        centerX,
        0.35,
        z + 0.65
      );

      // 低い縁をグループに追加する。これで、低い縁がスタンドの一部としてまとめられ、スタンド全体を管理しやすくなる。 
      group.add(lowerRail);

      // グループ全体をシーンに追加する。これで、壁がゲームの世界に表示されるようになる。
      game.scene.add(group);

      // 矢の当たり判定対象にする
      registerArrowCollisionObject(group);
    }

    /**
     * 役割: 観客の上半身をリング形状から滑らかなメッシュとして生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createSmoothUpperBodyGeometry() {
      // リング形状の頂点数。多いほど滑らかになるが、重くなる。これで、リング形状の細かさを調整でき、見た目とパフォーマンスのバランスを取ることができるようになる。
      const radialSegments = 24;

      // y: 高さ
      // rx: 横幅方向の半径
      // rz: 奥行き方向の半径
      // z: 前後位置。少し前傾・胸の厚みを出す
      const rings = [
        { y: 0.150, rx: 0.075, rz: 0.052, z: 0.000 }, // 腰下
        { y: 0.190, rx: 0.088, rz: 0.058, z: 0.003 }, // 腰
        { y: 0.250, rx: 0.096, rz: 0.064, z: 0.006 }, // 腹
        { y: 0.315, rx: 0.108, rz: 0.072, z: 0.010 }, // 胸
        { y: 0.370, rx: 0.120, rz: 0.076, z: 0.010 }, // 上胸
        { y: 0.410, rx: 0.145, rz: 0.070, z: 0.006 }, // 肩幅
        { y: 0.445, rx: 0.100, rz: 0.055, z: 0.000 }  // 首元へ絞る
      ];

      // 頂点と面のインデックスを格納する配列。これで、ジオメトリの構造を定義するための頂点と面の情報を管理できるようになる。
      const positions = [];
      const indices = [];

      // リング頂点を作る
      for (let i = 0; i < rings.length; i++) {
        const ring = rings[i];

        // リングの周囲に頂点を配置する。これで、リング形状の頂点が作られ、後で面を作るための基礎となるようになる。
        for (let j = 0; j < radialSegments; j++) {
          const a = (j / radialSegments) * Math.PI * 2;

          // 少しだけ人体っぽく、正面側を厚め・背中側を控えめにする
          const sin = Math.sin(a);
          const cos = Math.cos(a);

          // 正面側（sin > 0）では、奥行き方向の半径を少し大きくして、背面側（sin < 0）では少し小さくする。これで、人体っぽい形状になり、見た目が良くなるようになる。
          const frontBackBias = sin > 0 ? 1.10 : 0.88;

          // リングの周囲に頂点を配置する。xは横幅方向、yは高さ、zは前後位置。これで、リング形状の頂点が作られ、後で面を作るための基礎となるようになる。
          const x = Math.cos(a) * ring.rx;
          const y = ring.y;
          const z = ring.z + Math.sin(a) * ring.rz * frontBackBias;

          // 頂点の位置を配列に追加する。これで、ジオメトリの構造を定義するための頂点の情報が管理できるようになる。
          positions.push(x, y, z);
        }
      }

      // 側面の面を作る
      for (let i = 0; i < rings.length - 1; i++) {
        // リングの周囲に頂点が radialSegments 個あるので、リングごとに radialSegments 個の頂点がある。これで、リングごとの頂点数を理解し、面を作るためのインデックスを正しく計算できるようになる。
        for (let j = 0; j < radialSegments; j++) {
          // 4つの頂点 a, b, c, d を使って、2つの三角形 (a, c, b) と (b, c, d) を作る。これで、リング同士をつなぐ面ができ、ジオメトリの構造が完成するようになる。
          const a = i * radialSegments + j;
          const b = i * radialSegments + ((j + 1) % radialSegments);
          const c = (i + 1) * radialSegments + j;
          const d = (i + 1) * radialSegments + ((j + 1) % radialSegments);
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      // 下側を閉じる
      const bottomCenterIndex = positions.length / 3;
      // 一番下のリングの位置を中心にして、底面の中心点を追加する。これで、底面の中心点ができ、下側を閉じるための面を作ることができるようになる。
      positions.push(0, rings[0].y, rings[0].z);

      // 一番下のリングの周囲の頂点と、底面の中心点を使って、底面を三角形で埋める。これで、下側が閉じるようになり、ジオメトリの構造が完成するようになる。
      for (let j = 0; j < radialSegments; j++) {
        const a = j;
        const b = (j + 1) % radialSegments;
        indices.push(bottomCenterIndex, b, a);
      }

      // 上側を閉じる
      const topCenterIndex = positions.length / 3;
      // 一番上のリングの位置を中心にして、頂点を追加する。これで、頂点ができ、上側を閉じるための面を作ることができるようになる。
      const topRingStart = (rings.length - 1) * radialSegments;
      const topRing = rings[rings.length - 1];
      positions.push(0, topRing.y, topRing.z);

      // 一番上のリングの周囲の頂点と、頂点を使って、上面を三角形で埋める。これで、上側が閉じるようになり、ジオメトリの構造が完成するようになる。
      for (let j = 0; j < radialSegments; j++) {
        const a = topRingStart + j;
        const b = topRingStart + ((j + 1) % radialSegments);
        indices.push(topCenterIndex, a, b);
      }

      // ジオメトリを作成する。頂点の位置と面のインデックスを設定し、法線を計算する。これで、ジオメトリが完成し、滑らかな上半身の形状ができるようになる。
      const geometry = new THREE.BufferGeometry();

      // 頂点の位置をジオメトリに設定する。これで、ジオメトリの頂点の位置が定義され、形状ができるようになる。
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );

      // 面のインデックスをジオメトリに設定する。これで、ジオメトリの面の構造が定義され、形状ができるようになる。
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    /**
     * 役割: 観客の肘から手先までの肌メッシュを生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createSmoothForearmHandGeometry(side, poseType = "normal") {
      const radialSegments = 14;

      // 肘を原点にしたローカル座標
      const rings = poseType === "camera"
        ? [
            // 肘。ここが elbowRoot とつながる
            { x: 0.000,          y: 0.000, z: 0.000, rx: 0.026, rz: 0.023 },

            // 前腕：顔方向へ上げる
            { x: -side * 0.012,  y: 0.060, z: 0.050, rx: 0.024, rz: 0.022 },

            // 前腕先：さらに内側・前方へ
            { x: -side * 0.028,  y: 0.120, z: 0.105, rx: 0.022, rz: 0.020 },

            // 手首：カメラの横へ寄せる
            { x: -side * 0.046,  y: 0.170, z: 0.158, rx: 0.020, rz: 0.018 },

            // 手のひら：カメラ本体の左右に触れる位置
            { x: -side * 0.062,  y: 0.205, z: 0.185, rx: 0.034, rz: 0.024 },

            // 指先側：少しだけ前に回り込む
            { x: -side * 0.066,  y: 0.218, z: 0.205, rx: 0.026, rz: 0.018 }
          ]
        : [
            { x: 0.000,        y: 0.000,  z: 0.000, rx: 0.024, rz: 0.022 },
            { x: side * 0.003, y: -0.046, z: 0.020, rx: 0.023, rz: 0.021 },
            { x: side * 0.006, y: -0.091, z: 0.048, rx: 0.020, rz: 0.019 },
            { x: side * 0.008, y: -0.125, z: 0.082, rx: 0.031, rz: 0.022 },
            { x: side * 0.010, y: -0.142, z: 0.104, rx: 0.025, rz: 0.017 }
          ];

      // 頂点と面のインデックスを格納する配列。これで、ジオメトリの構造を定義するための頂点と面の情報を管理できるようになる。
      const positions = [];
      const indices = [];

      // リング頂点を作る
      for (let i = 0; i < rings.length; i++) {
        const ring = rings[i];

        // リングの周囲に頂点を配置する。これで、リング形状の頂点が作られ、後で面を作るための基礎となるようになる。
        for (let j = 0; j < radialSegments; j++) {
          // リングの周囲に頂点を配置する。xは横幅方向、yは高さ、zは前後位置。これで、リング形状の頂点が作られ、後で面を作るための基礎となるようになる。
          const a = (j / radialSegments) * Math.PI * 2;
          const x = ring.x + Math.cos(a) * ring.rx;
          const y = ring.y;
          const z = ring.z + Math.sin(a) * ring.rz;
          positions.push(x, y, z);
        }
      }

      // 側面の面を作る
      for (let i = 0; i < rings.length - 1; i++) {
        // リングの周囲に頂点が radialSegments 個あるので、リングごとに radialSegments 個の頂点がある。これで、リングごとの頂点数を理解し、面を作るためのインデックスを正しく計算できるようになる。
        for (let j = 0; j < radialSegments; j++) {
          // 4つの頂点 a, b, c, d を使って、2つの三角形 (a, c, b) と (b, c, d) を作る。これで、リング同士をつなぐ面ができ、ジオメトリの構造が完成するようになる。
          const a = i * radialSegments + j;
          const b = i * radialSegments + ((j + 1) % radialSegments);
          const c = (i + 1) * radialSegments + j;
          const d = (i + 1) * radialSegments + ((j + 1) % radialSegments);
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      // 始端を閉じる
      const startCenter = positions.length / 3;
      // 一番下のリングの位置を中心にして、底面の中心点を追加する。これで、底面の中心点ができ、下側を閉じるための面を作ることができるようになる。
      positions.push(rings[0].x, rings[0].y, rings[0].z);

      // 一番下のリングの周囲の頂点と、底面の中心点を使って、底面を三角形で埋める。これで、下側が閉じるようになり、ジオメトリの構造が完成するようになる。
      for (let j = 0; j < radialSegments; j++) {
        const a = j;
        const b = (j + 1) % radialSegments;
        indices.push(startCenter, b, a);
      }

      // 終端を閉じる
      const endCenter = positions.length / 3;
      // 一番上のリングの位置を中心にして、頂点を追加する。これで、頂点ができ、上側を閉じるための面を作ることができるようになる。
      const lastRingStart = (rings.length - 1) * radialSegments;
      const last = rings[rings.length - 1];
      positions.push(last.x, last.y, last.z);

      // 一番上のリングの周囲の頂点と、頂点を使って、上面を三角形で埋める。これで、上側が閉じるようになり、ジオメトリの構造が完成するようになる。
      for (let j = 0; j < radialSegments; j++) {
        const a = lastRingStart + j;
        const b = lastRingStart + ((j + 1) % radialSegments);
        indices.push(endCenter, a, b);
      }

      // ジオメトリを作成する。頂点の位置と面のインデックスを設定し、法線を計算する。これで、ジオメトリが完成し、滑らかな前腕・手の形状ができるようになる。
      const geometry = new THREE.BufferGeometry();

      // 頂点の位置をジオメトリに設定する。これで、ジオメトリの頂点の位置が定義され、形状ができるようになる。
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );

      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    /**
     * 役割: 観客が持つ小型カメラの本体、レンズ、上部パーツを作る。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createSpectatorCameraProp() {
      // カメラの本体、レンズ、上部パーツを作る。これで、観客が持つ小型カメラの見た目ができ、ゲームの雰囲気がよりリアルになる。
      const group = new THREE.Group();

      // カメラのマテリアルを作る。色は暗めのグレーで、少しだけ金属感を出す。これで、カメラの見た目がリアルになり、ゲームの雰囲気がより良くなるようになる。
      const cameraMat = new THREE.MeshStandardMaterial({
        color: 0x111827,
        roughness: 0.75,
        metalness: 0.05
      });

      // レンズのマテリアルを作る。色はさらに暗いグレーで、金属感を少し強めにする。これで、レンズの見た目がカメラの本体と区別され、リアルになり、ゲームの雰囲気がより良くなるようになる。
      const lensMat = new THREE.MeshStandardMaterial({
        color: 0x020617,
        roughness: 0.45,
        metalness: 0.25
      });

      // カメラ本体
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.115, 0.060, 0.042),
        cameraMat
      );

      // カメラ本体の位置を設定する。これで、カメラの本体が正しい位置に配置され、カメラの見た目がリアルになるようになる。
      group.add(body);

      // レンズ
      const lens = new THREE.Mesh(
        new THREE.CylinderGeometry(0.018, 0.022, 0.028, 14),
        lensMat
      );

      // レンズの位置と向きを設定する。これで、レンズがカメラの本体の前面に正しい位置と向きで配置され、カメラの見た目がリアルになるようになる。
      lens.rotation.x = Math.PI / 2;
      lens.position.z = 0.036;
      group.add(lens);

      // 上部のでっぱり
      const top = new THREE.Mesh(
        new THREE.BoxGeometry(0.040, 0.018, 0.026),
        cameraMat
      );

      // 上部のでっぱりの位置を設定する。これで、上部のでっぱりがカメラの本体の上に正しい位置に配置され、カメラの見た目がリアルになるようになる。
      top.position.set(0, 0.034, 0);
      group.add(top);

      return group;
    }

    /**
     * 役割: カメラ持ち観客用に、肘からカメラまで伸びる接続腕メッシュを作る。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createCameraArmConnector(radius, material) {
      // 肘からカメラまで伸びる接続腕メッシュを作る。これで、肘とカメラが接続され、カメラ持ち観客の見た目がリアルになるようになる。
      const group = new THREE.Group();
      const geometry = new THREE.CapsuleGeometry(radius, 1.0, 6, 12);
      const mesh = new THREE.Mesh(geometry, material);

      // geometryの長さは、肘とカメラの距離に合わせて毎フレーム更新するので、初期値は1.0にしておく。これで、接続腕の長さが動的に変わることを考慮した初期設定になり、見た目が自然になるようになる。
      group.add(mesh);
      group.userData.mesh = mesh;

      return group;
    }

    /**
     * 役割: 接続腕を、肘とカメラ側面の2点を結ぶ位置・角度・長さへ更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateCameraArmConnector(connector, parent, startWorld, endWorld) {
      // 接続腕を、肘とカメラ側面の2点を結ぶ位置・角度・長さへ更新する。これで、接続腕が肘とカメラを正しくつなぐようになり、カメラ持ち観客の見た目がリアルになるようになる。
      if (!connector || !parent) return;

      // ワールド座標の startWorld と endWorld を、接続腕の親オブジェクトのローカル座標に変換する。これで、接続腕を配置するための正しい位置情報が得られ、見た目が自然になるようになる。
      const start = parent.worldToLocal(startWorld.clone());
      const end = parent.worldToLocal(endWorld.clone());

      // start と end の中点を計算する。これで、接続腕の中心位置がわかり、正しい位置に配置できるようになる。
      const mid = new THREE.Vector3()
        .copy(start)
        .add(end)
        .multiplyScalar(0.5);

      // start と end を結ぶベクトルを計算する。これで、接続腕の向きを決めるための情報が得られ、正しい角度に回転できるようになる。
      const dir = new THREE.Vector3()
        .copy(end)
        .sub(start);

      // dir の長さを計算する。これで、接続腕の長さを決めるための情報が得られ、正しい長さにスケーリングできるようになる。
      const len = dir.length();
      if (len <= 0.001) return;

      // 接続腕の位置を、start と end の中点に設定する。これで、接続腕が肘とカメラの間に配置され、見た目が自然になるようになる。
      connector.position.copy(mid);

      // CapsuleGeometry はY軸方向に伸びるので、Y軸を接続方向へ向ける
      connector.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        dir.clone().normalize()
      );

      // geometryの長さを都度作り直す
      const mesh = connector.userData.mesh;
      mesh.geometry.dispose();
      mesh.geometry = new THREE.CapsuleGeometry(
        0.021,
        Math.max(0.001, len - 0.042),
        6,
        12
      );
    }

    /**
     * 役割: カメラ持ち観客のカメラを、現在の顔前位置へ配置する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function syncSpectatorCameraToHands(spectator, parts) {
      // カメラ持ち観客のカメラを、現在の顔前位置へ配置する。これで、カメラが常に顔の前に配置され、カメラ持ち観客の見た目がリアルになるようになる。
      if (!parts.camera || !parts.head) return;

      // カメラの位置を、頭部のローカル座標で「顔の前・少し下」に設定する。これで、カメラが顔の前に自然な位置に配置され、見た目が良くなるようになる。
      const cameraWorld = new THREE.Vector3();
      const cameraLocal = new THREE.Vector3();

      // spectator のワールド行列を最新にする。これで、正しい位置にカメラが配置されるようになる。
      spectator.updateMatrixWorld(true);

      // 頭のローカル座標で「顔の前・少し下」に置く
      // x: 左右
      // y: 高さ。マイナスにすると下がる
      // z: 顔の前方向
      cameraWorld.set(0, -0.070, 0.155);
      parts.head.localToWorld(cameraWorld);

      // cameraWorld を spectator のローカル座標に変換する。これで、cameraWorld の位置情報が spectator のローカル座標系で得られ、正しい位置にカメラを配置できるようになる。
      spectator.worldToLocal(cameraLocal.copy(cameraWorld));

      // カメラの位置を更新する。これで、カメラが顔の前に配置され、カメラ持ち観客の見た目がリアルになるようになる。
      parts.camera.position.copy(cameraLocal);

      // ほんの少しだけ前に出す
      parts.camera.position.z += 0.006;
    }

    /**
     * 役割: 左右の肘からカメラ側面までの接続腕を毎フレーム張り直す。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateSpectatorCameraArmConnections(spectator, parts) {
      // 左右の肘からカメラ側面までの接続腕を毎フレーム張り直す。これで、観客が動いても肘とカメラが常に接続され、カメラ持ち観客の見た目がリアルになるようになる。
      if (
        !parts.camera ||
        !parts.leftForeArm ||
        !parts.rightForeArm ||
        !parts.leftCameraArm ||
        !parts.rightCameraArm
      ) {
        return;
      }

      // spectator のワールド行列を最新にする。これで、正しい位置に接続腕が配置されるようになる。
      spectator.updateMatrixWorld(true);

      // 肘とカメラ側面のワールド座標を格納するベクトル。これで、肘とカメラ側面の位置情報が得られ、接続腕を正しく配置できるようになる。
      const leftElbowWorld = new THREE.Vector3();
      const rightElbowWorld = new THREE.Vector3();

      // カメラ本体の左右側面の位置。カメラのローカル座標で、左右に少しずつ離れた位置を指定する。これで、カメラ側面の位置がわかり、接続腕を正しく配置できるようになる。
      const leftCameraGripWorld = new THREE.Vector3();
      const rightCameraGripWorld = new THREE.Vector3();

      // 肘の位置
      parts.leftForeArm.getWorldPosition(leftElbowWorld);
      parts.rightForeArm.getWorldPosition(rightElbowWorld);

      // カメラ本体の左右。今のカメラ位置はそのままで、左右側面に接続する
      leftCameraGripWorld.set(-0.060, -0.004, 0.004);
      rightCameraGripWorld.set(0.060, -0.004, 0.004);

      // カメラのローカル座標で指定した左右側面の位置を、ワールド座標に変換する。これで、カメラ側面のワールド座標が得られ、接続腕を正しく配置できるようになる。
      parts.camera.localToWorld(leftCameraGripWorld);
      parts.camera.localToWorld(rightCameraGripWorld);

      // 左肘とカメラ側面のワールド座標を結ぶように、接続腕の位置・角度・長さを更新する。これで、接続腕が肘とカメラを正しくつなぐようになり、カメラ持ち観客の見た目がリアルになるようになる。
      updateCameraArmConnector(
        parts.leftCameraArm,
        spectator,
        leftElbowWorld,
        leftCameraGripWorld
      );

      // 右肘とカメラ側面のワールド座標を結ぶように、接続腕の位置・角度・長さを更新する。これで、接続腕が肘とカメラを正しくつなぐようになり、カメラ持ち観客の見た目がリアルになるようになる。
      updateCameraArmConnector(
        parts.rightCameraArm,
        spectator,
        rightElbowWorld,
        rightCameraGripWorld
      );
    }

    /**
     * 役割: 観客1人分の頭、胴体、腕、脚、カメラ持ちポーズ、アニメーション情報を生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createSpectatorModel() {
      // 観客1人分の頭、胴体、腕、脚、カメラ持ちポーズ、アニメーション情報を生成する。これで、観客の見た目と動きの基礎ができ、ゲームの雰囲気がよりリアルになるようになる。
      const spectator = new THREE.Group();

      // 肌の色の候補。明るめの色から暗めの色まで、バリエーションを持たせている。これで、観客の見た目にバリエーションができ、ゲームの雰囲気がより楽しくなるようになる。
      const skinColors = [
        0xffd2a6, 0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524
      ];

      // シャツの色の候補。明るめの色を中心に、バリエーションを持たせている。これで、観客の見た目にバリエーションができ、ゲームの雰囲気がより楽しくなるようになる。
      const shirtColors = [
        0xd94848, 0x2563eb, 0x16a34a, 0xfacc15,
        0x7c3aed, 0xf8fafc, 0xf97316, 0x0f766e,
        0x1e293b, 0xbe123c
      ];

      // ズボンの色の候補。暗めの色を中心に、バリエーションを持たせている。これで、観客の見た目にバリエーションができ、ゲームの雰囲気がより楽しくなるようになる。
      const pantsColors = [
        0x111827, 0x1f2937, 0x334155, 0x475569, 0x293241
      ];

      // 髪の色の候補。暗めの色を中心に、バリエーションを持たせている。これで、観客の見た目にバリエーションができ、ゲームの雰囲気がより楽しくなるようになる。
      const hairColors = [
        0x111111, 0x1f130f, 0x2b1b14, 0x3b2f2f, 0x6b4f3a, 0x8b6f47
      ];

      // マテリアルを作る。肌、シャツ、ズボン、髪、目、口のマテリアルをそれぞれ作成する。これで、観客の各部位の見た目が定義され、ゲームの雰囲気がよりリアルになるようになる。
      const skinMat = new THREE.MeshStandardMaterial({
        color: skinColors[Math.floor(Math.random() * skinColors.length)],
        roughness: 0.92
      });

      // シャツのマテリアルを作る。色は shirtColors からランダムに選ぶ。これで、観客のシャツの見た目にバリエーションができ、ゲームの雰囲気がより楽しくなるようになる。
      const shirtMat = new THREE.MeshStandardMaterial({
        color: shirtColors[Math.floor(Math.random() * shirtColors.length)],
        roughness: 0.88
      });
