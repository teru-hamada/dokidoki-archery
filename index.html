      // ズボンのマテリアルを作る。色は pantsColors からランダムに選ぶ。これで、観客のズボンの見た目にバリエーションができ、ゲームの雰囲気がより楽しくなるようになる。
      const pantsMat = new THREE.MeshStandardMaterial({
        color: pantsColors[Math.floor(Math.random() * pantsColors.length)],
        roughness: 0.95
      });

      // 髪のマテリアルを作る。色は hairColors からランダムに選ぶ。これで、観客の髪の見た目にバリエーションができ、ゲームの雰囲気がより楽しくなるようになる。
      const hairMat = new THREE.MeshStandardMaterial({
        color: hairColors[Math.floor(Math.random() * hairColors.length)],
        roughness: 0.96
      });

      // 目のマテリアルを作る。色は暗めのグレーで、少しだけ金属感を出す。これで、目の見た目がリアルになり、ゲームの雰囲気がより良くなるようになる。
      const eyeMat = new THREE.MeshStandardMaterial({
        color: 0x050505,
        roughness: 0.7
      });

      // 口のマテリアルを作る。色は暗めの赤で、少しだけ金属感を出す。これで、口の見た目がリアルになり、ゲームの雰囲気がより良くなるようになる。
      const mouthMat = new THREE.MeshStandardMaterial({
        color: 0x7f1d1d,
        roughness: 0.9
      });

      // アニメーションさせる部位を保持
      const parts = {
        head: null,
        body: null,
        leftUpperArm: null,
        rightUpperArm: null,
        leftForeArm: null,
        rightForeArm: null,
        leftHand: null,
        rightHand: null,
        leftCameraArm: null,
        rightCameraArm: null,
        camera: null
      };

      // ----------------------------
      // 上半身：腰〜胸〜肩までを1つの滑らかなメッシュで作る
      // ----------------------------
      const body = new THREE.Mesh(
        createSmoothUpperBodyGeometry(),
        shirtMat
      );

      // 少し前傾させて、座っている姿勢にする
      body.rotation.x = THREE.MathUtils.degToRad(5);

      // body の位置を設定する。これで、上半身が正しい位置に配置され、見た目が自然になるようになる。
      spectator.add(body);
      parts.body = body;

      // 首
      const neck = new THREE.Mesh(
        new THREE.CylinderGeometry(0.032, 0.038, 0.058, 12),
        skinMat
      );
      // 首の位置を設定する。これで、首が上半身の上に正しい位置に配置され、見た目が自然になるようになる。
      neck.position.y = 0.475;
      spectator.add(neck);

      // ----------------------------
      // 頭部グループ
      // ----------------------------
      const headGroup = new THREE.Group();
      // 頭部グループの位置を設定する。これで、頭部が首の上に正しい位置に配置され、見た目が自然になるようになる。
      headGroup.position.y = 0.56;
      spectator.add(headGroup);
      parts.head = headGroup;

      // 頭
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.086, 18, 12),
        skinMat
      );
      head.scale.set(0.92, 1.06, 0.9);
      headGroup.add(head);

      // 髪
      const hair = new THREE.Mesh(
        new THREE.SphereGeometry(
          0.09,
          18,
          10,
          0,
          Math.PI * 2,
          0,
          Math.PI * 0.62
        ),
        hairMat
      );
      hair.position.y = 0.038;
      hair.scale.set(1.03, 0.74, 1.02);
      headGroup.add(hair);

      // 前髪
      const bang = new THREE.Mesh(
        new THREE.BoxGeometry(0.10, 0.026, 0.022),
        hairMat
      );
      bang.position.set(0, 0.035, 0.073);
      bang.rotation.x = THREE.MathUtils.degToRad(-10);
      headGroup.add(bang);

      // 耳
      function addEar(side) {
        const ear = new THREE.Mesh(
          new THREE.SphereGeometry(0.018, 8, 6),
          skinMat
        );
        ear.position.set(side * 0.082, -0.005, 0.005);
        ear.scale.set(0.55, 0.85, 0.35);
        headGroup.add(ear);
      }

      // 左右の耳を追加する。これで、耳が頭部の両側に正しい位置に配置され、見た目が自然になるようになる。
      addEar(-1);
      addEar(1);

      // 目
      function addEye(side) {
        const eye = new THREE.Mesh(
          new THREE.SphereGeometry(0.0085, 8, 6),
          eyeMat
        );
        eye.position.set(side * 0.027, 0.005, 0.078);
        eye.scale.set(1.0, 0.72, 0.45);
        headGroup.add(eye);
      }

      // 左右の目を追加する。これで、目が頭部の前面に正しい位置に配置され、見た目が自然になるようになる。
      addEye(-1);
      addEye(1);

      // 鼻
      const nose = new THREE.Mesh(
        new THREE.ConeGeometry(0.009, 0.03, 7),
        skinMat
      );
      nose.position.set(0, -0.01, 0.087);
      nose.rotation.x = Math.PI / 2;
      headGroup.add(nose);

      // 口
      const mouth = new THREE.Mesh(
        new THREE.BoxGeometry(0.034, 0.0045, 0.004),
        mouthMat
      );
      mouth.position.set(0, -0.035, 0.079); 
      headGroup.add(mouth);

      // カメラを持つ手の観客は少なめにして、個体差をつける
      const spectatorPose = Math.random() < 0.18
        ? "camera"
        : "normal";

      // 腕と手
      function addArm(side) {
        const isCameraPose = spectatorPose === "camera";

        // 肩支点
        const upperArmRoot = new THREE.Group();
        upperArmRoot.position.set(
          side * (isCameraPose ? 0.118 : 0.128),
          isCameraPose ? 0.405 : 0.392,
          isCameraPose ? 0.020 : 0.012
        );

        // 肩の向きは、カメラ持ちの人はより前を向くように、そうでない人は少し横を向くようにする。これで、肩の向きが観客のポーズに合わせて自然になり、見た目が良くなるようになる。
        upperArmRoot.rotation.z =
          side * THREE.MathUtils.degToRad(isCameraPose ? 42 : 23);
        upperArmRoot.rotation.x =
          THREE.MathUtils.degToRad(isCameraPose ? 34 : 10);

        // 肩支点を spectator に追加する。これで、肩が上半身の一部として配置され、見た目が自然になるようになる。
        spectator.add(upperArmRoot);

        // 上腕
        const upperArmRadius = 0.028;
        const upperArmLength = isCameraPose ? 0.145 : 0.16;

        // 上腕のジオメトリを作る。CapsuleGeometry を使って、肩から肘までの滑らかな形状を作る。これで、上腕の見た目がリアルになり、ゲームの雰囲気がより良くなるようになる。
        const upperArm = new THREE.Mesh(
          new THREE.CapsuleGeometry(
            upperArmRadius,
            upperArmLength,
            6,
            14
          ),
          shirtMat
        );

        // 肩から下へ伸ばす
        const upperArmCenterY = isCameraPose ? -0.075 : -0.082;
        upperArm.position.set(0, upperArmCenterY, 0.010);
        upperArmRoot.add(upperArm);

        // 肘支点
        const elbowRoot = new THREE.Group();
        elbowRoot.position.set(
          0,
          upperArmCenterY - (upperArmLength * 0.5 + upperArmRadius) + 0.006,
          0.014
        );
        elbowRoot.userData.basePosition = elbowRoot.position.clone();
        upperArmRoot.add(elbowRoot);

        // 前腕〜手（肌）
        const forearmHand = new THREE.Mesh(
          createSmoothForearmHandGeometry(side, spectatorPose),
          skinMat
        );
        elbowRoot.add(forearmHand);

        // カメラ持ちの場合は、後でカメラ位置に合わせた接続腕を作るため、
        // 固定形状の前腕は非表示にする
        if (isCameraPose) {
          forearmHand.visible = false;
        }

        // カメラ持ち用のグリップ点
        if (isCameraPose) {
          const grip = new THREE.Group();

          // 手先の接触位置
          grip.position.set(
            -side * 0.064,
            0.210,
            0.195
          );

          // グリップの向きは、カメラを構えるように少し内側を向くようにする。これで、グリップの向きがカメラ持ちポーズに合わせて自然になり、見た目が良くなるようになる。
          elbowRoot.add(grip);

          // グリップを parts に保存する。これで、後でグリップの位置を参照してカメラを配置できるようになり、カメラ持ち観客の見た目がリアルになるようになる。
          if (side < 0) {
            parts.leftGrip = grip;
          } else {
            parts.rightGrip = grip;
          }
        }

        // 腕のパーツを parts に保存する。これで、後で腕の各部位を参照してアニメーションさせることができるようになり、観客の動きがリアルになるようになる。
        if (side < 0) {
          parts.leftUpperArm = upperArmRoot;
          parts.leftForeArm = elbowRoot;
          parts.leftHand = forearmHand;
        } else {
          parts.rightUpperArm = upperArmRoot;
          parts.rightForeArm = elbowRoot;
          parts.rightHand = forearmHand;
        }
      }

      // 左右の腕と手を追加する。これで、腕と手が上半身の両側に正しい位置に配置され、見た目が自然になるようになる。
      addArm(-1);
      addArm(1);

      // カメラを持つ観客の場合は、カメラ本体と接続腕を追加する。これで、カメラを持つ観客の見た目が完成し、ゲームの雰囲気がよりリアルになるようになる。
      if (spectatorPose === "camera") {
        // カメラのパーツを作る。これで、カメラの見た目ができ、ゲームの雰囲気がよりリアルになるようになる。
        const cameraProp = createSpectatorCameraProp();
        spectator.add(cameraProp);
        parts.camera = cameraProp;

        // カメラを構えている人は少し前のめり
        body.rotation.x = THREE.MathUtils.degToRad(8);

        // 頭も少し前を向くようにする。これで、頭の向きがカメラ持ちポーズに合わせて自然になり、見た目が良くなるようになる。
        if (parts.head) {
          parts.head.rotation.x = THREE.MathUtils.degToRad(-3);
        }

        // 今のカメラ位置のまま、顔の前へ配置
        syncSpectatorCameraToHands(spectator, parts);

        // カメラの向きを、少しだけ前を向くようにする。これで、カメラの向きがカメラ持ちポーズに合わせて自然になり、見た目が良くなるようになる。
        cameraProp.rotation.x = THREE.MathUtils.degToRad(-4);
        cameraProp.rotation.y = 0;
        cameraProp.rotation.z = 0;

        // 肘からカメラまでをつなぐ腕を追加
        parts.leftCameraArm = createCameraArmConnector(0.021, skinMat);
        parts.rightCameraArm = createCameraArmConnector(0.021, skinMat);

        // 接続腕を spectator に追加する。これで、接続腕がカメラと肘をつなぐように配置され、カメラ持ち観客の見た目がリアルになるようになる。
        spectator.add(parts.leftCameraArm);
        spectator.add(parts.rightCameraArm);

        // 初期状態でも接続しておく
        updateSpectatorCameraArmConnections(spectator, parts);
      }

      // ----------------------------
      // 座っている脚
      // ----------------------------
      function addLeg(side) {
        // 脚のジオメトリを作る。これも CapsuleGeometry を使って、太ももから足首までの滑らかな形状を作る。これで、脚の見た目がリアルになり、ゲームの雰囲気がより良くなるようになる。
        const thigh = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.033, 0.19, 4, 9),
          pantsMat
        );
        thigh.position.set(side * 0.052, 0.12, 0.078);
        thigh.rotation.x = THREE.MathUtils.degToRad(78);
        spectator.add(thigh);

        // すねの位置を、太ももの先端から少し下にして、座っている脚の自然な位置にする。これで、すねが太ももから自然につなが
        const shin = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.028, 0.158, 4, 9),
          pantsMat
        );

        // 靴をなくすので、すねだけで足元が自然に見える位置へ調整
        shin.position.set(side * 0.052, 0.052, 0.172);
        shin.rotation.x = THREE.MathUtils.degToRad(22);
        spectator.add(shin);
      }

      // 左右の脚を追加する。これで、脚が上半身の両側に正しい位置に配置され、見た目が自然になるようになる。
      addLeg(-1);
      addLeg(1);

      // ----------------------------
      // サイズ
      // 前回の一回り小さい値を維持しつつ、少し個体差をつける
      // ----------------------------
      // 観客の基本スケールを設定する。前回の一回り小さい値を維持しつつ、少し個体差をつける。これで、観客のサイズが適切になり、ゲームの雰囲気がよりリアルになるようになる。
      const spectatorBaseScale = 2.85;
      // 0.92〜1.08倍の範囲でランダムにスケールを変える。これで、観客のサイズにバリエーションができ、ゲームの雰囲気がより楽しくなるようになる。
      const s = spectatorBaseScale * (0.92 + Math.random() * 0.16);

      // 観客全体のスケールを設定する。これで、観客のサイズが適切になり、ゲームの雰囲気がよりリアルになるようになる。
      spectator.scale.set(
        s * (0.94 + Math.random() * 0.12),
        s * (0.95 + Math.random() * 0.10),
        s * (0.94 + Math.random() * 0.12)
      );

      // 姿勢の個体差
      spectator.rotation.x = THREE.MathUtils.degToRad((Math.random() - 0.5) * 2.5);
      spectator.rotation.z = THREE.MathUtils.degToRad((Math.random() - 0.5) * 1.6);

      // アニメーション用データ
      spectator.userData.spectatorAnim = {
        parts,
        pose: spectatorPose,
        baseRotationX: spectator.rotation.x,
        baseRotationZ: spectator.rotation.z,
        phase: Math.random() * Math.PI * 2,
        speed: 0.75 + Math.random() * 0.55,
        bodySway: 0.010 + Math.random() * 0.010,
        headYaw: THREE.MathUtils.degToRad(2.0 + Math.random() * 3.0),
        headPitch: THREE.MathUtils.degToRad(1.0 + Math.random() * 2.0),
        armSwing: THREE.MathUtils.degToRad(2.0 + Math.random() * 3.0),

        // たまに拍手っぽく動く人
        clapLike: Math.random() < 0.18
      };

      // spectator を返す。これで、観客の3Dモデルが生成され、ゲームのシーンに追加できるようになる。
      return spectator;
    }

    /**
     * 役割: 座席ごとの確率に応じて観客を生成し、向きと位置を調整して配置する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function maybeAddSpectatorOnSeat(group, seatPosition, options = {}) {
      // 1.0 に近いほど満席。0.45〜0.65くらいが自然
      const occupancyRate = 0.58;

      // 座席ごとの確率に応じて観客を生成する。これで、スタンドの席にランダムに観客が配置され、ゲームの雰囲気がよりリアルになるようになる。
      if (Math.random() > occupancyRate) return;

      // 観客を生成する。これで、観客の3Dモデルが作られ、スタンドに配置できるようになる。
      const spectator = createSpectatorModel();

      // 向きと位置を調整して配置する。これで、観客が座席の位置に自然に配置され、見た目が良くなるようになる。
      const forwardOffset = options.side
        ? 0
        : -0.10 * (options.direction ?? 1);

      // 座席位置を基準に、少しランダムなオフセットを加えて配置する。これで、観客が座席の位置に完全に固定されず、自然なばらつきができて見た目が良くなるようになる。
      spectator.position.set(
        seatPosition.x + (Math.random() - 0.5) * 0.16,
        seatPosition.y + 0.28,
        seatPosition.z + forwardOffset + (Math.random() - 0.5) * 0.20
      );

      // 基本はフィールド側を向かせる
      if (options.side) {
        // 左右スタンド用：中央方向を向く
        // createSpectatorModel() の正面は +Z 方向なので、
        // 左スタンドは +X、右スタンドは -X を向かせる
        spectator.rotation.y = options.side < 0
          ? Math.PI / 2
          : -Math.PI / 2;
      } else if (typeof options.direction === "number") {
        // 後方スタンド用：フィールド方向を向く
        spectator.rotation.y = options.direction > 0
          ? Math.PI
          : 0;
      }

      // ちょっとだけ首振り感
      spectator.rotation.y += (Math.random() - 0.5) * 0.35;

      // 毎フレーム更新で使う基準向きを保存
      spectator.userData.baseRotationY = spectator.rotation.y;

      group.add(spectator);

      // 毎フレーム動かす対象として登録
      game.spectators.push(spectator);
    }

    /**
     * 役割: 観客の揺れ、首振り、腕、カメラ、接続腕のアニメーションを更新する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function updateSpectators(dt, elapsed) {
      // 観客の揺れ、首振り、腕、カメラ、接続腕のアニメーションを更新する。これで、観客が動いているように見え、ゲームの雰囲気がよりリアルになるようになる。
      if (!game.spectators?.length) return;

      // 各観客に対してアニメーションを更新する。これで、観客ごとに個別の動きができ、ゲームの雰囲気がよりリアルになるようになる。
      for (const spectator of game.spectators) {
        // spectator の userData からアニメーション情報を取得する。これで、観客ごとに異なるアニメーションのパラメータが得られ、動きにバリエーションができて見た目が良くなるようになる。
        const anim = spectator.userData.spectatorAnim;
        if (!anim) continue;

        // 経過時間に基づいてアニメーションの進行度を計算する。これで、時間の経過に応じて観客の動きが変化し、ゲームの雰囲気がよりリアルになるようになる。
        const t = elapsed * anim.speed + anim.phase;
        const parts = anim.parts;

        // 体全体の微妙な揺れ
        spectator.rotation.x =
          anim.baseRotationX +
          Math.sin(t * 1.1) * anim.bodySway;

        // 体全体の微妙な左右の傾き
        spectator.rotation.z =
          anim.baseRotationZ +
          Math.sin(t * 0.9 + 1.7) * anim.bodySway * 0.7;

        // 観客全体がほんの少し左右を見る
        spectator.rotation.y =
          spectator.userData.baseRotationY +
          Math.sin(t * 0.35) * THREE.MathUtils.degToRad(1.5);

        // 頭の動き
        if (parts.head) {
          parts.head.rotation.y =
            Math.sin(t * 0.55) * anim.headYaw;

          parts.head.rotation.x =
            Math.sin(t * 0.8 + 0.6) * anim.headPitch;
        }

        // 腕の動きは、カメラ持ちポーズの人、たまに拍手っぽく動く人、その他の人で分けて処理する。これで、腕の動きにバリエーションができ、観客の動きがよりリアルになるようになる。
        if (anim.pose === "camera") {
          // カメラ持ちポーズの人は、肘を上下に動かして、カメラを構える感じを出す。これで、カメラ持ち観客の動きがリアルになり、ゲームの雰囲気がより良くなるようになる。
          const cameraMove = Math.sin(t * 0.8) * 0.006;

          // 肘の位置を動かす。これで、肘が上下に動いてカメラを構える感じが出て、カメラ持ち観客の動きがリアルになるようになる。
          if (parts.leftForeArm) {
            const base = parts.leftForeArm.userData.basePosition;
            parts.leftForeArm.position.set(base.x, base.y + cameraMove, base.z);
          }

          // 肘の位置を動かす。これで、肘が上下に動いてカメラを構える感じが出て、カメラ持ち観客の動きがリアルになるようになる。
          if (parts.rightForeArm) {
            const base = parts.rightForeArm.userData.basePosition;
            parts.rightForeArm.position.set(base.x, base.y + cameraMove, base.z);
          }

          // カメラの位置と接続腕の向きを更新する。これで、カメラが肘の動きに合わせて自然に動き、接続腕も正しい向きになるようになり、カメラ持ち観客の見た目がリアルになるようになる。
          if (parts.camera) {
            syncSpectatorCameraToHands(spectator, parts);
            updateSpectatorCameraArmConnections(spectator, parts);

            // カメラの向きを、少しだけ動かす。これで、カメラの向きがカメラ持ちポーズに合わせて自然になり、見た目が良くなるようになる。
            parts.camera.rotation.x =
              THREE.MathUtils.degToRad(-4) +
              Math.sin(t * 0.45) * THREE.MathUtils.degToRad(1.0);
            parts.camera.rotation.y =
              Math.sin(t * 0.45) * THREE.MathUtils.degToRad(2.0);
            parts.camera.rotation.z =
              Math.sin(t * 0.55 + 0.8) * THREE.MathUtils.degToRad(1.2);
          }
        
        // たまに拍手っぽく動く人は、腕を前に出す動きをする。これで、拍手しているような動きができて、観客の動きにバリエーションができて見た目が良くなるようになる。
        } else if (anim.clapLike) {
          // 拍手の動きの進行度を計算する。これで、拍手の動きが時間の経過に応じて変化し、観客の動きがよりリアルになるようになる。
          const clap = Math.max(0, Math.sin(t * 3.2));

          // 左腕の角度を動かす。これで、腕が前に出す動きをして拍手しているような感じが出て、観客の動きがリアルになるようになる。
          if (parts.leftUpperArm) {
            parts.leftUpperArm.rotation.x =
              THREE.MathUtils.degToRad(10) + clap * THREE.MathUtils.degToRad(5);
            parts.leftUpperArm.rotation.z =
              THREE.MathUtils.degToRad(-23) + clap * THREE.MathUtils.degToRad(8);
          }

          // 右腕の角度を動かす。これで、腕が前に出す動きをして拍手しているような感じが出て、観客の動きがリアルになるようになる。
          if (parts.rightUpperArm) {
            parts.rightUpperArm.rotation.x =
              THREE.MathUtils.degToRad(10) + clap * THREE.MathUtils.degToRad(5);
            parts.rightUpperArm.rotation.z =
              THREE.MathUtils.degToRad(23) - clap * THREE.MathUtils.degToRad(8);
          }

          // 前腕の角度と位置を動かす。これで、前腕も前に出す動きをして拍手しているような感じが出て、観客の動きがリアルになるようになる。
          if (parts.leftForeArm) {
            const base = parts.leftForeArm.userData.basePosition;
            parts.leftForeArm.rotation.x =
              clap * THREE.MathUtils.degToRad(4);
            parts.leftForeArm.rotation.z =
              THREE.MathUtils.degToRad(-8) + clap * THREE.MathUtils.degToRad(10);
            parts.leftForeArm.position.set(
              base.x + clap * 0.006,
              base.y,
              base.z
            );
          }

          // 前腕の角度と位置を動かす。これで、前腕も前に出す動きをして拍手しているような感じが出て、観客の動きがリアルになるようになる。
          if (parts.rightForeArm) {
            const base = parts.rightForeArm.userData.basePosition;
            parts.rightForeArm.rotation.x =
              clap * THREE.MathUtils.degToRad(4);
            parts.rightForeArm.rotation.z =
              THREE.MathUtils.degToRad(8) - clap * THREE.MathUtils.degToRad(10);
            parts.rightForeArm.position.set(
              base.x - clap * 0.006,
              base.y,
              base.z
            );
          }
        
        // その他の人は、腕をゆらゆらさせる。これで、腕が自然に動いているように見え、観客の動きがよりリアルになるようになる。
        } else {
          // 腕の動きを計算する。これで、腕がゆらゆらと動いているように見え、観客の動きがよりリアルになるようになる。
          const armMove = Math.sin(t * 0.9) * anim.armSwing;
          const armMove2 = Math.sin(t * 0.9 + 0.35) * anim.armSwing * 0.45;
          const leftUpperBaseX = THREE.MathUtils.degToRad(10);
          const rightUpperBaseX = THREE.MathUtils.degToRad(10);
          const leftUpperBaseZ = THREE.MathUtils.degToRad(-23);
          const rightUpperBaseZ = THREE.MathUtils.degToRad(23);

          // 左上腕の角度を動かす。これで、腕がゆらゆらと動いているように見え、観客の動きがよりリアルになるようになる。
          if (parts.leftUpperArm) {
            parts.leftUpperArm.rotation.x = leftUpperBaseX + armMove;
            parts.leftUpperArm.rotation.z = leftUpperBaseZ + armMove2;
          }

          // 右上腕の角度を動かす。これで、腕がゆらゆらと動いているように見え、観客の動きがよりリアルになるようになる。
          if (parts.rightUpperArm) {
            parts.rightUpperArm.rotation.x = rightUpperBaseX - armMove;
            parts.rightUpperArm.rotation.z = rightUpperBaseZ - armMove2;
          }

          // 左前腕の角度と位置を動かす。これで、前腕もゆらゆらと動いているように見え、観客の動きがよりリアルになるようになる。
          if (parts.leftForeArm) {
            const base = parts.leftForeArm.userData.basePosition;
            parts.leftForeArm.rotation.x = armMove * 0.55;
            parts.leftForeArm.rotation.z = armMove2 * 0.55;
            parts.leftForeArm.position.set(
              base.x,
              base.y + Math.sin(t * 0.9 + 0.2) * 0.004,
              base.z + Math.sin(t * 0.9 + 0.2) * 0.003
            );
          }

          // 右前腕の角度と位置を動かす。これで、前腕もゆらゆらと動いているように見え、観客の動きがよりリアルになるようになる。
          if (parts.rightForeArm) {
            const base = parts.rightForeArm.userData.basePosition;
            parts.rightForeArm.rotation.x = -armMove * 0.55;
            parts.rightForeArm.rotation.z = -armMove2 * 0.55;
            parts.rightForeArm.position.set(
              base.x,
              base.y + Math.sin(t * 0.9 + 0.2) * 0.004,
              base.z + Math.sin(t * 0.9 + 0.2) * 0.003
            );
          }
        }
      }
    } 

    // ============================================================
    // 5. 的・スコア判定
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: 的、支柱、三脚を目標距離に合わせてまとめて生成する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createTargetSystem() {
      const targetGroup = new THREE.Group();
      // 的の半径と厚みを設定する。これで、的のサイズが適切になり、ゲームの雰囲気がよりリアルになるようになる。
      game.targetRadius = 0.8;
      const targetThickness = 0.14;

      // 開始視点から targetDistance だけ前方へ置く
      const targetCenter = new THREE.Vector3(
        0,
        1.6,
        game.camera.position.z - game.targetDistance
      );

      // 的の正面
      const face = new THREE.Mesh(
        new THREE.CircleGeometry(game.targetRadius, 64),
        new THREE.MeshStandardMaterial({
          map: createTargetTexture(),
          roughness: 0.92
        })
      );
      face.position.copy(targetCenter);
      face.position.z += targetThickness / 2 + 0.01;
      targetGroup.add(face);

      // 的の厚み
      const back = new THREE.Mesh(
        new THREE.CylinderGeometry(
          game.targetRadius,
          game.targetRadius,
          targetThickness,
          48,
          1,
          true
        ),
        new THREE.MeshStandardMaterial({
          color: 0xd2b48c,
          roughness: 1.0
        })
      );
      back.position.copy(targetCenter);
      back.rotation.x = Math.PI / 2;
      targetGroup.add(back);

      // 三脚スタンド
      const standMaterial = new THREE.MeshStandardMaterial({
        color: 0x6b4f2a,
        roughness: 1.0
      });

      // 支柱を start から end まで追加する関数
      function addSupportBetweenPoints(start, end, radius = 0.03) {
        const dir = new THREE.Vector3().subVectors(end, start);
        const length = dir.length();

        // 支柱のジオメトリを作る。CylinderGeometry を使って、支柱の形状を作る。これで、支柱の見た目がリアルになり、ゲームの雰囲気がより良くなるようになる。
        const leg = new THREE.Mesh(
          new THREE.CylinderGeometry(radius, radius * 1.15, length, 12),
          standMaterial
        );

        // 支柱の位置を start と end の中間点に設定する。これで、支柱が正しい位置に配置され、見た目が自然になるようになる。
        const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
        leg.position.copy(mid);
        leg.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          dir.clone().normalize()
        );

        targetGroup.add(leg);
      }

      // --------------------------------------------------
      // 以降は targetCenter からの相対座標で組む
      // これで距離を変えても的全体が崩れない
      // --------------------------------------------------

      // 支柱の合体点（的の上部中央）
      const topJointPos = targetCenter.clone().add(new THREE.Vector3(0.00, 0.68, -0.10));

      // 前面左支柱：的の表側左
      const frontLeftFoot = targetCenter.clone().add(new THREE.Vector3(-0.70, -1.60, 0.02));

      // 前面右支柱：的の表側右
      const frontRightFoot = targetCenter.clone().add(new THREE.Vector3(0.70, -1.60, 0.02));

      // 後部中央支柱：後ろから支える
      const rearCenterFoot = targetCenter.clone().add(new THREE.Vector3(0.00, -1.60, -0.95));

      // 3本の支柱
      addSupportBetweenPoints(frontLeftFoot, topJointPos, 0.060);
      addSupportBetweenPoints(frontRightFoot, topJointPos, 0.060);
      addSupportBetweenPoints(rearCenterFoot, topJointPos, 0.066);

      // 上部ジョイント
      const tripodJoint = new THREE.Mesh(
        new THREE.SphereGeometry(0.085, 16, 16),
        standMaterial
      );
      tripodJoint.position.copy(topJointPos);
      targetGroup.add(tripodJoint);

      // 的の中心位置、正面メッシュ、グループを game に保存する。これで、後で的の位置や状態を参照できるようになり、ゲームの進行に必要な情報が保持されるようになる。
      game.targetFace = face;
      game.targetGroup = targetGroup;
      game.targetCenter = targetCenter.clone();
      game.scene.add(targetGroup);
    }

    /**
     * 役割: 同心円の的テクスチャをCanvasで描画する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createTargetTexture(size = 1024) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      // 2Dコンテキストを取得する。これで、Canvas上に描画するためのコンテキストが得られ、的のテクスチャを描画できるようになる。
      const ctx = canvas.getContext("2d");
      // 背景を白で塗りつぶす。これで、的の背景が白くなり、見た目が自然になるようになる。
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);
      // 的の中心座標を計算する。これで、的の中心位置が得られ、同心円を描画する際の基準点として使えるようになる。
      const cx = size / 2;
      const cy = size / 2;

      // アーチェリーの的 (FITA/WA 標準ターゲット配色)
      // 外側から中心に向かって描画
      const unit = (size / 2) / 10;

      // 同心円の半径と色を定義する。これで、的の各リングのサイズと色が決まり、描画する際に使えるようになる。
      const rings = [
        // White (1, 2)
        { r: unit * 10, color: "#ffffff", stroke: "#d0d0d0" },
        { r: unit * 9,  color: "#ffffff", stroke: "#d0d0d0" },
        // Black (3, 4)
        { r: unit * 8,  color: "#111111", stroke: "#555555" },
        { r: unit * 7,  color: "#111111", stroke: "#555555" },
        // Blue (5, 6)
        { r: unit * 6,  color: "#0099ff", stroke: "rgba(0,0,0,0.2)" },
        { r: unit * 5,  color: "#0099ff", stroke: "rgba(0,0,0,0.2)" },
        // Red (7, 8)
        { r: unit * 4,  color: "#ff0000", stroke: "rgba(0,0,0,0.2)" },
        { r: unit * 3,  color: "#ff0000", stroke: "rgba(0,0,0,0.2)" },
        // Gold (9, 10)
        { r: unit * 2,  color: "#ffe500", stroke: "rgba(160,140,0,0.4)" },
        { r: unit * 1,  color: "#ffe500", stroke: "rgba(160,140,0,0.4)" }
      ];

      // 線の太さを設定する。これで、的のリングの境界線が適切な太さで描画され、見た目が自然になるようになる。
      ctx.lineWidth = size * 0.003;

      // 各リングを描画する。これで、的の同心円が順番に描画され、見た目が完成するようになる。
      for (const ring of rings) {
        // 円を描く。これで、的の各リングが描画され、見た目が完成するようになる。
        ctx.beginPath();
        ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
        ctx.closePath();
        // 塗りつぶす。これで、的の各リングが指定された色で塗りつぶされ、見た目が完成するようになる。
        ctx.fillStyle = ring.color;
        ctx.fill();
        // 境界線を描く。これで、的の各リングの境界線が描画され、見た目が完成するようになる。
        ctx.strokeStyle = ring.stroke;
        ctx.stroke();
      }

      // 中心点 (+)
      ctx.fillStyle = "#222222";
      ctx.font = `bold ${unit * 0.6}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("+", cx, cy);

      // 生成したCanvasをThree.jsのテクスチャとして使用する。これで、的のテクスチャがThree.jsのマテリアルに適用され、3Dシーンで表示できるようになる。
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      texture.anisotropy = game.renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    // ============================================================
    // 6. 弓モデル・矢モデル
    // ------------------------------------------------------------
    // この章では関連する処理を近くにまとめ、後から調整しやすくしている。
    // ============================================================

    /**
     * 役割: 手元に表示する弓全体のルート、弦、装填矢を作る。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createBowSystem() {
      // bowRoot はカメラに追従する“手元”全体
      const bowRoot = new THREE.Group();

      // 弓本体
      const bowGroup = createBowModel();
      bowRoot.add(bowGroup);

      // 装填中の矢
      const loadedArrow = createArrowModel();
      bowRoot.add(loadedArrow);

      // カメラにぶら下げる
      game.camera.add(bowRoot);
      game.scene.add(game.camera);

      // Three.jsオブジェクトを game に保存する。これで、弓のルート、弦、装填矢がゲームの状態として保持され、後で参照できるようになる。
      game.bowRoot = bowRoot;
      game.loadedArrow = loadedArrow;

      // 装填中の矢を弓の追従対象として登録
      if (bowGroup?.userData?.attachArrow) {
        bowGroup.userData.attachArrow(loadedArrow);
      }

      // 初期状態を反映する。これで、弓の表示位置や拡大率が画面サイズに応じて調整され、ゲームの見た目が適切になるようになる。
      updateLoadedArrowVisual();
      updateBowDraw(0);
      applyResponsiveBowLayout();
    }

    /**
     * 役割: 画面サイズに応じて弓の表示位置・拡大率を調整する。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function applyResponsiveBowLayout() {
      if (!game.bowRoot) return;

      // 画面サイズに応じて弓の表示位置・拡大率を調整する。これで、弓が画面サイズに適切に表示され、ゲームの見た目が良くなるようになる。
      const isPortrait = window.innerHeight > window.innerWidth;
      const isMobilePortrait = isTouchDevice && isPortrait;

      if (isMobilePortrait) {
        // 縦画面スマホでは弓を少し内側に寄せて小さくする
        game.bowRoot.position.set(-0.18, -0.10, 0.00);
        game.bowRoot.scale.set(0.82, 0.82, 0.82);
        // 少しだけ広く見せる
        game.camera.fov = 78;
      } else {
        // それ以外は従来どおり
        game.bowRoot.position.set(0, 0, 0);
        game.bowRoot.scale.set(1, 1, 1);
        // 標準的な視野角
        game.camera.fov = 70;
      }

      game.camera.updateProjectionMatrix();
    }

    /**
     * 役割: 弓のライザー、上下リム、チップ、弦などを組み立てる。
     * 処理単位:
     * - 入力値や現在状態を読み取る。
     * - 必要なThree.jsオブジェクト、ゲーム状態、DOM表示を更新する。
     * - 後続処理が参照しやすいよう、結果を game または userData に反映する。
     */
    function createBowModel() {
      const bowGroup = new THREE.Group();

      // --------------------------------------------------
      // 基本設定
      // --------------------------------------------------
      // 弓の基準位置を設定する。これで、弓の表示位置が適切になり、ゲームの見た目が良くなるようになる。
      const baseX = 0.58;
      const baseY = -0.34;
      const baseZ = -1.02;
      // 弓の半分の長さを設定する。これで、弓のサイズが適切になり、ゲームの見た目が良くなるようになる。
      const bowHalfLen = 0.90;
      // 装填中の矢が最大でどれだけ後退するか
      const maxDraw = 0.38;
      const bowTiltY = 0.17;
      // ハンドルを向きはここで回転させる(0の時真横、-5でゲームの向きに)
      const riserYawOffset = -5.00;

      // --------------------------------------------------
      // 材質
      // --------------------------------------------------
      // limbMaterial はリムの材質を設定する。これで、リムの見た目が適切になり、ゲームの雰囲気がよりリアルになるようになる。
      const limbMaterial = new THREE.MeshStandardMaterial({
        color: 0xd7d8de,
        roughness: 0.34,
        metalness: 0.16
      });

      // riserMaterial はライザーの材質を設定する。これで、ライザーの見た目が適切になり、ゲームの雰囲気がよりリアルになるようになる。
      const riserMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.42,   
        metalness: 0.15    
      });

      // pocketMaterial はポケットの材質を設定する。これで、ポケットの見た目が適切になり、ゲームの雰囲気がよりリアルになるようになる。
      const pocketMaterial = new THREE.MeshStandardMaterial({
        color: 0x9ca7b6,
        roughness: 0.30,
        metalness: 0.50
      });

      // gripMaterial はグリップの材質を設定する。これで、グリップの見た目が適切になり、ゲームの雰囲気がよりリアルになるようになる。
      const gripMaterial = new THREE.MeshStandardMaterial({
        color: 0x1a1a1d,
        roughness: 0.92,
        metalness: 0.04
      });

      // detailMaterial は細部の材質を設定する。これで、細部の見た目が適切になり、ゲームの雰囲気がよりリアルになるようになる。
      const detailMaterial = new THREE.MeshStandardMaterial({
        color: 0xbcc5d2,
        roughness: 0.25,
        metalness: 0.92
      });

      // darkDetailMaterial は暗い細部の材質を設定する。これで、暗い細部の見た目が適切になり、ゲームの雰囲気がよりリアルになるようになる。
      const darkDetailMaterial = new THREE.MeshStandardMaterial({
        color: 0x14171b,
        roughness: 0.52,
        metalness: 0.46
      });

      // stringMaterial は弦の材質を設定する。これで、弦の見た目が適切になり、ゲームの雰囲気がよりリアルになるようになる。
      const stringMaterial = new THREE.LineBasicMaterial({
        color: 0xdcdcdc
      });

      // --------------------------------------------------
      // 座標変換
      // --------------------------------------------------
      function toWorld(local) {
        // local は弓のローカル座標を表す。これで、弓の各部品の位置をローカル座標で指定でき、後でワールド座標に変換して表示できるようになる。
        return local.clone()
          .applyEuler(new THREE.Euler(0, bowTiltY, 0, "XYZ"))
          .add(new THREE.Vector3(baseX, baseY, baseZ));
      }

      //--------------------------------------------------
      // 座標変換を適用する関数
      // --------------------------------------------------
      function applyLocalTransform(object3D, localPos) {
        object3D.position.copy(toWorld(localPos));
        object3D.rotation.set(0, bowTiltY, 0, "XYZ");
      }

      // --------------------------------------------------
      // リム中心線
      // 返りのある現代リカーブ風
      // --------------------------------------------------
      function createUpperLimbCurve(draw = 0, kick = 0, stringLocals = null) {
        const locals = stringLocals ?? getStringLocals(draw, kick);

        // 先端は弦端に接続したまま
        const tipTarget = locals.topLocal.clone();

        // 傾き方向は「矢と弦の接続点」
        const bendTarget = locals.midLocal.clone();

        // 根元は固定
        const root = new THREE.Vector3(0.000, 0.286, -0.002);

        // 傾き方向は root → midLocal
        const bendDir = bendTarget.clone().sub(root).normalize();

        // tip接続用の方向は別で持つ
        const tipDir = tipTarget.clone().sub(root).normalize();

        const flex = draw * 0.062 + kick * 0.022;
        const tiltVec = bendDir.clone().multiplyScalar(flex * 0.95);

        // 形状だけ自然なラインへ調整
        const p1 = new THREE.Vector3(0.004, 0.334, 0.004);
        const p2 = new THREE.Vector3(0.008, 0.428, 0.012);
        const p3 = new THREE.Vector3(0.013, 0.525, 0.024);
        const p4 = new THREE.Vector3(0.016, 0.622, 0.040);
        const p5 = new THREE.Vector3(0.015, 0.715, 0.060);
        const p6 = new THREE.Vector3(0.008, 0.804, 0.086);

        // 根元から先端へだんだん大きく、midLocal方向へ傾ける
        p1.addScaledVector(tiltVec, 0.10);
        p2.addScaledVector(tiltVec, 0.24);
        p3.addScaledVector(tiltVec, 0.42);
        p4.addScaledVector(tiltVec, 0.62);
        p5.addScaledVector(tiltVec, 0.82);
        p6.addScaledVector(tiltVec, 1.00);

        // 先端側だけは弦端接続に向けて少し戻す
        p5.addScaledVector(tipDir, flex * 0.03);
        p6.addScaledVector(tipDir, flex * 0.05);

        // tip直前の折れを防ぐ
        p6.x = THREE.MathUtils.lerp(p6.x, tipTarget.x, 0.08);
        p6.y = THREE.MathUtils.lerp(p6.y, tipTarget.y, 0.04);
        p6.z = THREE.MathUtils.lerp(p6.z, tipTarget.z, 0.08);

        // Catmull-Romスプラインで滑らかに接続する
        return new THREE.CatmullRomCurve3([
          root, p1, p2, p3, p4, p5, p6, tipTarget
        ]);
      }

      //--------------------------------------------------
      // リム中心線
      // 返りのある現代リカーブ風
      //--------------------------------------------------
      function createLowerLimbCurve(draw = 0, kick = 0, stringLocals = null) {
        // locals は弦の接続点のローカル座標を取得する。これで、弦の接続点の位置が得られ、リムの形状を計算する際に使用できるようになる。
        const locals = stringLocals ?? getStringLocals(draw, kick);
        // tipTarget は弦端の位置を表す。これで、リムの先端が弦に接続される位置が決まり、リムの形状を計算する際に使用できるようになる。
        const tipTarget = locals.botLocal.clone();
        // bendTarget は弦の中間点の位置を表す。これで、リムの傾き方向が決まり、リムの形状を計算する際に使用できるようになる。
        const bendTarget = locals.midLocal.clone();
        // root はリムの根元の位置を表す。これで、リムの基準点が決まり、リムの形状を計算する際に使用できるようになる。
        const root = new THREE.Vector3(0.000, -0.286, -0.002);
        // bendDir はリムの傾き方向を表す。これで、リムの形状を計算する際に使用できるようになる。
        const bendDir = bendTarget.clone().sub(root).normalize();
        // tipDir はリムの先端方向を表す。これで、リムの形状を計算する際に使用できるようになる。
        const tipDir = tipTarget.clone().sub(root).normalize();
        // flex はリムのしなり具合を計算する。これで、リムの形状が適切に変化し、弓の見た目がリアルになるようになる。
        const flex = draw * 0.062 + kick * 0.022;
        // tiltVec はリムの傾きベクトルを計算する。これで、リムの形状が適切に変化し、弓の見た目がリアルになるようになる。
        const tiltVec = bendDir.clone().multiplyScalar(flex * 0.95);

        // 上側と対称になるように形状だけ調整
        const p1 = new THREE.Vector3(0.004, -0.334, 0.004);
        const p2 = new THREE.Vector3(0.008, -0.428, 0.012);
        const p3 = new THREE.Vector3(0.013, -0.525, 0.024);
        const p4 = new THREE.Vector3(0.016, -0.622, 0.040);
        const p5 = new THREE.Vector3(0.015, -0.715, 0.060);
        const p6 = new THREE.Vector3(0.008, -0.804, 0.086);

        // 根元から先端へだんだん大きく、midLocal方向へ傾ける
        p1.addScaledVector(tiltVec, 0.10);
        p2.addScaledVector(tiltVec, 0.24);
        p3.addScaledVector(tiltVec, 0.42);
        p4.addScaledVector(tiltVec, 0.62);
        p5.addScaledVector(tiltVec, 0.82);
        p6.addScaledVector(tiltVec, 1.00);

        // 先端側だけは弦端接続に向けて少し戻す
        p5.addScaledVector(tipDir, flex * 0.03);
        p6.addScaledVector(tipDir, flex * 0.05);

        // tip直前の折れを防ぐ
        p6.x = THREE.MathUtils.lerp(p6.x, tipTarget.x, 0.08);
        p6.y = THREE.MathUtils.lerp(p6.y, tipTarget.y, 0.04);
        p6.z = THREE.MathUtils.lerp(p6.z, tipTarget.z, 0.08);

        // Catmull-Romスプラインで滑らかに接続する
        return new THREE.CatmullRomCurve3([
          root, p1, p2, p3, p4, p5, p6, tipTarget
        ]);
      }

      // --------------------------------------------------
      // リム断面: 根元太く・平べったく、先端へ細く
      // --------------------------------------------------
      function createTaperedLimbGeometry(curve) {
        // tubularSegments はリムの長さ方向の分割数を設定する。これで、リムの形状が滑らかになり、見た目が自然になる
        const tubularSegments = 72;
        // radialSegments はリムの断面の分割数を設定する。これで、リムの
        const radialSegments = 18;
        // frames はリムの中心線に沿ったフレームを計算する。これで、リムの形状が適切に変化し、見た目が自然になるようになる。
        const frames = curve.computeFrenetFrames(tubularSegments, false);

        const positions = [];
        const normals = [];
        const uvs = [];
        const indices = [];

        // リムの断面を作る
        for (let i = 0; i <= tubularSegments; i++) {
          // t はリムの長さ方向のパラメータを計算する。これで、リムの形状が滑らかになり、見た目が自然になるようになる。
          const t = i / tubularSegments;
          // p はリムの中心線上の点を取得する。これで、リムの形状が適切に変化し、見た目が自然になるようになる。
          const p = curve.getPointAt(t);
          // n はリムの法線ベクトルを取得する。これで、リムの断面の向きが決まり、見た目が自然になるようになる。
          const n = frames.normals[i].clone().normalize();
          // b はリムの二法線ベクトルを取得する。これで、リムの断面の向きが決まり、見た目が自然になるようになる。
          const b = frames.binormals[i].clone().normalize();
          // 根元: 幅広で厚め / 先端: 細く薄い
          const width = THREE.MathUtils.lerp(0.050, 0.011, t);
          const thickness = THREE.MathUtils.lerp(0.0085, 0.0032, t);

          // リムの断面を作る
          for (let j = 0; j < radialSegments; j++) {
            // a はリムの断面の角度を計算する。これで、リムの断面が円形に近い形状になり、見た目が自然になるようになる。
            const a = (j / radialSegments) * Math.PI * 2;
            // rx はリムの断面の半径を計算する。これで、リムの断面が円形に近い形状になり、見た目が自然になるようになる。
            const rx = Math.cos(a) * width;
            // ry はリムの断面の厚みを計算する。これで、リムの断面が円形に近い形状になり、見た目が自然になるようになる。
            const ry = Math.sin(a) * thickness;
            // pos はリムの断面上の点を計算する。これで、リムの断面が円形に近い形状になり、見た目が自然になるようになる。
            const pos = new THREE.Vector3()
              .copy(p)
              .addScaledVector(n, rx)
              .addScaledVector(b, ry);

            // positions 配列にリムの断面上の点の座標を追加する。これで、リムの形状が適切に変化し、見た目が自然になるようになる。
            positions.push(pos.x, pos.y, pos.z);

            // normals 配列にリムの断面上の点の法線ベクトルを追加する。これで、リムの形状が適切に変化し、見た目が自然になるようになる。
            const normal = new THREE.Vector3()
              .copy(n).multiplyScalar(Math.cos(a))
              .addScaledVector(b, Math.sin(a))
              .normalize();
            normals.push(normal.x, normal.y, normal.z);

            // uvs 配列にリムの断面上の点のUV座標を追加する。これで、リムの形状が適切に変化し、見た目が自然になるようになる。
            uvs.push(j / radialSegments, t);
          }
        }

        // インデックスを作る
        for (let i = 0; i < tubularSegments; i++) {
          for (let j = 0; j < radialSegments; j++) {
            const a = i * radialSegments + j;
            const b = i * radialSegments + ((j + 1) % radialSegments);
            const c = (i + 1) * radialSegments + j;
            const d = (i + 1) * radialSegments + ((j + 1) % radialSegments);
            indices.push(a, c, b);
            indices.push(b, c, d);
          }
        }

        // BufferGeometry を作る。これで、リムの形状が適切に変化し、見た目が自然になるようになる。
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.computeBoundingSphere();
        return geo;
      }

      // --------------------------------------------------
      // riser 外形
      // --------------------------------------------------
      function createRiserShape() {
        const s = new THREE.Shape();

        // --------------------------------------------------
        // メンテしやすいように、外形を「点列」で定義する
        // 頂点を増減するだけでシルエット調整できる
        // --------------------------------------------------
        const points = [
          // 開始: 左下
          new THREE.Vector2(-0.040, -0.430),

          // -----------------------------
          // 腹側（弦を引く側）
          // -----------------------------
          // 下端の面取り
          new THREE.Vector2(-0.062, -0.402),
          new THREE.Vector2(-0.060, -0.350),
          new THREE.Vector2(-0.050, -0.305),
          new THREE.Vector2(-0.040, -0.245),
          new THREE.Vector2(-0.030, -0.185),
          new THREE.Vector2(-0.020, -0.120),

          // グリップ付近のえぐれ
          new THREE.Vector2(-0.010, -0.070),
          new THREE.Vector2(-0.010, -0.020),
          new THREE.Vector2(-0.010,  0.030),
          new THREE.Vector2(-0.010,  0.108),

          // 上側へ
          new THREE.Vector2(-0.020,  0.150),
          new THREE.Vector2(-0.030,  0.215),
          new THREE.Vector2(-0.040,  0.275),
          new THREE.Vector2(-0.050,  0.335),
          new THREE.Vector2(-0.060,  0.384),

          // 上端の面取り
          new THREE.Vector2(0.010, 0.418),

          // -----------------------------
          // 背中側（矢を放つ側）
          // -----------------------------
          new THREE.Vector2(0.026, 0.385),
          new THREE.Vector2(0.066, 0.320),
          new THREE.Vector2(0.084, 0.230),
          new THREE.Vector2(0.096, 0.120),

          new THREE.Vector2(0.096, -0.140),
          new THREE.Vector2(0.084, -0.250),
          new THREE.Vector2(0.066, -0.340),
          new THREE.Vector2(0.026, -0.400),

          // 下端を閉じる
          new THREE.Vector2(0.010, -0.430)
        ];

        // 形状を定義する
        s.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          s.lineTo(points[i].x, points[i].y);
        }
        s.closePath();
        return s;
      }

      //--------------------------------------------------
      // riser メッシュを作る
      //--------------------------------------------------
      function createRiserMesh() {
        // riserGroup はライザーのメッシュをまとめるグループを作る。これで、ライザーの各部品をまとめて管理でき、後で一括して操作できるようになる。
        const riserGroup = new THREE.Group();
        // fullDepth はライザーの全体の奥行きを設定する。これで、ライザーの厚みが適切になり、見た目が自然になるようになる。
        const fullDepth = 0.06;
        // insetDepth はライザーのくぼみの奥行きを設定する。これで、ライザーのくぼみが適切になり、見た目が自然になるようになる。
        const insetDepth = 0.030;
        // frontZ はライザーの前面のZ座標を設定する。これで、ライザーの前面が適切な位置に配置され、見た目が自然になるようになる。
        const frontZ = fullDepth;
        // backZ はライザーの背面のZ座標を設定する。これで、ライザーの背面が適切な位置に配置され、見た目が自然になるようになる。
        const backZ = 0.0;
        // recessedBackZ はライザーのくぼみの背面のZ座標を設定する。これで、ライザーのくぼみが適切な位置に配置され、見た目が自然になるようになる。
        const recessedBackZ = backZ + insetDepth;

        // riserMaterial を複製して、baseMat と wallMat を作る。これで、ライザーの前面と側面の材質を個別に設定でき、見た目が自然になるようになる。
        const baseMat = riserMaterial.clone();
        const wallMat = riserMaterial.clone();
        baseMat.side = THREE.DoubleSide;
        wallMat.side = THREE.DoubleSide;

        // --------------------------------------------------
        // 1) 前面
        // --------------------------------------------------
        const frontShape = createRiserShape();
        const frontGeo = new THREE.ShapeGeometry(frontShape, 128);
        const frontMesh = new THREE.Mesh(frontGeo, baseMat);
        frontMesh.position.z = frontZ;
        riserGroup.add(frontMesh);

        // --------------------------------------------------
        // 2) 外周側壁
        // くぼみ帯の左右だけ奥側を recessedBackZ にする
        // --------------------------------------------------
        const outerWall = createMatchedOuterWall(
          frontZ,
          backZ,
          recessedBackZ,
          wallMat
        );
        riserGroup.add(outerWall);

        // --------------------------------------------------
        // 3) 背面上部
        // --------------------------------------------------
        const backTopShape = createBackTopShape();
        const backTopGeo = new THREE.ShapeGeometry(backTopShape, 128);
        const backTopMesh = new THREE.Mesh(backTopGeo, wallMat);
        backTopMesh.position.z = backZ;
        riserGroup.add(backTopMesh);

        // --------------------------------------------------
        // 4) 背面下部
        // --------------------------------------------------
        const backBottomShape = createBackBottomShape();
        const backBottomGeo = new THREE.ShapeGeometry(backBottomShape, 128);
        const backBottomMesh = new THREE.Mesh(backBottomGeo, wallMat);
        backBottomMesh.position.z = backZ;
        riserGroup.add(backBottomMesh);

        // --------------------------------------------------
        // 5) くぼみ底面
        // --------------------------------------------------
        const recessShape = createRecessBandShape();
        const recessGeo = new THREE.ShapeGeometry(recessShape, 128);
        const recessMesh = new THREE.Mesh(recessGeo, wallMat);
        recessMesh.position.z = recessedBackZ;
        riserGroup.add(recessMesh);

        // --------------------------------------------------
        // 6) くぼみ上端・下端の段差壁
        // --------------------------------------------------
        riserGroup.add(createQuadWall(
          new THREE.Vector2(-0.030, 0.280),
          new THREE.Vector2( 0.060, 0.280),
          backZ,
          recessedBackZ,
          wallMat
        ));
        riserGroup.add(createQuadWall(
          new THREE.Vector2(-0.018, 0.000),
          new THREE.Vector2( 0.082, 0.000),
          recessedBackZ,
          backZ,
          wallMat
        ));

        // --------------------------------------------------
        // 8) グラデーション復活
        // --------------------------------------------------
        applyVerticalGradientToGroup(riserGroup);

        // --------------------------------------------------
        // 9) 中央へ寄せて縮小
        // --------------------------------------------------
        const box = new THREE.Box3().setFromObject(riserGroup);
        const center = box.getCenter(new THREE.Vector3());

        riserGroup.position.sub(center);
        riserGroup.scale.set(0.78, 0.78, 1.0);

        return riserGroup;
      }

      // --------------------------------------------------
      // 外周側壁を作る
      // くぼみ帯の左右だけ奥側を recessedBackZ にする
      // --------------------------------------------------
      function createMatchedOuterWall(frontZ, backZ, recessedBackZ, material) {
        const positions = [];

        // --------------------------------------------------
        // 外周輪郭を、
        // 5) くぼみ底面
        // 6) 上端・下端段差壁
        // の頂点に合わせて分割した点列
        // --------------------------------------------------
        const points = [
          // 下側通常部
          new THREE.Vector2(-0.040, -0.430),
          new THREE.Vector2(-0.062, -0.402),
          new THREE.Vector2(-0.060, -0.350),
          new THREE.Vector2(-0.050, -0.305),
          new THREE.Vector2(-0.040, -0.245),
          new THREE.Vector2(-0.030, -0.185),
          new THREE.Vector2(-0.020, -0.120),
          new THREE.Vector2(-0.010, -0.070),
          new THREE.Vector2(-0.010, -0.020),

          // --------------------------------------------------
          // 下端段差壁との一致点
          // createQuadWall(
          //   (-0.018, 0.000) -> (0.082, 0.000),
          //   recessedBackZ -> backZ
          // )
          // --------------------------------------------------
          new THREE.Vector2(-0.018, 0.000),

          // 左側 recess 側壁区間
          new THREE.Vector2(-0.012, 0.040),
          new THREE.Vector2(-0.010, 0.080),
          new THREE.Vector2(-0.010, 0.120),
          new THREE.Vector2(-0.014, 0.170),
          new THREE.Vector2(-0.022, 0.220),

          // --------------------------------------------------
          // 上端段差壁との一致点
          // createQuadWall(
          //   (-0.030, 0.280) -> (0.060, 0.280),
          //   backZ -> recessedBackZ
          // )
          // --------------------------------------------------
          new THREE.Vector2(-0.030, 0.280),

          // 上側通常部
          new THREE.Vector2(-0.040, 0.275),
          new THREE.Vector2(-0.050, 0.335),
          new THREE.Vector2(-0.060, 0.384),
          new THREE.Vector2( 0.010, 0.418),
          new THREE.Vector2( 0.026, 0.385),
          new THREE.Vector2( 0.066, 0.320),

          // --------------------------------------------------
          // 上端段差壁の右端一致点
          // --------------------------------------------------
          new THREE.Vector2(0.060, 0.280),

          // 右側 recess 側壁区間
          new THREE.Vector2(0.072, 0.230),
          new THREE.Vector2(0.082, 0.170),
          new THREE.Vector2(0.088, 0.110),
          new THREE.Vector2(0.088, 0.050),

          // --------------------------------------------------
          // 下端段差壁の右端一致点
          // --------------------------------------------------
          new THREE.Vector2(0.082, 0.000),

          // 右下通常部
          new THREE.Vector2(0.096, -0.140),
          new THREE.Vector2(0.084, -0.250),
          new THREE.Vector2(0.066, -0.340),
          new THREE.Vector2(0.026, -0.400),
          new THREE.Vector2(0.010, -0.430)
        ];

        // --------------------------------------------------
        // recessedBackZ に落とす点
        // 5) createRecessBandShape() の輪郭
        // 6) createQuadWall() の接続点
        // に一致させる
        // --------------------------------------------------
        function isRecessPoint(p) {
          return (
            // 左側 recess
            (Math.abs(p.x - (-0.018)) < 1e-6 && Math.abs(p.y - 0.000) < 1e-6) ||
            (Math.abs(p.x - (-0.012)) < 1e-6 && Math.abs(p.y - 0.040) < 1e-6) ||
            (Math.abs(p.x - (-0.010)) < 1e-6 && Math.abs(p.y - 0.080) < 1e-6) ||
            (Math.abs(p.x - (-0.010)) < 1e-6 && Math.abs(p.y - 0.120) < 1e-6) ||
            (Math.abs(p.x - (-0.014)) < 1e-6 && Math.abs(p.y - 0.170) < 1e-6) ||
            (Math.abs(p.x - (-0.022)) < 1e-6 && Math.abs(p.y - 0.220) < 1e-6) ||
            (Math.abs(p.x - (-0.030)) < 1e-6 && Math.abs(p.y - 0.280) < 1e-6) ||

            // 上端右端
            (Math.abs(p.x - 0.060) < 1e-6 && Math.abs(p.y - 0.280) < 1e-6) ||

            // 右側 recess
            (Math.abs(p.x - 0.072) < 1e-6 && Math.abs(p.y - 0.230) < 1e-6) ||
            (Math.abs(p.x - 0.082) < 1e-6 && Math.abs(p.y - 0.170) < 1e-6) ||
            (Math.abs(p.x - 0.088) < 1e-6 && Math.abs(p.y - 0.110) < 1e-6) ||
            (Math.abs(p.x - 0.088) < 1e-6 && Math.abs(p.y - 0.050) < 1e-6) ||
            (Math.abs(p.x - 0.082) < 1e-6 && Math.abs(p.y - 0.000) < 1e-6)
          );
        }

        //--------------------------------------------------
        // recessedBackZ に落とすか backZ にするかを決める
        //--------------------------------------------------
        function getBackZForPoint(p) {
          return isRecessPoint(p) ? recessedBackZ : backZ;
        }

        // 外周側壁の頂点を作る
        for (let i = 0; i < points.length; i++) {
          const a = points[i];
          const b = points[(i + 1) % points.length];
          const aBackZ = getBackZForPoint(a);
          const bBackZ = getBackZForPoint(b);
          positions.push(
            a.x, a.y, aBackZ,
            b.x, b.y, bBackZ,
            a.x, a.y, frontZ,
            b.x, b.y, bBackZ,
            b.x, b.y, frontZ,
            a.x, a.y, frontZ
          );
        }

        // BufferGeometry を作る
        const geom = new THREE.BufferGeometry();
        geom.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(positions), 3)
        );
        geom.computeVertexNormals();

        return new THREE.Mesh(geom, material);
      }

      // --------------------------------------------------
      // riser に垂直グラデーションを適用する
      // --------------------------------------------------
      function applyVerticalGradientToGroup(group) {
        // riserGroup のバウンディングボックスを計算する
        const box = new THREE.Box3().setFromObject(group);
        const minY = box.min.y;
        const maxY = box.max.y;
        const halfH = Math.max(Math.abs(minY), Math.abs(maxY));

        // centerColor はリムの中央の色を設定する。これで、リムの中央部分が適切な色になり、見た目が自然になるようになる。
        const centerColor = new THREE.Color(0xcfd4db);
        // edgeColor はリムの端の色を設定する。これで、リムの端部分が適切な色になり、見た目が自然になるようになる。
        const edgeColor = new THREE.Color(0x121418);

        // group のワールドマトリクスを更新する
        group.updateMatrixWorld(true);

        // group の全てのオブジェクトをトラバースして、メッシュの頂点カラーを設定する
        group.traverse(obj => {
          if (!obj.isMesh || !obj.geometry?.attributes?.position) return;

          const pos = obj.geometry.attributes.position;
          const colors = [];

          // pos の全ての頂点に対して、頂点カラーを計算する
          for (let i = 0; i < pos.count; i++) {
            const local = new THREE.Vector3(
              pos.getX(i),
              pos.getY(i),
              pos.getZ(i)
            );

            // world は頂点のワールド座標を計算する。これで、頂点の位置が適切に変化し、見た目が自然になるようになる。
            const world = local.clone().applyMatrix4(obj.matrixWorld);

            // t は頂点のY座標の絶対値を半分の高さで割った値を計算する。これで、頂点の位置が適切に変化し、見た目が自然になるようになる。
            let t = Math.abs(world.y) / halfH;
            t = THREE.MathUtils.clamp(Math.pow(t, 0.85), 0, 1);

            // c は頂点カラーを計算する。これで、頂点の色が適切に変化し、見た目が自然になるようになる。
            const c = centerColor.clone().lerp(edgeColor, t);
            colors.push(c.r, c.g, c.b);
          }

          // obj のジオメトリに頂点カラーを設定する
          obj.geometry.setAttribute(
            "color",
            new THREE.Float32BufferAttribute(colors, 3)
          );

          obj.material = obj.material.clone();
          obj.material.vertexColors = true;
        });
      }

      // --------------------------------------------------
      // riser くぼみの段差壁を作る
      // --------------------------------------------------
      function createQuadWall(p1, p2, z1, z2, material) {
        const positions = new Float32Array([
          p1.x, p1.y, z1,
          p2.x, p2.y, z1,
          p1.x, p1.y, z2,

          p2.x, p2.y, z1,
          p2.x, p2.y, z2,
          p1.x, p1.y, z2
        ]);

        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geom.computeVertexNormals();

        return new THREE.Mesh(geom, material);
      }

      // --------------------------------------------------
      // riser くぼみ帯の輪郭を作る
      // --------------------------------------------------
      function createRecessBandShape() {
        const s = new THREE.Shape();

        // --------------------------------------------------
        // 背面に作る「削り込み帯」専用の輪郭
        // 元ライザーのくぼみを保ちたいので、別shapeで明示的に持つ
        // --------------------------------------------------
        const points = [
          // 左下
          new THREE.Vector2(-0.018, 0.000),

          // 左側のくぼみを保ちながら上へ
          new THREE.Vector2(-0.012, 0.040),
          new THREE.Vector2(-0.010, 0.080),
          new THREE.Vector2(-0.010, 0.120),
          new THREE.Vector2(-0.014, 0.170),
          new THREE.Vector2(-0.022, 0.220),
          new THREE.Vector2(-0.030, 0.280),

          // 上端
          new THREE.Vector2(0.060, 0.280),

          // 右側を下へ
          new THREE.Vector2(0.072, 0.230),
          new THREE.Vector2(0.082, 0.170),
          new THREE.Vector2(0.088, 0.110),
          new THREE.Vector2(0.088, 0.050),
          new THREE.Vector2(0.082, 0.000)
        ];

        s.moveTo(points[0].x, points[0].y);

        for (let i = 1; i < points.length; i++) {
          s.lineTo(points[i].x, points[i].y);
        }

        s.closePath();
        return s;
      }

      // --------------------------------------------------
      // riser 背面の上部形状を作る
      // --------------------------------------------------
      function createBackTopShape() {
        const s = new THREE.Shape();

        //--------------------------------------------------
        // 背面上部の輪郭を作る
        //--------------------------------------------------
        const points = [
          new THREE.Vector2(-0.030, 0.280),
          new THREE.Vector2(-0.040, 0.275),
          new THREE.Vector2(-0.050, 0.335),
          new THREE.Vector2(-0.060, 0.384),
          new THREE.Vector2( 0.010, 0.418),
          new THREE.Vector2( 0.026, 0.385),
          new THREE.Vector2( 0.066, 0.320),

        ];

      // --------------------------------------------------
      // riser 背面の下部形状を作る
      // --------------------------------------------------
      function createBackBottomShape() {
        const s = new THREE.Shape();

        //--------------------------------------------------
        // 背面下部の輪郭を作る
        //--------------------------------------------------
        const points = [
          new THREE.Vector2(-0.040, -0.430),
          new THREE.Vector2(-0.062, -0.402),
          new THREE.Vector2(-0.060, -0.350),
          new THREE.Vector2(-0.050, -0.305),
          new THREE.Vector2(-0.040, -0.245),
          new THREE.Vector2(-0.030, -0.185),
          new THREE.Vector2(-0.020, -0.120),
          new THREE.Vector2(-0.010, -0.070),
          new THREE.Vector2(-0.010, -0.020),
          new THREE.Vector2(-0.018,  0.000),
          new THREE.Vector2( 0.082,  0.000),
          new THREE.Vector2( 0.096, -0.140),
          new THREE.Vector2( 0.084, -0.250),
          new THREE.Vector2( 0.066, -0.340),
          new THREE.Vector2( 0.026, -0.400),
          new THREE.Vector2( 0.010, -0.430)

        s.moveTo(points[0].x, points[0].y);

        for (let i = 1; i < points.length; i++) {

        s.closePath();

      }

      // --------------------------------------------------
      // グループ類
      // --------------------------------------------------
      const riserGroup = new THREE.Group();
      const limbGroup = new THREE.Group();
      const tipGroup = new THREE.Group();

      bowGroup.add(riserGroup);
      bowGroup.add(limbGroup);
      bowGroup.add(tipGroup);

      // --------------------------------------------------
      // riser 本体
      // --------------------------------------------------
      const riserMesh = createRiserMesh();
      riserGroup.add(riserMesh);

      // グリップ
      const grip = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.026, 0.118, 8, 18),
        gripMaterial
      );
      // グリップ位置（ライザーの向きと同期しているので他の位置とは設定方法が異なる）
      //　左右（プラスで奥へ）、上下（プラスで上へ）、前後（プラスで右へ）
      grip.position.set(-0.040, -0.100, 0.000);
      grip.rotation.z = 0.12;
      riserGroup.add(grip);

      // サイトバー形状（ハンドルにつけられている部分）
      const sightBar = new THREE.Mesh(
        new THREE.BoxGeometry(0.02, 0.05, 0.30),

      );
      // サイトをライザーのローカル座標系で配置
      // ライザーが-5度回転しているので、サイトを+5度回転させて相殺
      const sightCompensation = 4.9; // Y軸
         
      // 元の位置からY軸周りに補正回転を適用
      const sightBarPos = new THREE.Vector3(0.030, 0.190, -0.100);
      sightBarPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), sightCompensation);
      sightBar.position.copy(sightBarPos);
      sightBar.rotation.set(0.5, sightCompensation, 0.5);
      riserGroup.add(sightBar);

      // サイトアーム形状（サイトバーから出ている標準の棒）
      const sightArm = new THREE.Mesh(
        new THREE.BoxGeometry(0.090, 0.009, 0.009),
        detailMaterial
      );
      const sightArmPos = new THREE.Vector3(0.03, 0.197, -0.230);
      sightArmPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), sightCompensation);
      sightArm.position.copy(sightArmPos);
      sightArm.rotation.set(0, sightCompensation, 0);

      // 標準形状
      const sightRing = new THREE.Mesh(

      const sightRingPos = new THREE.Vector3(-0.035, 0.197, -0.230);

      sightRing.position.copy(sightRingPos);
      sightRing.rotation.set(0, Math.PI + sightCompensation, 0);
      riserGroup.add(sightRing);

      // 標準中央形状（ハンドルにつけられている部分）
      const sightPin = new THREE.Mesh(
        new THREE.BoxGeometry(0.001, 0.015, 0.005),
        detailMaterial
      );
      const sightPinPos = new THREE.Vector3(-0.035, 0.186, -0.230);
      sightPinPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), sightCompensation);
      sightPin.position.copy(sightPinPos);
      sightPin.rotation.set(0, sightCompensation, 0);
      riserGroup.add(sightPin);
      
      // limb pocket（接続部を自然に）
      function createLimbPocket(localY, isUpper) {
        const g = new THREE.Group();

        // ライザー上下端に付く受け座
        const seat = new THREE.Mesh(
          new THREE.BoxGeometry(0.030, 0.040, 0.040),
          pocketMaterial
        );
        seat.position.set(0.010, localY, 0.000);
        g.add(seat);

        // リムへつながる細長いフェード部
        const neck = new THREE.Mesh(
          new THREE.BoxGeometry(0.022, 0.070, 0.026),
